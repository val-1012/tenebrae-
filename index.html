    h.atkCd=1.8/speedMul;
    const target=findTargetForHero(h);
    if(target){
      const baseDmg=heroBaseDmg(h.level)*Math.pow(1.05,h.promo)*(h.buffs.dmg||1);
      const projSpeed=560*(b.artifacts.ash_compass?1.12:1)*(b.traits.skilled_shooter?Math.pow(1.1,b.traits.skilled_shooter):1);
      const shot={type:'heroBolt',x:h.x+8,y:h.y-28,tx:target.x,ty:target.y,target,speed:projSpeed,life:2.4,dmg:baseDmg,hero:h,splash:44*(h.buffs.range||1),color:elementInk(h.hero.el)};
      b.projectiles.push(shot);
      if(b.artifacts.twisted_mirror&&Math.random()<.08)b.projectiles.push({...shot,x:h.x+3,y:h.y-20,dmg:baseDmg*.7,life:2.6});
    }
  }
  const cdMul=(b.artifacts.old_hourglass?.92:1)*(b.traits.focus?Math.pow(.94,b.traits.focus):1)*(h.buffs.cd||1);
  h.skillCd-=dt/cdMul;
  if(h.skillCd<=0){
    const manaCost=h.manaCost*(b.traits.mana_eff?Math.pow(.92,b.traits.mana_eff):1)*(h.buffs.mana||1);
    if(b.mana>=manaCost){b.mana-=manaCost;b.log.manaUsed+=manaCost;b.log.skillUses++;h.skillCd=h.hero.cd;useSkill(h);}
  }
}

function updateProjectiles(dt){
  const b=G.battle;
  b.projectiles=b.projectiles.filter(p=>{
    p.life-=dt;if(p.life<=0)return false;
    if(p.type==='heroBolt'){
      if(!p.target||p.target.dead||p.target.hp<=0){p.target=findTargetForHero();if(!p.target)return false;}
      const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy)||1;
      const step=Math.min(d,p.speed*dt);p.x+=dx/d*step;p.y+=dy/d*step;
      if(d<=Math.max(12,p.target.size*.8)){
        const target=p.target;applyHeroDamage(p.hero,target,p.dmg,false);
        if(b.artifacts.black_candle&&!target.dead)target.dot.push({dps:p.dmg*.18,dur:3,heroId:p.hero?.id});
        for(const e of b.enemies){if(e!==target&&!e.dead&&Math.hypot(e.x-target.x,e.y-target.y)<p.splash)applyHeroDamage(p.hero,e,p.dmg*.45,false);}
        b.effects.push({type:'hit',x:target.x,y:target.y,life:.2,maxLife:.2});return false;
      }
      return true;
    }
    if(p.type==='iceLance'){
      const prevX=p.x,prevY=p.y;p.x+=p.speed*dt;
      for(const e of b.enemies){if(e.dead||p.hitSet?.has(e))continue;
        const minX=Math.min(prevX,p.x),maxX=Math.max(prevX,p.x);
        if(e.x>=minX-12&&e.x<=maxX+12&&Math.abs(e.y-p.y)<22){applyHeroDamage(p.hero,e,p.dmg,true);p.hitSet=p.hitSet||new Set();p.hitSet.add(e);}
      }
      return p.x<1240;
    }
    if(p.type==='homing'){
      if(!p.target||p.target.dead||p.target.hp<=0)return false;
      const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d<18){applyHeroDamage(p.hero,p.target,p.dmg,true);return false;}
      p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt;return true;
    }
    return false;
  });
  // Persistent skill zones
  for(const fx of b.effects){
    if(fx.life<=0)continue;
    if(fx.type==='pool'&&fx.dps){for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)applyHeroDamage(fx.hero,e,fx.dps*dt,true);}}
    if(['storm','blizzard','moth'].includes(fx.type)&&fx.dps){for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r){applyHeroDamage(fx.hero,e,fx.dps*dt,true);if(fx.slow)e.slow=Math.max(e.slow,.25);if(fx.pull)e.x+=(fx.x-e.x)*.35*dt;}}}
    if(fx.type==='orbit'&&fx.dps){for(const e of b.enemies){if(e.dead)continue;const d=Math.hypot(e.x-fx.x,e.y-fx.y);if(Math.abs(d-fx.r)<24&&(!fx.hitSet||!fx.hitSet.has(e))){fx.hitSet=fx.hitSet||new Set();fx.hitSet.add(e);applyHeroDamage(fx.hero,e,fx.dps,true);}}if(fx.hitSet&&fx.life<fx.maxLife-.6)fx.hitSet.clear();}
    if(fx.type==='tentacle'&&fx.dmg){fx.hitTimer=(fx.hitTimer||0)+dt;if(fx.hitTimer>.22&&fx.hits>0){fx.hits--;fx.hitTimer=0;for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<72)applyHeroDamage(fx.hero,e,fx.dmg,true);}}}
    if(fx.type==='gravity'&&fx.dmg){for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)e.x+=(fx.x-e.x)*1.2*dt;}if(fx.life<.12&&!fx.exploded){fx.exploded=true;for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)applyHeroDamage(fx.hero,e,fx.dmg,true);}}}
  }
}

function renderBattle(){
  const cvs=$('#battleCanvas'),ctx=cvs.getContext('2d'),b=G.battle;if(!b)return;
  drawBattleBackground(ctx,false);
  // castle and defensive line
  drawCastleShape(ctx,185,615,.92,G.save.castle.level,b.castleHP/b.castleMax);
  // Ground shadows and actors use painter's order by depth.
  const actors=[...b.heroes.map(h=>({kind:'hero',obj:h,y:h.y})),...b.summons.map(s=>({kind:'summon',obj:s,y:s.y||520})),...b.enemies.filter(e=>!e.dead).map(e=>({kind:'enemy',obj:e,y:e.y}))].sort((a,b)=>a.y-b.y);
  for(const a of actors){if(a.kind==='hero')drawHeroSprite(ctx,a.obj);else if(a.kind==='summon')drawSummon(ctx,a.obj);else drawEnemy(ctx,a.obj);}
  for(const fx of b.effects)drawEffect(ctx,fx,b);
  for(const p of b.projectiles){
    ctx.save();
    if(p.type==='heroBolt'){
      ctx.strokeStyle=p.color||'#f4e7bb';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x-9,p.y+3);ctx.lineTo(p.x+5,p.y-3);ctx.stroke();
      ctx.fillStyle='#fff5cf';ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,Math.PI*2);ctx.fill();
    }else if(p.type==='homing'){ctx.fillStyle='#efb66c';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();}
    else if(p.type==='iceLance'){ctx.strokeStyle='#b9e1e3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-18,p.y);ctx.lineTo(p.x+18,p.y);ctx.stroke();}
    ctx.restore();
  }
  const bosses=b.enemies.filter(e=>e.isBoss&&!e.dead);if(bosses.length){const boss=bosses[0],w=500,x=390,y=76;ctx.fillStyle='rgba(35,40,31,.88)';ctx.fillRect(x,y,w,25);ctx.strokeStyle='#e4dec2';ctx.strokeRect(x,y,w,25);ctx.fillStyle='#8e3f3a';ctx.fillRect(x+2,y+2,w*Math.max(0,boss.hp/boss.maxHp),21);ctx.fillStyle='#fff3d7';ctx.font='13px Georgia';ctx.textAlign='center';ctx.fillText(`${boss.name}  ${Math.max(0,Math.ceil(boss.hp)).toLocaleString()} / ${Math.ceil(boss.maxHp).toLocaleString()}`,x+w/2,y+17);}
}

}

function showCardSelection(info){
  const b=G.battle,timeMin=b.time/60,isTime=!!info.time;
  let weights=getRarityWeights(timeMin);
  weights.legendary=0; // Level-up cards never roll legendary.
  // The guarantee applies to one offered card; the other two keep normal non-legendary odds.
  const catWeights=isTime?{artifact:50,trait:35,hero:15}:{artifact:40,trait:45,hero:15};
  if(isTime&&b.artifacts.seal_key){catWeights.hero+=12;catWeights.artifact-=6;catWeights.trait-=6;}
  const used=new Set(),cards=[];
  function make(cat,forcedRarity=null){
    let pool=[];
    if(cat==='artifact')pool=ARTIFACTS.filter(a=>!b.artifacts[a.id]&&!used.has('a_'+a.id));
    if(cat==='trait')pool=TRAITS.filter(t=>(b.traits[t.id]||0)<t.max&&!used.has('t_'+t.id));
    if(cat==='hero'){
      const options=[];
      for(const h of b.heroes){
        const stacks=h.cardStacks||{};
        for(const u of HERO_UPGRADES)if((stacks[u.id]||0)<u.max&&!used.has(`h_${u.id}_${h.id}`))options.push({...u,cat:'hero',heroId:h.id,heroName:h.hero.name,_key:`h_${u.id}_${h.id}`});
      }
      pool=options;
    }
    if(forcedRarity)pool=pool.filter(x=>x.rarity===forcedRarity);
    if(!pool.length)return null;
    const p=pickWeighted(pool,forcedRarity?{[forcedRarity]:100}:weights);
    const picked={...p,cat:cat==='hero'?'hero':cat,_key:p._key||(cat==='artifact'?'a_':'t_')+p.id};
    if(cat==='hero')picked._key=p._key;
    return picked;
  }
  // Progressive milestone guarantees: 5m Rare, 15m Epic, 35m Legendary.
  let guarantee=null;
  if(info.legendary||info.minute===35)guarantee='legendary';
  else if(isTime&&info.minute>=15)guarantee='epic';
  else if(isTime&&info.minute>=5)guarantee='rare';
  if(guarantee){
    let forced=null;
    for(const cat of ['artifact','trait','hero']){forced=make(cat,guarantee);if(forced)break;}
    if(forced){used.add(forced._key);cards.push(forced);}
  }
  let guard=0;
  while(cards.length<3&&guard++<80){
    const roll=Math.random()*100;let cat=roll<catWeights.artifact?'artifact':roll<catWeights.artifact+catWeights.trait?'trait':'hero';
    let p=make(cat);
    if(!p){for(const fallback of ['artifact','trait','hero']){p=make(fallback);if(p)break;}}
    if(p&&!used.has(p._key)){used.add(p._key);cards.push(p);}
  }
  // If a category has no available upgrades, duplicate-free fallback can still fill from remaining pools.
  if(!cards.length){cards.push({id:'breath',name:'숨 고르기',rarity:'common',cat:'trait',desc:'성 체력 4% 회복',icon:'✚',_key:'t_breath'});}
  const row=$('#cardRow');row.innerHTML='';
  for(const c of cards){
    const el=document.createElement('div');el.className='card '+rarityToClass(c.rarity);
    const catKo=c.cat==='artifact'?'아티팩트':c.cat==='trait'?'특성':'영웅 강화';
    const desc=c.cat==='hero'?`[${c.heroName}] ${c.desc}`:c.desc;
    el.innerHTML=`<div class="cardArt"><img src="${cardSigilUrl(c)}" alt="${c.name}"></div><div class="cardCat">${catKo}</div><div class="cardName">${c.name}</div><div class="cardDesc">${desc}</div><div class="cardRarity">${rarityKo(c.rarity)}</div>`;
    el.onclick=()=>selectCard(c);row.appendChild(el);
  }
  $('#cardSubTxt').textContent=isTime?`⏱ ${info.minute}분 시간 보상${guarantee?` — ${rarityKo(guarantee)} 등급 1장 이상 보장`:''}`:`레벨 ${b.level} 달성 — 카드를 선택하세요`;
  $('#cardModal').classList.add('open');
}
function forceRarityCard(rarity){
  for(const a of ARTIFACTS){if(a.rarity===rarity&&!G.battle.artifacts[a.id])return {...a,cat:'artifact',_key:'a_'+a.id};}
  for(const t of TRAITS){if(t.rarity===rarity&&(G.battle.traits[t.id]||0)<t.max)return {...t,cat:'trait',_key:'t_'+t.id};}
  const h=G.battle.heroes[0];if(h){const u=HERO_UPGRADES.find(x=>x.rarity===rarity);if(u)return {...u,cat:'hero',heroId:h.id,heroName:h.hero.name,_key:'h_'+u.id+'_'+h.id};}
  return {id:'breath',name:'숨 고르기',rarity:'common',cat:'trait',desc:'성 체력 4% 회복',icon:'✚',_key:'t_breath'};
}
function selectCard(c){
  const b=G.battle;if(!b)return;
  if(c.cat==='artifact'){
    b.artifacts[c.id]=true;
    if(c.id==='glass_heart'){b.castleMax*=1.08;b.castleHP=Math.min(b.castleMax,b.castleHP*1.08);}
    if(c.id==='last_candle')b.lastCandleReady=true;
  }else if(c.cat==='trait'){
    b.traits[c.id]=(b.traits[c.id]||0)+1;
    if(c.id==='strong_wall'){b.castleMax*=1.06;b.castleHP=Math.min(b.castleMax,b.castleHP*1.06);}
    if(c.id==='breath')b.castleHP=Math.min(b.castleMax,b.castleHP+b.castleMax*.04);
  }else if(c.cat==='hero'){
    const h=b.heroes.find(x=>x.id===c.heroId);
    if(h){h.cardStacks=h.cardStacks||{};h.cardStacks[c.id]=(h.cardStacks[c.id]||0)+1;
      if(c.id==='fine_atk'||c.id==='sharp_proj'||c.id==='focused_shot')h.buffs.dmg=(h.buffs.dmg||1)*(c.id==='fine_atk'?1.15:c.id==='sharp_proj'?1.15:1.10);
      if(c.id==='power_skill')h.buffs.skill=(h.buffs.skill||1)*1.18;
      if(c.id==='quick_reuse')h.buffs.cd=(h.buffs.cd||1)*.9;
      if(c.id==='efficient_cast')h.buffs.mana=(h.buffs.mana||1)*.88;
      if(c.id==='expanded_range')h.buffs.range=(h.buffs.range||1)*1.15;
      if(c.id==='enhanced_summon')h.buffs.summon=(h.buffs.summon||1)*1.15;
      if(c.id==='hunt_instinct')h.buffs.bossDmg=(h.buffs.bossDmg||1)*1.12;
      if(c.id==='guardian_will')h.buffs.shield=(h.buffs.shield||1)*1.18;
    }
  }
  $('#cardModal').classList.remove('open');b.paused=false;
  if(b.cardQueue.length){const cq=b.cardQueue.shift();b.paused=true;showCardSelection(cq);}
}

function renderHudSlots(){
  const b=G.battle;if(!b)return;const hud=$('#hudBottom');hud.innerHTML='';
  for(const h of b.heroes){const el=document.createElement('div');el.className='hudSlot';el.innerHTML=`<img src="${heroPortraitUrl(h.hero)}" alt="${h.hero.name}">`;el.title=h.hero.name;hud.appendChild(el);}
}
function updateBattleHUD(){
  const b=G.battle;if(!b)return;
  $('#bStage').textContent=b.stage;$('#bTime').textContent=fmtTime(b.time);$('#bLevel').textContent=b.level;
  $('#bCoins').textContent=Math.floor(b.tempCoins).toLocaleString();
  $('#castleHP').textContent=Math.max(0,Math.ceil(b.castleHP)).toLocaleString();$('#castleMax').textContent=Math.ceil(b.castleMax).toLocaleString();
  $('#castleFill').style.width=Math.max(0,b.castleHP/b.castleMax*100)+'%';$('#manaTxt').textContent=Math.floor(b.mana);$('#manaFill').style.width=(b.mana/b.manaMax*100)+'%';
}
function winBattle(){
  const b=G.battle;if(!b||b.gameOver)return;b.gameOver=true;b.waveCleared=true;
  const payout=Math.floor(b.tempCoins);G.save.coins+=payout;
  if(G.save.stage>=G.save.maxStage)G.save.maxStage=G.save.stage;
  G.save.stage=G.save.stage+1;G.save.castle.maxHP=castleMaxHP();writeSave();
  $('#resTitle').textContent='승리';$('#resSub').textContent=`STAGE ${b.stage} CLEAR`;
  $('#resultModal').classList.remove('lose');$('#resultModal').classList.add('win','open');
  const totalKills=b.totalKills-b.bossKills;
  $('#resultStats').innerHTML=`<div class="rs"><div class="lbl">처치 몬스터</div><div class="val">${totalKills.toLocaleString()}</div></div><div class="rs"><div class="lbl">보스 처치</div><div class="val">${b.bossKills}</div></div><div class="rs"><div class="lbl">획득 코인</div><div class="val">🪙${payout.toLocaleString()}</div></div><div class="rs"><div class="lbl">전투 경험치</div><div class="val">${Math.round(b.xp).toLocaleString()}</div></div>`;
  let topId=null,topDmg=0;for(const [id,d] of Object.entries(b.log.heroDmg)){if(d>topDmg){topDmg=d;topId=+id;}}
  if(topId){const h=HEROES.find(x=>x.id===topId);if(h)$('#resultStats').innerHTML+=`<div class="rs"><div class="lbl">MVP</div><div class="val" style="font-size:14px;">${h.icon} ${h.name}</div></div>`;}
}

function renderHub(){
  $('#hubStage').textContent=G.save.stage;
  $('#hubCastleLv').textContent=G.save.castle.level;
  $('#hubCoins').textContent=Math.floor(G.save.coins).toLocaleString();
  const filled=G.save.formation.filter(Boolean).length;
  $('#hubSlots').textContent=`${filled}/${castleSlots()}`;
  drawHubCastle();
  const fm=$('#hubFormation');fm.innerHTML='';
  const xs=[335,450,565],ys=[105,163,221,279];
  for(let i=0;i<castleSlots();i++){
    const hid=G.save.formation[i],col=i%3,row=Math.floor(i/3);
    const el=document.createElement('div');el.className='slot'+(hid?'':' empty');
    el.style.left=xs[col]+'px';el.style.top=ys[row]+'px';
    if(hid){const hero=HEROES.find(x=>x.id===hid);el.innerHTML=`<div class="slotIcon"><img src="${heroPortraitUrl(hero)}" alt="${hero.name}"></div><div class="slotName">${hero.name}</div>`;el.title=hero.name;}
    else{el.innerHTML='<div class="slotIcon" style="color:#344331">＋</div>';el.title='영웅 배치';}
    el.onclick=()=>openHeroManage();fm.appendChild(el);
  }
  const allFilled=Array.from({length:castleSlots()},(_,i)=>G.save.formation[i]).every(Boolean);
  $('#btnStartBattle').disabled=!allFilled;
  $('#btnStartBattle').title=allFilled?'':'모든 영웅 슬롯을 채워주세요';
}

function renderHeroList(){
  const list=$('#heroList');list.innerHTML='';
  const order={fire:0,lightning:1,ice:2,arcane:3,summon:4,curse:5};
  const sorted=[...HEROES].sort((a,b)=>order[a.el]-order[b.el]||a.price-b.price);
  for(const h of sorted){
    const hs=G.save.heroes[h.id]||{owned:false,level:1,promo:0};
    const card=document.createElement('div');card.className='heroCard'+(hs.owned?' owned':'')+(selHeroId===h.id?' selected':'');
    card.innerHTML=`<div class="hIcon"><img src="${heroPortraitUrl(h)}" alt="${h.name}"></div><div class="hName">${h.name}</div><div class="hSub">${hs.owned?`Lv.${hs.level}${hs.promo?` · 승급${hs.promo}`:''}`:ELEMENTS[h.el]}</div><div class="hPrice">${hs.owned?'':`🪙 ${h.price}`}</div>${hs.owned?'<div class="hBadge">보유</div>':''}`;
    card.onclick=()=>{selHeroId=h.id;renderHeroList();renderHeroDetail(h.id);};list.appendChild(card);
  }
}

function summonGroupAlive(heroId){return !!(G.battle&&G.battle.summons.some(s=>s.heroId===heroId&&!s.dead&&s.hp>0));}
function summonConfigs(heroId,baseDmg){
  const stageScale=Math.pow(1.07,(G.battle?.stage||1)-1);
  const make=(type,count,hp,dmg,speed,range,interval,role='melee')=>Array.from({length:count},(_,i)=>({type,hp:hp*stageScale,dmg:baseDmg*dmg,speed,range,interval,role,index:i,count}));
  if(heroId===25)return make('wraith',12,115,.42,145,33,1.45);
  if(heroId===26)return make('golem',1,2800,3.1,58,54,1.75);
  if(heroId===27)return make('dog',3,540,1.35,190,31,.72);
  if(heroId===29)return make('skeleton',4,710,.92,112,38,1.05);
  if(heroId===30)return make('clone',1,1050,.78,82,265,1.35,'ranged');
  return [];
}
function spawnSummonGroup(h,items){
  const b=G.battle;if(!b||summonGroupAlive(h.id))return false;
  const groupId=b.nextSummonGroupId++;
  h.activeSummonGroupId=groupId;
  const baseOffsets=items.length===3?[-62,0,62]:items.length===4?[-52,-17,17,52]:items.length===12?[-72,-58,-44,-30,-16,-2,12,26,40,54,68,82]:[0];
  items.forEach((it,i)=>{
    const off=baseOffsets[i]??(i-(items.length-1)/2)*18;
    const y=clamp(h.y+off,352,648);
    const startX=h.x+24+(i%3)*5;
    b.summons.push({uid:`s${groupId}_${i}`,groupId,heroId:h.id,hero:h.hero,heroRef:h,
      type:it.type,x:startX,y,homeY:y,laneY:y,formationOffset:off,
      hp:it.hp,maxHp:it.hp,dmg:it.dmg,speed:it.speed,attackRange:it.range,attackInterval:it.interval,
      attackCd:.35+(i%4)*.13,targetUid:null,role:it.role,age:0,animTime:Math.random()*5,attackAnim:0,
      dead:false,scale:it.type==='golem'?1.28:it.type==='dog'?.82:it.type==='wraith'?.62:it.type==='clone'?.92:1,
      rallyX:it.type==='golem'?590:it.type==='dog'?690:it.type==='clone'?430:620,
      hitFlash:0,retarget:0
    });
    b.effects.push({type:'summonRise',x:startX,y,life:.42,maxLife:.42,accent:elementInk(h.hero.el)});
  });
  return true;
}

function useSkill(h){
  const id=h.hero.id,b=G.battle;
  const baseDmg=heroBaseDmg(h.level)*Math.pow(1.05,h.promo);
  if([25,26,27,29,30].includes(id)){
    if(summonGroupAlive(h.id))return;
    const units=summonConfigs(id,baseDmg,h.level);
    if(spawnSummonGroup(h,units)){h.skillAnim=.55;b.effects.push({type:'summonBurst',x:h.x,y:h.y-25,life:.7,maxLife:.7,hero:h});}
    return;
  }
  if(id===19){
    const targets=b.enemies.filter(e=>!e.dead&&e.hp>0).sort((a,b)=>a.x-b.x);
    if(!targets.length)return;
    const selected=[];
    for(let i=0;i<3;i++){
      const idx=Math.min(targets.length-1,Math.floor((i+.5)*targets.length/3));
      const t=targets[idx];
      selected.push({x:clamp(t.x,390,1050),y:clamp(t.y,350,650)});
    }
    const fallbackY=clamp(h.y+15,390,610);
    const points=selected.length?selected:[{x:560,y:fallbackY},{x:730,y:fallbackY},{x:900,y:fallbackY}];
    points.forEach((p,i)=>b.effects.push({type:'tentacle',x:p.x+(i-1)*18,y:p.y,life:1.08,maxLife:1.08,elapsed:0,impactAt:.53,hitDone:false,hero:h,dmg:baseDmg*5.1,r:102,index:i,lean:(i-1)*.28}));
    h.skillAnim=.8;return;
  }
  // All other established hero skills keep their existing, individually authored behaviour.
  useSkillLegacy(h);
}

function updateHero(h,dt){
  const b=G.battle;if(!h)return;
  h.animTime=(h.animTime||0)+dt;
  h.attackAnim=Math.max(0,(h.attackAnim||0)-dt*4.5);
  h.skillAnim=Math.max(0,(h.skillAnim||0)-dt*2.1);
  h.atkCd-=dt;
  if(h.atkCd<=0){
    const speedMul=(b.traits.fast_cast?Math.pow(1.05,b.traits.fast_cast):1)*(b.artifacts.quick_cast?1.05:1);
    h.atkCd=1.8/speedMul;
    const target=findTargetForHero(h);
    if(target){
      const baseDmg=heroBaseDmg(h.level)*Math.pow(1.05,h.promo);
      const projSpeed=560*(b.artifacts.ash_compass?1.12:1)*(b.traits.skilled_shooter?Math.pow(1.1,b.traits.skilled_shooter):1);
      b.projectiles.push({type:'heroBolt',x:h.x+12,y:h.y-30,tx:target.x,ty:target.y,target,speed:projSpeed,life:2.4,
        dmg:baseDmg,hero:h,splash:48*(h.buffs.range||1),color:elementInk(h.hero.el),depth:clamp((h.y-340)/330,0,1)});
      h.attackAnim=.28;
    }
  }
  const cdMul=(b.artifacts.old_hourglass?.92:1)*(b.traits.focus?Math.pow(.94,b.traits.focus):1)*(h.buffs.cd||1);
  h.skillCd-=dt/cdMul;
  const summonType=[25,26,27,29,30].includes(h.id);
  if(summonType&&summonGroupAlive(h.id))return; // no duplicate summon groups and no mana waste
  if(h.skillCd<=0){
    const manaCost=h.manaCost*(b.traits.mana_eff?Math.pow(.92,b.traits.mana_eff):1)*(h.buffs.mana||1);
    if(b.mana>=manaCost){b.mana-=manaCost;b.log.manaUsed+=manaCost;b.log.skillUses++;h.skillCd=h.hero.cd;useSkill(h);}
  }
}

    coin:m.coin*b.stageMul.reward,xp:m.xp*b.stageMul.reward,size:m.size*depthScale,sizeBase:m.size,color:m.color,shape:m.shape,
    ranged:!!m.ranged,stopX:targetX,slow:0,stun:0,dot:[],age:0,moving:true,markTimer:0,
    aggroSummons:Math.random()<aggroChance,summonTargetId:null,attackAnim:0});
}

function updateEnemies(dt){
  const b=G.battle;
  if(b.artifacts.last_candle&&!b.lastCandleUsed&&b.castleHP/b.castleMax<=.15){b.lastCandleUsed=true;b.castleHP=Math.min(b.castleMax,b.castleHP+b.castleMax*.32);b.effects.push({type:'shield',x:245,y:520,life:1,maxLife:1});toast('마지막 촛불이 성을 되살렸습니다.');}
  if(b.artifacts.rift_heart){b.riftHeartTimer=(b.riftHeartTimer||0)+dt;if(b.riftHeartTimer>=10){b.riftHeartTimer-=10;const owner=b.heroes[0];if(owner){const pulse=heroBaseDmg(owner.level)*5;for(const e of b.enemies){if(!e.dead)applyHeroDamage(owner,e,pulse,true);}}}}
  b.enemies=b.enemies.filter(e=>!e.dead&&e.hp>0);
  for(const e of b.enemies){
    e.age+=dt;e.attackAnim=Math.max(0,(e.attackAnim||0)-dt*3);
    if(e.markTimer>0){e.markTimer-=dt;if(e.markTimer<=0)e.marked=false;}
    if(e.stun>0){e.stun=Math.max(0,e.stun-dt);continue;}
    if(e.slow>0)e.slow=Math.max(0,e.slow-dt);
    if(e.dot&&e.dot.length){for(const d of e.dot){const tick=Math.min(Math.max(0,e.hp),d.dps*dt);e.hp-=tick;if(d.heroId&&b.log.heroDmg[d.heroId]!==undefined)b.log.heroDmg[d.heroId]+=tick;d.dur-=dt;}e.dot=e.dot.filter(d=>d.dur>0);if(e.hp<=0){killEnemy(e);continue;}}
    const slowMul=e.slow>0?(e.slowDebuff40?.6:.7):(e.freezeSlow?.6:1);
    let summonTarget=null;
    if(e.aggroSummons){
      if(e.summonTargetId){summonTarget=b.summons.find(s=>s.uid===e.summonTargetId&&!s.dead&&s.hp>0)||null;if(!summonTarget)e.summonTargetId=null;}
      if(!summonTarget){
        let best=null,bestScore=Infinity;
        for(const s of b.summons){if(s.dead||s.hp<=0||Math.abs(s.y-e.y)>102)continue;
          const d=Math.hypot(s.x-e.x,(s.y-e.y)*1.12);if(d>190)continue;
          const committed=b.enemies.reduce((n,m)=>n+(!m.dead&&m.summonTargetId===s.uid?1:0),0);
          if(committed>=2)continue;
          const score=d+committed*58;if(score<bestScore){best=s;bestScore=score;}
        }
        if(best){summonTarget=best;e.summonTargetId=best.uid;}
      }
    }
    if(summonTarget){
      const dx=summonTarget.x-e.x,dy=summonTarget.y-e.y,d=Math.hypot(dx,dy)||1;
      const reach=(summonTarget.type==='golem'?25:22)+(e.size||15)*.45;
      if(d>reach){const step=e.spd*slowMul*dt;e.x+=dx/d*step;e.y+=dy/d*step;e.y=clamp(e.y,340,665);}
      else{e.atkCd-=dt;if(e.atkCd<=0){e.atkCd=e.atkInt;e.attackAnim=.3;summonTarget.hp-=e.atk;summonTarget.hitFlash=.22;b.effects.push({type:'summonHit',x:summonTarget.x,y:summonTarget.y-12,life:.22,maxLife:.22});if(summonTarget.hp<=0){summonTarget.dead=true;b.effects.push({type:'summonDeath',x:summonTarget.x,y:summonTarget.y,life:.55,maxLife:.55});}}}
    }else if(e.x>e.targetX){
      e.x-=e.spd*slowMul*dt;
      e.progress=clamp((e.spawnX-e.x)/(e.spawnX-e.targetX),0,1);
      e.y=e.startY+(e.targetY-e.startY)*e.progress;
      e.renderScale=.70+clamp((e.y-320)/340,0,1)*.62;
      e.size=(e.isBoss?e.sizeBase||e.size:e.sizeBase||MONSTERS[e.type].size)*e.renderScale;
    }else{
      e.atkCd-=dt;if(e.atkCd<=0){e.atkCd=e.atkInt;e.attackAnim=.25;let damage=e.atk;if(b.artifacts.abyss_shell)damage*=.9;if(b.traits.overwhelm)damage*=1.05;b.castleHP-=damage;b.log.castleDamage+=damage;b.effects.push({type:'castleHit',x:245,y:525+((e.lane||.5)-.5)*80,life:.38,maxLife:.38});}
    }
    if(e.isBoss)updateBossAttacks(e,dt);
    if(e.isBoss&&e.name==='층을 삼킨 망령'&&!e.phase2&&e.hp<e.maxHp*.5){e.phase2=true;e.slow=2.5;}
    if(e.isBoss&&e.name==='쌍월룡'&&!e.phase2&&e.hp<e.maxHp*.5){e.phase2=true;e.spd*=1.15;}
  }
}

function findTargetForSummon(s){
  const b=G.battle,live=b.enemies.filter(e=>!e.dead&&e.hp>0);
  if(!live.length)return null;
  let best=null,bestScore=Infinity;
  for(const e of live){
    const d=Math.hypot(e.x-s.x,(e.y-s.y)*1.14);
    const assigned=b.summons.reduce((n,o)=>n+(o!==s&&!o.dead&&o.targetUid===e.uid?1:0),0);
    const score=d+assigned*125+(e.isBoss?-45:0);
    if(score<bestScore){best=e;bestScore=score;}
  }
  return best;
}
function updateSummons(dt){
  const b=G.battle;
  for(const s of b.summons){
    if(s.dead)continue;
    s.age+=dt;s.animTime+=dt;s.attackCd-=dt;s.attackAnim=Math.max(0,(s.attackAnim||0)-dt*4);s.hitFlash=Math.max(0,(s.hitFlash||0)-dt);
    s.retarget-=dt;
    let target=b.enemies.find(e=>!e.dead&&e.hp>0&&e.uid===s.targetUid)||null;
    if(!target||s.retarget<=0){target=findTargetForSummon(s);s.targetUid=target?target.uid:null;s.retarget=.32+(s.formationOffset%3+3)*.04;}
    let tx=s.rallyX,ty=s.laneY;
    if(target){
      const range=s.attackRange;
      const dx=target.x-s.x,dy=target.y-s.y,d=Math.hypot(dx,dy)||1;
      if(s.role==='ranged'){
        if(d>range*.86){tx=target.x-(dx/d)*range*.72;ty=target.y-(dy/d)*range*.72;}
        else{tx=s.x;ty=s.y;}
      }else if(d>range){tx=target.x-(dx/d)*(range*.72);ty=target.y-(dy/d)*(range*.72);}
      else{tx=s.x;ty=s.y;}
      if(d<=range+10&&s.attackCd<=0){
        s.attackCd=s.attackInterval;s.attackAnim=.32;
        if(s.role==='ranged'){
          b.projectiles.push({type:'summonBolt',x:s.x+8,y:s.y-24,target,dmg:s.dmg*(s.heroRef?.buffs.summon||1),speed:520,life:1.8,hero:s.heroRef,source:s});
        }else{
          applyHeroDamage(s.heroRef,target,s.dmg*(s.heroRef?.buffs.summon||1),true);
          b.effects.push({type:'summonStrike',x:target.x,y:target.y-10,life:.28,maxLife:.28,kind:s.type});
        }
      }
    }
    if(!target){
      // Advance in a fan toward several depth lanes instead of idling beside the castle.
      tx=Math.max(s.x,Math.min(s.rallyX,720));ty=s.laneY;
    }
    const vx=tx-s.x,vy=ty-s.y,dist=Math.hypot(vx,vy);
    if(dist>5){const step=Math.min(dist,s.speed*dt);s.x+=vx/dist*step;s.y+=vy/dist*step;}
    s.y=clamp(s.y,345,665);
    if(s.hp<=0){s.dead=true;b.effects.push({type:'summonDeath',x:s.x,y:s.y,life:.58,maxLife:.58});}
  }
  b.summons=b.summons.filter(s=>!s.dead&&s.hp>0);
  for(const h of b.heroes){if(h.activeSummonGroupId&&!b.summons.some(s=>s.heroId===h.id&&s.groupId===h.activeSummonGroupId)){h.activeSummonGroupId=null;}}
}

function updateProjectiles(dt){
  const b=G.battle;
  b.projectiles=b.projectiles.filter(p=>{
    p.life-=dt;if(p.life<=0)return false;
    if(['heroBolt','homing','summonBolt'].includes(p.type)){
      if(!p.target||p.target.dead||p.target.hp<=0){if(p.type==='heroBolt'){p.target=findTargetForHero(p.hero);if(!p.target)return false;}else return false;}
      const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d<=Math.max(12,p.target.size*.72||18)){
        if(p.type==='summonBolt'){applyHeroDamage(p.hero,p.target,p.dmg,true);b.effects.push({type:'summonStrike',x:p.target.x,y:p.target.y-8,life:.2,maxLife:.2,kind:'clone'});}
        else{applyHeroDamage(p.hero,p.target,p.dmg,p.type==='homing');if(p.type==='heroBolt'){
          if(b.artifacts.black_candle&&!p.target.dead)p.target.dot.push({dps:p.dmg*.18,dur:3,heroId:p.hero?.id});
          for(const e of b.enemies){if(e!==p.target&&!e.dead&&Math.hypot(e.x-p.target.x,e.y-p.target.y)<(p.splash||44))applyHeroDamage(p.hero,e,p.dmg*.45,false);}
        }}
        return false;
      }
      p.x+=dx/d*p.speed*dt;p.y+=dy/d*p.speed*dt;return true;
    }
    if(p.type==='iceLance'){
      const prevX=p.x;p.x+=(p.speed||520)*dt;
      p.hitSet=p.hitSet||new Set();
      for(const e of b.enemies){if(e.dead||p.hitSet.has(e))continue;if(e.x>=prevX-15&&e.x<=p.x+15&&Math.abs(e.y-p.y)<26){applyHeroDamage(p.hero,e,p.dmg,true);p.hitSet.add(e);}}
      return p.x<1240;
    }
    return false;
  });
  for(const fx of b.effects){
    if(fx.life<=0)continue;
    if(fx.type==='pool'&&fx.dps){for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)applyHeroDamage(fx.hero,e,fx.dps*dt,true);}}
    if(['storm','blizzard','moth'].includes(fx.type)&&fx.dps){for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r){applyHeroDamage(fx.hero,e,fx.dps*dt,true);if(fx.slow)e.slow=Math.max(e.slow,.25);if(fx.pull)e.x+=(fx.x-e.x)*.35*dt;}}}
    if(fx.type==='orbit'&&fx.dps){fx.hitSet=fx.hitSet||new Set();for(const e of b.enemies){if(e.dead)continue;const d=Math.hypot(e.x-fx.x,e.y-fx.y);if(Math.abs(d-fx.r)<24&&!fx.hitSet.has(e)){fx.hitSet.add(e);applyHeroDamage(fx.hero,e,fx.dps,true);}}if(fx.life<fx.maxLife-.7)fx.hitSet.clear();}
    if(fx.type==='tentacle'&&!fx.hitDone&&(fx.maxLife-fx.life)>=fx.impactAt){
      fx.hitDone=true;
      for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)applyHeroDamage(fx.hero,e,fx.dmg,true);}
      b.effects.push({type:'tentacleImpact',x:fx.x,y:fx.y+7,life:.52,maxLife:.52});
    }
    if(fx.type==='gravity'&&fx.dmg){for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)e.x+=(fx.x-e.x)*1.2*dt;}if(fx.life<.12&&!fx.exploded){fx.exploded=true;for(const e of b.enemies){if(!e.dead&&Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r)applyHeroDamage(fx.hero,e,fx.dmg,true);}}}
  }
}

function updateBattleHUD(){

function drawEffectV102Base(ctx,fx,b){

    const smooth=t=>t*t*(3-2*t);

    const tipY=-112*r+134*sl-28*re;

function bindUI(){
  $('#btnStartBattle').onclick=()=>startBattle();
  $('#btnHeroManage').onclick=()=>{selHeroId=null;openHeroManage();};
  $('#btnCastleUpgrade').onclick=()=>openCastleUpgrade();
  $('#btnDaily').onclick=()=>openDaily();
  $('#btnDailyTop').onclick=()=>openDaily();
  $$('[data-close]').forEach(btn=>btn.onclick=()=>$('#'+btn.dataset.close).classList.remove('open'));
  const pause=$('#btnPause'),speed=$('#btnSpeed'),quit=$('#btnQuit');
  pause.style.pointerEvents='auto';speed.style.pointerEvents='auto';quit.style.pointerEvents='auto';
  pause.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();const b=G.battle;if(!b)return;b.paused=!b.paused;pause.textContent=b.paused?'▶':'⏸';};
  speed.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();const b=G.battle;if(!b)return;b.speed=b.speed===1?2:1;speed.textContent=b.speed+'×';};
  quit.onclick=(ev)=>{ev.preventDefault();const b=G.battle;if(!b)return;if(confirm('전투에서 나가시겠습니까? 이번 시도는 패배로 처리됩니다.'))loseBattle();};
  $('#btnResConfirm').onclick=()=>confirmResult();
  // Explicit touch support avoids the old pointer-events inheritance issue on mobile browsers.
  [pause,speed,quit].forEach(btn=>btn.addEventListener('touchend',ev=>{ev.preventDefault();btn.click();},{passive:false}));
}

// Heavy, three-part rise -> coil -> broad descending slam for Alastor's Black Trident skill.
const drawEffectV102=drawEffectV102Base;
function drawEffect(ctx,fx,b){
  if(fx.type==='tentacle'){
    const p=clamp((fx.maxLife-fx.life)/fx.maxLife,0,1),rise=p<.24?p/.24:1,slam=clamp((p-.56)/.18,0,1),recover=clamp((p-.76)/.24,0,1);
    const lift=-92*rise,tipX=42+(fx.lean||0)*58,tipY=p<.56?lift:(p<.76?lift*(1-slam)-6*slam:-6+recover*18);
    ctx.save();ctx.translate(fx.x,fx.y);ctx.globalAlpha=p<.82?1:1-recover*.7;ctx.lineCap='round';ctx.lineJoin='round';
    // Thick, weighty body with a dark outer silhouette and a muted ridge highlight.
    const c1x=-48+(fx.index-1)*11,c2x=20+(fx.index-1)*13;
    ctx.strokeStyle='#171e19';ctx.lineWidth=25;ctx.beginPath();ctx.moveTo(-23,8);ctx.bezierCurveTo(c1x,-18,c2x,-122,tipX,tipY);ctx.stroke();
    ctx.strokeStyle='#505a4d';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(-23,5);ctx.bezierCurveTo(c1x+2,-22,c2x+2,-116,tipX-2,tipY+2);ctx.stroke();
    ctx.strokeStyle='#92927b';ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(-27,1);ctx.bezierCurveTo(c1x+1,-25,c2x-4,-112,tipX-5,tipY+4);ctx.stroke();
    // restrained sucker plates along the underside
    for(let i=0;i<5;i++){const q=(i+1)/6,px=-23+(tipX+23)*q+Math.sin(q*Math.PI)*c1x*.22,py=5+(tipY-5)*q-Math.sin(q*Math.PI)*28;ctx.fillStyle='#b0aa91';ctx.beginPath();ctx.ellipse(px,py+4,4.5,2.3,-.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#252d26';ctx.lineWidth=1;ctx.stroke();}
    // The tip folds over and sweeps across before the impact, rather than only appearing upright.
    if(p>.48){ctx.globalAlpha=slam*.9;ctx.strokeStyle='#202720';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(tipX-7,tipY-8);ctx.quadraticCurveTo(tipX+26,-45,tipX+54,-3);ctx.stroke();ctx.strokeStyle='#8d9079';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(tipX-8,tipY-9);ctx.quadraticCurveTo(tipX+23,-46,tipX+50,-6);ctx.stroke();}
    if(p>=.66){const k=clamp((p-.66)/.17,0,1);ctx.globalAlpha=(1-k)*.95;ctx.strokeStyle='#efe5c8';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(tipX+48,0,22+k*42,6+k*10,0,0,Math.PI*2);ctx.stroke();for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ctx.beginPath();ctx.moveTo(tipX+48+Math.cos(a)*18,Math.sin(a)*5);ctx.lineTo(tipX+48+Math.cos(a)*(38+k*22),Math.sin(a)*(12+k*9));ctx.stroke();}}
    ctx.restore();return;
  }
  if(['bossTelegraph','bossImpact','bossProjectile','bossShockwave','bossBreath','bossChains','bossShardRain'].includes(fx.type)){
    const elapsed=fx.maxLife?fx.maxLife-fx.life:0,progress=fx.maxLife?clamp(elapsed/fx.maxLife,0,1):0;
    ctx.save();ctx.globalAlpha=clamp(fx.life/(fx.maxLife||1),0,1);
    if(fx.type==='bossTelegraph'){
      ctx.translate(fx.x||245,fx.y||540);ctx.strokeStyle='#ad5646';ctx.fillStyle='rgba(132,53,43,.10)';ctx.lineWidth=4;
      const r=34+progress*35;ctx.beginPath();ctx.ellipse(0,0,r*1.7,r*.55,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-r,-r*.35);ctx.lineTo(0,-r*.85);ctx.lineTo(r,-r*.35);ctx.stroke();
      ctx.fillStyle='#f0d2ad';ctx.font='bold 13px Georgia';ctx.textAlign='center';ctx.fillText(fx.label||'위험',0,-r-7);
    }else if(fx.type==='bossImpact'){
      ctx.translate(fx.x||245,fx.y||540);ctx.strokeStyle='#e0c9a4';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,22+progress*86,8+progress*23,0,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#4b5042';ctx.lineWidth=3;for(let i=0;i<9;i++){const a=i*Math.PI*2/9;ctx.beginPath();ctx.moveTo(Math.cos(a)*18,Math.sin(a)*6);ctx.lineTo(Math.cos(a)*(52+progress*35),Math.sin(a)*(17+progress*11));ctx.stroke();}
    }else if(fx.type==='bossProjectile'){
      const sx=fx.sx||850,sy=fx.sy||450,tx=fx.tx||245,ty=fx.ty||520;const x=sx+(tx-sx)*progress,y=sy+(ty-sy)*progress-72*Math.sin(progress*Math.PI);
      ctx.strokeStyle='#333b32';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#747969';ctx.beginPath();ctx.moveTo(x-13,y-5);ctx.lineTo(x-3,y-16);ctx.lineTo(x+12,y-8);ctx.lineTo(x+9,y+10);ctx.lineTo(x-7,y+12);ctx.closePath();ctx.fill();ctx.strokeStyle='#242c25';ctx.lineWidth=2;ctx.stroke();
    }else if(fx.type==='bossShockwave'){
      ctx.translate(fx.x||245,fx.y||540);ctx.strokeStyle='#d8cfb3';ctx.lineWidth=4;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(0,0,24+progress*(70+i*27),8+progress*(17+i*6),0,0,Math.PI*2);ctx.stroke();}
    }else if(fx.type==='bossBreath'){
      ctx.translate(fx.x||245,fx.y||530);ctx.fillStyle='rgba(122,139,126,.28)';ctx.strokeStyle='#abb2a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(240, -110-progress*18);ctx.lineTo(240,110+progress*18);ctx.closePath();ctx.fill();ctx.stroke();
    }else if(fx.type==='bossChains'){
      ctx.strokeStyle='#8f8d78';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(fx.sx||820,fx.sy||470);ctx.lineTo(245,520);ctx.stroke();ctx.strokeStyle='#232b24';ctx.lineWidth=2;for(let i=0;i<18;i++){const t=i/18,x=(fx.sx||820)+(245-(fx.sx||820))*t,y=(fx.sy||470)+(520-(fx.sy||470))*t;ctx.beginPath();ctx.ellipse(x,y,5,2,.3,0,Math.PI*2);ctx.stroke();}
    }else if(fx.type==='bossShardRain'){
      ctx.strokeStyle='#c3b99e';ctx.fillStyle='#6d7668';for(let i=0;i<5;i++){const x=210+i*35,y=progress*460-70+i%2*18;ctx.beginPath();ctx.moveTo(x-7,y-18);ctx.lineTo(x+7,y-18);ctx.lineTo(x+3,y+10);ctx.lineTo(x-4,y+7);ctx.closePath();ctx.fill();ctx.stroke();}
    }
    ctx.restore();return;
  }
  drawEffectV102(ctx,fx,b);
}

function summonConfigs(heroId,baseDmg,heroLevel=1){
  // Strongly weak at the beginning; a gentle exponential level curve rewards investing in summoners.
  const lv=clamp(heroLevel||1,1,50),growth=Math.pow(1.035,lv-1);
  const stageScale=Math.pow(1.035,Math.max(0,(G.battle?.stage||1)-1));
  const make=(type,count,hp,dmgCoeff,speed,range,interval,role='melee')=>Array.from({length:count},(_,i)=>({
    type,hp:hp*growth*stageScale,dmg:baseDmg*growth*dmgCoeff,speed,range,interval,role,index:i,count
  }));
  if(heroId===25)return make('wraith',12,8,.0035,145,33,1.45);
  if(heroId===26)return make('golem',1,68,.055,58,54,1.75);
  if(heroId===27)return make('dog',3,20,.008,190,31,.82);
  if(heroId===29)return make('skeleton',4,23,.011,112,38,1.05);
  if(heroId===30)return make('clone',1,38,.018,82,265,1.35,'ranged');
  return [];
}

function updateSummons(dt){
  const b=G.battle;
  for(const s of b.summons){
    if(s.dead||s.hp<=0)continue;
    s.age=(s.age||0)+dt;s.animTime=(s.animTime||0)+dt;s.attackCd-=dt;s.attackAnim=Math.max(0,(s.attackAnim||0)-dt*4);s.hitFlash=Math.max(0,(s.hitFlash||0)-dt);s.retarget-=dt;
    let target=b.enemies.find(e=>!e.dead&&e.hp>0&&e.uid===s.targetUid)||null;
    if(!target||s.retarget<=0){target=findTargetForSummon(s);s.targetUid=target?target.uid:null;s.retarget=.34+(s.index%4)*.055;}
    let tx=s.rallyX,ty=s.laneY;
    if(target){
      const dx=target.x-s.x,dy=target.y-s.y,d=Math.hypot(dx,dy)||1,range=s.attackRange;
      if(s.role==='ranged'){if(d>range*.86){tx=target.x-(dx/d)*range*.72;ty=target.y-(dy/d)*range*.72;}else{tx=s.x;ty=s.y;}}
      else if(d>range){tx=target.x-(dx/d)*(range*.72);ty=target.y-(dy/d)*(range*.72);}else{tx=s.x;ty=s.y;}
      if(d<=range+10&&s.attackCd<=0){
        s.attackCd=s.attackInterval;s.attackAnim=.32;
        const dmg=s.dmg*(s.heroRef?.buffs.summon||1);
        if(s.role==='ranged')b.projectiles.push({type:'summonBolt',x:s.x+8,y:s.y-24,target,dmg,speed:520,life:1.8,hero:s.heroRef,source:s});
        else{applyHeroDamage(s.heroRef,target,dmg,true);b.effects.push({type:'summonStrike',x:target.x,y:target.y-10,life:.28,maxLife:.28,kind:s.type});}
      }
    }else{tx=Math.max(s.x,Math.min(s.rallyX,720));ty=s.laneY;}
    const vx=tx-s.x,vy=ty-s.y,dist=Math.hypot(vx,vy);
    if(dist>5){const step=Math.min(dist,s.speed*dt);s.x+=vx/dist*step;s.y+=vy/dist*step;}
    s.y=clamp(s.y,345,665);
    if(s.hp<=0){s.dead=true;b.effects.push({type:'summonDeath',x:s.x,y:s.y,life:.58,maxLife:.58});}
  }
  b.summons=b.summons.filter(s=>!s.dead&&s.hp>0);
  for(const h of b.heroes){if(h.activeSummonGroupId&&!b.summons.some(s=>s.heroId===h.id&&s.groupId===h.activeSummonGroupId)){h.activeSummonGroupId=null;}}
}

function castHeroSkill(h,quiet=false){
  const b=G.battle;if(!b||!h||b.gameOver)return false;
  if(h.skillCd>.04){if(!quiet)toast(`아직 ${h.hero.name}의 스킬이 준비되지 않았습니다.`);return false;}
  if([25,26,27,29,30].includes(h.id)&&summonGroupAlive(h.id)){if(!quiet)toast('기존 소환수 무리가 전장에 남아 있습니다.');return false;}
  const manaCost=h.manaCost*(b.traits.mana_eff?Math.pow(.92,b.traits.mana_eff):1)*(h.buffs.mana||1);
  if(b.mana<manaCost){if(!quiet)toast('마나가 부족합니다.');return false;}
  b.mana-=manaCost;b.log.manaUsed+=manaCost;b.log.skillUses++;h.skillCd=h.hero.cd;h.skillAnim=.7;useSkill(h);renderHudSlots();updateBattleHUD();return true;
}

function updateHero(h,dt){
  const b=G.battle;if(!h)return;
  h.animTime=(h.animTime||0)+dt;h.attackAnim=Math.max(0,(h.attackAnim||0)-dt*4.5);h.skillAnim=Math.max(0,(h.skillAnim||0)-dt*2.1);
  h.atkCd-=dt;
  if(h.atkCd<=0){
    const speedMul=(b.traits.fast_cast?Math.pow(1.05,b.traits.fast_cast):1)*(b.artifacts.quick_cast?1.05:1);h.atkCd=1.8/speedMul;
    const target=findTargetForHero(h);
    if(target){const baseDmg=heroBaseDmg(h.level)*Math.pow(1.05,h.promo)*(h.buffs.dmg||1),projSpeed=560*(b.artifacts.ash_compass?1.12:1)*(b.traits.skilled_shooter?Math.pow(1.1,b.traits.skilled_shooter):1);
      const shot={type:'heroBolt',x:h.x+8,y:h.y-40,tx:target.x,ty:target.y,target,speed:projSpeed,life:2.4,dmg:baseDmg,hero:h,splash:44*(h.buffs.range||1),color:elementInk(h.hero.el)};b.projectiles.push(shot);
      if(b.artifacts.twisted_mirror&&Math.random()<.08)b.projectiles.push({...shot,x:h.x+3,y:h.y-34,dmg:baseDmg*.7,life:2.6});h.attackAnim=.28;
    }
  }
  const summonType=[25,26,27,29,30].includes(h.id);
  if(summonType&&summonGroupAlive(h.id))return; // Keep summon cooldown frozen while its group is alive.
  const cdMul=(b.artifacts.old_hourglass?.92:1)*(b.traits.focus?Math.pow(.94,b.traits.focus):1)*(h.buffs.cd||1);
  h.skillCd=Math.max(0,h.skillCd-dt/cdMul);
  if(b.autoSkills&&h.skillCd<=0)castHeroSkill(h,true);
}

let bossPatternCounter=0;
function damageCastleFromBoss(amount,e,fxType='bossImpact'){
  const b=G.battle;if(!b)return;
  let damage=amount;if(b.artifacts.abyss_shell)damage*=.9;if(b.traits.overwhelm)damage*=1.05;
  b.castleHP-=damage;b.log.castleDamage+=damage;b.effects.push({type:'bossImpact',x:245,y:525+((e.lane||.5)-.5)*55,life:.48,maxLife:.48});
}
function updateBossAttacks(e,dt){
  const b=G.battle;if(!b||e.dead)return;
  // Bosses continue walking at their original slow speed; attacking never freezes the wave behind them.
  if(e.x>850&&!e.bossAction)return;
  if(!e.bossAction){
    e.specCd=(e.specCd??6)-dt;
    if(e.specCd<=0){
      const list=BOSS_ATTACKS[e.name]||BOSS_ATTACKS['흑설탕 거석'];
      const idx=(bossPatternCounter++ + Math.floor(Math.random()*list.length))%list.length;
      const def=list[idx];e.bossAction={...def,elapsed:0,nextHit:def.windup,hitIndex:0,sourceX:e.x,sourceY:e.y};e.attackAnim=.9;
      b.effects.push({type:'bossTelegraph',x:245,y:525,label:def.label,life:def.windup,maxLife:def.windup});
    }
  }
  const a=e.bossAction;if(!a)return;
  a.elapsed+=dt;
  while(a.hitIndex<a.hits&&a.elapsed>=a.nextHit){
    damageCastleFromBoss(a.damage,e,a.kind);
    if(a.id==='rock'||a.id==='pressure')b.effects.push({type:'bossProjectile',sx:a.sourceX,sy:a.sourceY,tx:245,ty:525,life:.55,maxLife:.55});
    else if(a.kind==='bossChains')b.effects.push({type:'bossChains',sx:a.sourceX,sy:a.sourceY,life:.45,maxLife:.45});
    else if(a.kind==='bossBreath')b.effects.push({type:'bossBreath',x:245,y:525,life:.48,maxLife:.48});
    else if(a.kind==='bossShardRain')b.effects.push({type:'bossShardRain',x:245,y:525,life:.55,maxLife:.55});
    else b.effects.push({type:'bossImpact',x:245,y:525,life:.45,maxLife:.45});
    if(a.debuff&&a.hitIndex===0){for(const h of b.heroes)h.atkCd=Math.min(h.atkCd+.65,3);}
    a.hitIndex++;a.nextHit=a.windup+a.hitIndex*a.interval;
  }
  if(a.hitIndex>=a.hits){e.bossAction=null;e.specCd=a.cooldown;}
}

function updateBattleHUD(){

  $('#bStage').textContent=b.stage;$('#bTime').textContent=fmtTime(b.time);$('#bLevel').textContent=b.level;$('#bCoins').textContent=Math.floor(b.tempCoins).toLocaleString();

function refreshHudSlotStates(){
  const b=G.battle;if(!b)return;
  const now=performance.now();if(now-(b.hudSlotRefreshAt||0)<110)return;b.hudSlotRefreshAt=now;
  document.querySelectorAll('#hudBottom .hudSlot').forEach(el=>{
    const h=b.heroes.find(v=>v.id===Number(el.dataset.heroId));if(!h)return;
    const cost=h.manaCost*(b.traits.mana_eff?Math.pow(.92,b.traits.mana_eff):1)*(h.buffs.mana||1);
    const groupBusy=[25,26,27,29,30].includes(h.id)&&summonGroupAlive(h.id);
    const ready=h.skillCd<=.05&&b.mana>=cost&&!groupBusy;
    el.classList.toggle('ready',ready);el.classList.toggle('manualHint',!b.autoSkills);
    const veil=el.querySelector('.cdOverlay');if(veil)veil.style.display=h.skillCd>.05&&!groupBusy?'block':'none';
    const label=groupBusy?'SUMMON':h.skillCd>.05?`${Math.ceil(h.skillCd)}s`:ready?'READY':'MP';
    const txt=el.querySelector('.hudCdText');if(txt&&txt.textContent!==label)txt.textContent=label;
    el.title=`${h.hero.name} · ${h.hero.skill} · ${ready?'스킬 사용 가능':groupBusy?'소환수 생존 중':`대기 ${Math.ceil(h.skillCd)}초`}`;
  });
}

function renderHudSlots(){
  const b=G.battle;if(!b)return;const hud=$('#hudBottom');hud.innerHTML='';
  for(const h of b.heroes){
    const ready=h.skillCd<=.05&&b.mana>=h.manaCost*(b.traits.mana_eff?Math.pow(.92,b.traits.mana_eff):1)*(h.buffs.mana||1)&&!([25,26,27,29,30].includes(h.id)&&summonGroupAlive(h.id));
    const el=document.createElement('button');el.type='button';el.className='hudSlot'+(ready?' ready':'')+(!b.autoSkills?' manualHint':'');el.dataset.heroId=h.id;el.title=`${h.hero.name} · ${h.hero.skill} · ${ready?'스킬 사용 가능':`대기 ${Math.ceil(h.skillCd)}초`}`;
    el.innerHTML=`<img src="${heroPortraitUrl(h.hero)}" alt="${h.hero.name}"><span class="cdOverlay" style="display:${h.skillCd>.05?'block':'none'}"></span><span class="hudCdText">${h.skillCd>.05?Math.ceil(h.skillCd)+'s':ready?'READY':'MP'}</span>`;
    el.addEventListener('click',()=>{
      const current=G.battle;if(!current)return;
      if(current.autoSkills){toast('자동 모드입니다. 자동 버튼을 눌러 수동 모드로 전환하세요.');return;}
      const hero=current.heroes.find(v=>v.id===h.id);if(hero)castHeroSkill(hero,false);
    });
    hud.appendChild(el);
  }
  refreshHudSlotStates();
}

/* =========================================================
   TENEBRAE v1.0.5 — phase 1
   1) fail-safe persistent save + battle checkpoint/continue
   2) full-body mobile-game hero sprites (36 individual designs)
   3) clearer castle formation, names and thin cooldown bars
   ========================================================= */

const V104_SAVE_BACKUP_KEY = SAVE_KEY + '_backup';
const V104_SAVE_META_KEY = SAVE_KEY + '_meta';
const V104_BATTLE_KEY = SAVE_KEY + '_battle_checkpoint';
const V104_DB_NAME = 'TENEBRAE_SAVE_DB';
let V104_DB = null;
let V104_WRITE_CHAIN = Promise.resolve();
let V104_SAVE_BLOCKED = false;
let V104_SAVE_RECOVERED = false;
let V104_SAVE_ERROR = '';
let V104_LAST_CHECKPOINT_AT = 0;
let V104_LAST_CHECKPOINT = null;
const V104_HERO_IMAGE_CACHE = new Map();

function defaultSave(){
  return {
    saveVersion:SAVE_VERSION, coins:5000, stage:1, maxStage:1,
    castle:{level:1,maxHP:15000}, heroes:{}, formation:[],
    dailyReward:{lastClaimDate:'',nextIndex:0}
  };
}

function v104NormalizeAccount(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('저장 데이터 형식이 올바르지 않습니다.');
  if(!Number.isFinite(Number(raw.coins)) || Number(raw.coins)<0) throw new Error('저장 데이터의 코인 값이 올바르지 않습니다.');
  if(!raw.castle || typeof raw.castle!=='object') throw new Error('성 데이터가 없습니다.');
  if(!raw.heroes || typeof raw.heroes!=='object' || Array.isArray(raw.heroes)) throw new Error('영웅 데이터가 없습니다.');
  if(!Array.isArray(raw.formation)) throw new Error('영웅 편성 데이터가 올바르지 않습니다.');
  const d=defaultSave();
  const merged=Object.assign(d,raw,{
    castle:Object.assign({},d.castle,raw.castle||{}),
    dailyReward:Object.assign({},d.dailyReward,raw.dailyReward||{}),
    heroes:Object.assign({},raw.heroes||{}),
    formation:raw.formation.slice()
  });
  merged.coins=Math.max(0,Number(merged.coins)||0);
  merged.stage=Math.max(1,Math.floor(Number(merged.stage)||1));
  merged.maxStage=Math.max(merged.stage,Math.floor(Number(merged.maxStage)||1));
  merged.castle.level=clamp(Math.floor(Number(merged.castle.level)||1),1,CASTLE_LEVELS.length);
  merged.castle.maxHP=Number(merged.castle.maxHP)||CASTLE_LEVELS[merged.castle.level-1].maxHP;
  const oldVersion=Number(raw.saveVersion||1);
  if(oldVersion<2 && merged.stage===1 && Object.values(merged.heroes).filter(h=>h&&h.owned).length===0 && merged.coins<5000) merged.coins=5000;
  merged.saveVersion=SAVE_VERSION;
  for(const h of HEROES){
    const hs=merged.heroes[h.id];
    if(!hs || typeof hs!=='object') merged.heroes[h.id]={owned:false,level:1,promo:0};
    else merged.heroes[h.id]={owned:!!hs.owned,level:clamp(Math.floor(Number(hs.level)||1),1,50),promo:clamp(Math.floor(Number(hs.promo)||0),0,4)};
  }
  return merged;
}

function v104ParseAccountRecord(raw){
  if(!raw) return null;
  try{
    const parsed=typeof raw==='string'?JSON.parse(raw):raw;
    if(parsed && parsed.__tenebraeEnvelope===1) return {data:v104NormalizeAccount(parsed.data),revision:Number(parsed.revision)||0,updatedAt:Number(parsed.updatedAt)||0,envelope:parsed};
    return {data:v104NormalizeAccount(parsed),revision:0,updatedAt:0,envelope:null};
  }catch(e){return null;}
}

function v104OpenDB(){
  return new Promise(resolve=>{
    if(!('indexedDB' in window)){resolve(null);return;}
    let req;
    try{req=indexedDB.open(V104_DB_NAME,1);}catch(e){resolve(null);return;}
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('records'))db.createObjectStore('records');};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>resolve(null);
    req.onblocked=()=>resolve(null);
  });
}
function v104IdbGet(key){
  return new Promise(resolve=>{
    if(!V104_DB){resolve(null);return;}
    try{const tx=V104_DB.transaction('records','readonly'),req=tx.objectStore('records').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null);}catch(e){resolve(null);}
  });
}
function v104IdbPut(key,value){
  return new Promise((resolve,reject)=>{
    if(!V104_DB){resolve(false);return;}
    try{const tx=V104_DB.transaction('records','readwrite');tx.objectStore('records').put(value,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('IndexedDB 저장 실패'));tx.onabort=()=>reject(tx.error||new Error('IndexedDB 저장 중단'));}catch(e){reject(e);}
  });
}
function v104SafeLocalGet(key){try{return localStorage.getItem(key);}catch(e){return null;}}
function v104SafeLocalSet(key,value){try{localStorage.setItem(key,value);return true;}catch(e){return false;}}

async function v104LoadAccount(){
  const candidates=[];
  let foundAny=false;
  const primary=v104SafeLocalGet(SAVE_KEY),backup=v104SafeLocalGet(V104_SAVE_BACKUP_KEY),metaRaw=v104SafeLocalGet(V104_SAVE_META_KEY);
  if(primary){foundAny=true;const r=v104ParseAccountRecord(primary);if(r){let meta=null;try{meta=metaRaw?JSON.parse(metaRaw):null;}catch(e){};r.revision=Math.max(r.revision,Number(meta?.revision)||0);r.updatedAt=Math.max(r.updatedAt,Number(meta?.updatedAt)||0);r.source='local-primary';candidates.push(r);}}
  if(backup){foundAny=true;const r=v104ParseAccountRecord(backup);if(r){r.source='local-backup';r.revision=Math.max(0,r.revision-0.01);candidates.push(r);}}
  const idbPrimary=await v104IdbGet('account-primary');
  const idbBackup=await v104IdbGet('account-backup');
  for(const [rec,source,sub] of [[idbPrimary,'idb-primary',0],[idbBackup,'idb-backup',-.01]]){
    if(rec){foundAny=true;const r=v104ParseAccountRecord(rec);if(r){r.source=source;r.revision+=sub;candidates.push(r);}}
  }
  if(!candidates.length){
    V104_SAVE_BLOCKED=foundAny;
    if(foundAny){V104_SAVE_ERROR='저장 데이터가 손상되었거나 읽을 수 없습니다. 기존 파일은 덮어쓰지 않았습니다. 저장 백업을 불러오거나 JSON 백업을 선택해 주세요.';return defaultSave();}
    V104_SAVE_BLOCKED=false;return defaultSave();
  }
  candidates.sort((a,b)=>(b.updatedAt-a.updatedAt)||(b.revision-a.revision));
  const best=candidates[0];
  V104_SAVE_BLOCKED=false;
  if(best.source!=='local-primary') V104_SAVE_RECOVERED=true;
  return best.data;
}

function writeSave(){
  if(!G.save || V104_SAVE_BLOCKED) return false;
  let data;
  try{data=v104NormalizeAccount(G.save);}catch(e){V104_SAVE_ERROR='저장 데이터 검증 실패: '+e.message;return false;}
  G.save=data;
  const now=Date.now();
  const metaOldRaw=v104SafeLocalGet(V104_SAVE_META_KEY);let metaOld={revision:0,updatedAt:0};try{if(metaOldRaw)metaOld=Object.assign(metaOld,JSON.parse(metaOldRaw));}catch(e){}
  const revision=(Number(metaOld.revision)||0)+1;
  const envelope={__tenebraeEnvelope:1,revision,updatedAt:now,data};
  const oldPrimary=v104SafeLocalGet(SAVE_KEY);
  let localOK=false;
  try{
    if(oldPrimary){const parsed=v104ParseAccountRecord(oldPrimary);if(parsed){v104SafeLocalSet(V104_SAVE_BACKUP_KEY,oldPrimary);}}
    const raw=JSON.stringify(data);
    localStorage.setItem(SAVE_KEY,raw); // Keep legacy raw JSON format readable by earlier builds.
    localStorage.setItem(V104_SAVE_META_KEY,JSON.stringify({revision,updatedAt:now}));
    const verify=v104ParseAccountRecord(localStorage.getItem(SAVE_KEY));
    if(!verify)throw new Error('저장 후 확인에 실패했습니다.');
    localOK=true;
  }catch(e){V104_SAVE_ERROR=e.message||'브라우저 저장소 쓰기 실패';}
  V104_WRITE_CHAIN=V104_WRITE_CHAIN.then(async()=>{
    try{
      const oldIdb=await v104IdbGet('account-primary');
      if(oldIdb)await v104IdbPut('account-backup',oldIdb);
      await v104IdbPut('account-primary',envelope);
      return true;
    }catch(e){V104_SAVE_ERROR=e.message||'보조 저장소 쓰기 실패';return false;}
  });
  if(!localOK && !V104_DB){V104_SAVE_ERROR=V104_SAVE_ERROR||'사용 가능한 저장 공간이 없습니다.';return false;}
  return true;
}

function loadSave(){
  const primary=v104SafeLocalGet(SAVE_KEY);
  const parsed=v104ParseAccountRecord(primary);
  return parsed?parsed.data:defaultSave();
}

function v104BattleSnapshot(b){
  if(!b || b.gameOver) return null;
  const strip=(obj,keys)=>{const out={};for(const k of Object.keys(obj||{})){if(!keys.includes(k))out[k]=obj[k];}return out;};
  const heroes=b.heroes.map(h=>strip(h,['hero']));
  const enemies=b.enemies.map(e=>strip(e,[]));
  const summons=b.summons.map(s=>Object.assign(strip(s,['hero','heroRef']),{heroRefId:s.heroId}));
  const projectiles=b.projectiles.map(p=>Object.assign(strip(p,['target','hero','source','hitSet']),{
    targetUid:p.target?.uid||null,heroRefId:p.hero?.id||null,sourceUid:p.source?.uid||null,
    hitSetUids:p.hitSet instanceof Set?Array.from(p.hitSet).map(e=>e.uid).filter(Boolean):null
  }));
  const effects=b.effects.map(fx=>Object.assign(strip(fx,['hero','hitSet']),{
    heroRefId:fx.hero?.id||null,hitSetUids:fx.hitSet instanceof Set?Array.from(fx.hitSet).map(e=>e.uid).filter(Boolean):null
  }));
  const top=strip(b,['heroes','enemies','summons','projectiles','effects']);
  top.heroes=heroes;top.enemies=enemies;top.summons=summons;top.projectiles=projectiles;top.effects=effects;
  top.v104CheckpointVersion=1;
  return JSON.parse(JSON.stringify(top));
}

function v104RestoreBattle(snap){
  if(!snap || snap.v104CheckpointVersion!==1) throw new Error('전투 저장 버전이 올바르지 않습니다.');
  const b=JSON.parse(JSON.stringify(snap));
  const heroMap=new Map();
  b.heroes=(b.heroes||[]).map(h=>{const hero=HEROES.find(x=>x.id===Number(h.id));if(!hero)throw new Error('저장된 영웅 정보를 찾을 수 없습니다.');const out=Object.assign({},h,{hero});heroMap.set(out.id,out);return out;});
  const enemyMap=new Map((b.enemies||[]).map(e=>[e.uid,e]));
  b.summons=(b.summons||[]).map(s=>{const hero=HEROES.find(x=>x.id===Number(s.heroId));return Object.assign({},s,{hero,heroRef:heroMap.get(Number(s.heroRefId||s.heroId))||null});});
  const summonMap=new Map(b.summons.map(s=>[s.uid,s]));
  b.projectiles=(b.projectiles||[]).map(p=>{
    const out=Object.assign({},p,{target:enemyMap.get(p.targetUid)||null,hero:heroMap.get(Number(p.heroRefId))||null,source:summonMap.get(p.sourceUid)||null});
    if(Array.isArray(p.hitSetUids))out.hitSet=new Set(p.hitSetUids.map(id=>enemyMap.get(id)).filter(Boolean));
    delete out.targetUid;delete out.heroRefId;delete out.sourceUid;delete out.hitSetUids;return out;
  });
  b.effects=(b.effects||[]).map(fx=>{
    const out=Object.assign({},fx,{hero:heroMap.get(Number(fx.heroRefId))||null});
    if(Array.isArray(fx.hitSetUids))out.hitSet=new Set(fx.hitSetUids.map(id=>enemyMap.get(id)).filter(Boolean));
    delete out.heroRefId;delete out.hitSetUids;return out;
  });
  b.paused=true;
  return b;
}

function saveBattleCheckpoint(force=false){
  const b=G.battle;if(!b || b.gameOver){clearBattleCheckpoint();return false;}
  const now=Date.now();if(!force && now-V104_LAST_CHECKPOINT_AT<9000)return true;
  let snap;try{snap=v104BattleSnapshot(b);}catch(e){V104_SAVE_ERROR='전투 임시 저장을 만들지 못했습니다: '+e.message;return false;}
  if(!snap)return false;
  const rec={schema:1,updatedAt:now,stage:b.stage,time:b.time,battle:snap};
  const raw=JSON.stringify(rec);
  let localOK=v104SafeLocalSet(V104_BATTLE_KEY,raw);
  V104_LAST_CHECKPOINT=rec;V104_LAST_CHECKPOINT_AT=now;
  V104_WRITE_CHAIN=V104_WRITE_CHAIN.then(()=>v104IdbPut('battle-checkpoint',rec).catch(()=>false));
  return localOK || !!V104_DB;
}
function clearBattleCheckpoint(){
  V104_LAST_CHECKPOINT=null;V104_LAST_CHECKPOINT_AT=Date.now();
  try{localStorage.removeItem(V104_BATTLE_KEY);}catch(e){}
  V104_WRITE_CHAIN=V104_WRITE_CHAIN.then(async()=>{try{if(V104_DB){const tx=V104_DB.transaction('records','readwrite');tx.objectStore('records').delete('battle-checkpoint');await new Promise(r=>{tx.oncomplete=tx.onerror=tx.onabort=()=>r();});}}catch(e){}});
}
async function v104LoadBattleCheckpoint(){
  let local=null;const raw=v104SafeLocalGet(V104_BATTLE_KEY);
  if(raw){try{local=JSON.parse(raw);}catch(e){}}
  const idb=await v104IdbGet('battle-checkpoint');
  const candidates=[local,idb].filter(x=>x&&x.schema===1&&x.battle&&!x.battle.gameOver).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!candidates.length)return null;
  V104_LAST_CHECKPOINT=candidates[0];return candidates[0];
}

function v104ResumeBattle(){
  if(!V104_LAST_CHECKPOINT?.battle){toast('이어할 전투 저장이 없습니다.');return;}
  try{
    G.battle=v104RestoreBattle(V104_LAST_CHECKPOINT.battle);

    $('#screen-hub').classList.remove('active');$('#screen-battle').classList.add('active');
    renderHudSlots();updateBattleHUD();renderBattle();

function v104ExportBackup(){
  if(V104_SAVE_BLOCKED){alert('기존 저장 데이터를 읽지 못해 현재 임시 화면을 백업하지 않습니다. 먼저 정상 백업을 가져와 복구해 주세요.');return;}

  const payload={format:'TENEBRAE_SAVE_BACKUP',formatVersion:1,exportedAt:new Date().toISOString(),account:G.save,battle:G.battle&&!G.battle.gameOver?v104BattleSnapshot(G.battle):V104_LAST_CHECKPOINT?.battle||null};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`TENEBRAE_save_backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('저장 백업 파일을 만들었습니다.');
}
function v104ImportBackupFile(file){
  if(!file)return;
  const reader=new FileReader();reader.onload=()=>{
    try{
      const parsed=JSON.parse(String(reader.result||''));
      if(parsed.format!=='TENEBRAE_SAVE_BACKUP'||!parsed.account)throw new Error('TENEBRAE 백업 파일이 아닙니다.');
      const account=v104NormalizeAccount(parsed.account);
      let importedBattle=null;
      if(parsed.battle){const check=v104RestoreBattle(parsed.battle);importedBattle={schema:1,updatedAt:Date.now(),stage:check.stage,time:check.time,battle:parsed.battle};}
      if(!confirm('현재 진행 상황을 백업 파일의 데이터로 교체할까요?'))return;
      V104_SAVE_BLOCKED=false;G.save=account;writeSave();
      if(importedBattle){V104_LAST_CHECKPOINT=importedBattle;v104SafeLocalSet(V104_BATTLE_KEY,JSON.stringify(V104_LAST_CHECKPOINT));V104_WRITE_CHAIN=V104_WRITE_CHAIN.then(()=>v104IdbPut('battle-checkpoint',V104_LAST_CHECKPOINT).catch(()=>false));}
      else clearBattleCheckpoint();
      renderHub();v104UpdateResumeButton();toast('백업 데이터를 불러왔습니다.');
    }catch(e){alert('백업을 불러오지 못했습니다.\n'+e.message);}
  };reader.onerror=()=>alert('백업 파일을 읽지 못했습니다.');reader.readAsText(file);
}

function heroPortraitUrl(h){return V104_HERO_SPRITE_URLS[h.id] || svgData(heroPortraitSvg(h));}

function v104HeroImage(id){
  if(V104_HERO_IMAGE_CACHE.has(id))return V104_HERO_IMAGE_CACHE.get(id);
  const h=HEROES.find(x=>x.id===id);if(!h)return null;
  const img=new Image();img.src=heroPortraitUrl(h);V104_HERO_IMAGE_CACHE.set(id,img);return img;
}
function drawHeroSprite(ctx,h){
  const x=h.x,y=h.y,depth=.47+clamp((y-340)/330,0,1)*.055;
  const width=100*depth,height=108*depth,img=v104HeroImage(h.id);
  ctx.save();
  if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,x-width/2,y-height,width,height);
  else{
    // Rounded humanoid fallback while the per-hero SVG finishes loading.
    ctx.fillStyle='rgba(20,27,20,.28)';ctx.beginPath();ctx.ellipse(x,y+1,12,3.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#586354';ctx.strokeStyle='#222b22';ctx.lineWidth=2.2;ctx.beginPath();ctx.roundRect(x-9,y-30,18,23,5);ctx.fill();ctx.stroke();
    ctx.fillStyle='#d5cbb5';ctx.beginPath();ctx.arc(x,y-38,8,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#333b31';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-4,y-8);ctx.lineTo(x-5,y-1);ctx.moveTo(x+4,y-8);ctx.lineTo(x+5,y-1);ctx.stroke();
  }
  // Thin cooldown line above the head: it fills left-to-right; full white means usable.
  const cost=h.manaCost*(G.battle?.traits?.mana_eff?Math.pow(.92,G.battle.traits.mana_eff):1)*(h.buffs?.mana||1);
  const groupBusy=[25,26,27,29,30].includes(h.id)&&summonGroupAlive(h.id);
  const ready=!!(G.battle&&h.skillCd<=.05&&G.battle.mana>=cost&&!groupBusy);
  let progress=clamp(1-(h.skillCd||0)/(h.hero.cd||1),0,1);
  if(h.skillCd<=.05&&!ready)progress=0;
  if(ready)progress=1;
  const barW=37*depth/.50,barH=3.4,barX=x-barW/2,barY=y-height-4;
  ctx.fillStyle='rgba(10,14,11,.88)';ctx.fillRect(barX-1,barY-1,barW+2,barH+2);
  if(progress>0){ctx.fillStyle=ready?'#fffef3':'rgba(238,239,224,.82)';ctx.fillRect(barX,barY,barW*progress,barH);}
  ctx.strokeStyle='rgba(20,25,20,.95)';ctx.lineWidth=.7;ctx.strokeRect(barX-1,barY-1,barW+2,barH+2);
  // Small nameplate under the feet; keep it clear of the next formation row.
  ctx.font='bold 7.4px Arial';ctx.textAlign='center';ctx.textBaseline='top';
  const label=h.hero.name,w=Math.min(76,Math.max(30,ctx.measureText(label).width+7));
  ctx.fillStyle='rgba(19,26,20,.78)';ctx.fillRect(x-w/2,y+2,w,10);
  ctx.strokeStyle='rgba(221,218,197,.55)';ctx.lineWidth=.6;ctx.strokeRect(x-w/2,y+2,w,10);
  ctx.fillStyle='#fff7df';ctx.strokeStyle='#182019';ctx.lineWidth=1.6;ctx.strokeText(label,x,y+3);ctx.fillText(label,x,y+3);
  if((h.attackAnim||0)>0){ctx.globalAlpha=Math.min(.6,h.attackAnim*2);ctx.strokeStyle=elementInk(h.hero.el);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+10,y-height*.48,12,-.8,.65);ctx.stroke();}
  if((h.skillAnim||0)>0){ctx.globalAlpha=Math.min(.55,h.skillAnim);ctx.strokeStyle='#eee4c7';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(x,y-height*.55,23,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}

/* Keep the requested full-body sprite in all hub and battle formation views. */
function v104SetBattleFormation(){
  if(!G.battle)return;
  G.battle.heroes.forEach((h,i)=>{h.x=[98,188,278][i%3];h.y=388+Math.floor(i/3)*68+(i%3)*3;});
}

/* Preserve the original start/finish logic and add checkpoint lifecycle around it. */
const v104OriginalStartBattle=startBattle;
startBattle = function startBattle(){
  if(V104_SAVE_BLOCKED){alert('저장 데이터를 복구하기 전에는 새 전투를 시작할 수 없습니다. 저장 백업을 불러와 주세요.');return;}
  if(V104_LAST_CHECKPOINT && !G.battle){
    if(!confirm('저장된 전투가 있습니다. 새 전투를 시작하면 이어하기 데이터가 삭제됩니다. 새로 시작할까요?'))return;
    clearBattleCheckpoint();
  }
  v104OriginalStartBattle();
  if(G.battle){v104SetBattleFormation();saveBattleCheckpoint(true);}
};
const v104OriginalWinBattle=winBattle;
winBattle = function winBattle(){const result=v104OriginalWinBattle();clearBattleCheckpoint();return result;};
const v104OriginalLoseBattle=loseBattle;
loseBattle = function loseBattle(){const result=v104OriginalLoseBattle();clearBattleCheckpoint();return result;};
const v104OriginalConfirmResult=confirmResult;
confirmResult = function confirmResult(){clearBattleCheckpoint();return v104OriginalConfirmResult();};

const v104OriginalSimulate=simulate;
simulate = function simulate(dt){
  v104OriginalSimulate(dt);
  if(G.battle&&!G.battle.gameOver)saveBattleCheckpoint(false);
};
const v104OriginalShowCardSelection=showCardSelection;
showCardSelection = function showCardSelection(info){if(G.battle)G.battle.cardSelectionInfo=JSON.parse(JSON.stringify(info||{}));return v104OriginalShowCardSelection(info);};
const v104OriginalSelectCard=selectCard;
selectCard = function selectCard(card){const r=v104OriginalSelectCard(card);if(G.battle){if(!$('#cardModal').classList.contains('open'))G.battle.cardSelectionInfo=null;saveBattleCheckpoint(true);}return r;};

const v104OriginalRenderHub=renderHub;
renderHub = function renderHub(){v104OriginalRenderHub();v104UpdateResumeButton();};

function init(){
  fitStage();
  (async()=>{
    V104_DB=await v104OpenDB();
    G.save=await v104LoadAccount();
    // Migrate older castle formations safely: compact deployed heroes before enforcing the six-hero ceiling.
    G.save.formation=(G.save.formation||[]).filter(Boolean).slice(0,6);
    while(G.save.formation.length<6)G.save.formation.push(null);
    for(const h of HEROES)heroSave(h.id);
    if(!V104_SAVE_BLOCKED)writeSave();
    V104_LAST_CHECKPOINT=await v104LoadBattleCheckpoint();
    renderHub();bindUI();
    $('#btnExportSave').onclick=v104ExportBackup;
    $('#btnImportSave').onclick=()=>$('#saveImportFile').click();
    $('#saveImportFile').addEventListener('change',ev=>{v104ImportBackupFile(ev.target.files?.[0]);ev.target.value='';});
    $('#btnResumeBattle').onclick=v104ResumeBattle;
    $('#screen-hub').classList.add('active');$('#screen-battle').classList.remove('active');
    if(V104_SAVE_BLOCKED){setTimeout(()=>alert(V104_SAVE_ERROR),250);}
    else if(V104_SAVE_RECOVERED){toast('기본 저장본 대신 백업 저장본을 복구했습니다. 저장 백업을 내려받아 두세요.');}
    else if(V104_SAVE_ERROR){toast('저장 경고: '+V104_SAVE_ERROR);}
    v104UpdateResumeButton();
  })().catch(e=>{console.error(e);alert('TENEBRAE 저장 초기화 중 문제가 발생했습니다. 기존 저장 데이터는 덮어쓰지 않았습니다.\n'+e.message);});

// Spread the 36 mechanics across the 36 heroes with three unique mechanics per hero.
// This produces 108 individually named cards without repeating a hero's own effect.
const V105_HERO_CARD_POOL = HEROES.flatMap((hero,i)=>{
  const indexes=[(i*7)%36,(i*7+11)%36,(i*7+23)%36];
  return indexes.map((mi,slot)=>{
    const m=V105_CARD_MECHANICS[mi];
    return {id:`v105_h${hero.id}_${slot+1}`,heroId:hero.id,heroName:hero.name,slot:slot+1,
      name:`${hero.name} · ${m.title}`,rarity:m.rarity,cat:'hero',desc:`${hero.name} 전용 효과 — ${m.desc}`,
      icon:hero.icon,effectKey:m.key,_key:`v105_h${hero.id}_${slot+1}`};
  });
});

function v105WeightedPick(arr,weights){
  const pool=arr.filter(x=>(weights[x.rarity]||0)>0);if(!pool.length)return arr[0]||null;
  const total=pool.reduce((n,x)=>n+weights[x.rarity],0);let r=Math.random()*total;
  for(const x of pool){r-=weights[x.rarity];if(r<=0)return x;}return pool[pool.length-1];
}
function v105EligibleHeroCards(b,used){
  const out=[];
  for(const deployed of (b.heroes||[])){
    const stacks=deployed.cardStacks||{};
    for(const card of V105_HERO_CARD_POOL){
      if(card.heroId!==deployed.id)continue;
      if((stacks[card.id]||0)>0||used.has(card._key))continue;
      out.push({...card});
    }
  }
  return out;
}
function v105BuildCardDraft(info={}){
  const b=G.battle,timeMin=(b.time||0)/60,weights={...getRarityWeights(timeMin)};
  const used=new Set(),cards=[];
  const eligible=()=>v105EligibleHeroCards(b,used);
  const art=()=>ARTIFACTS.filter(a=>!b.artifacts[a.id]&&!used.has('a_'+a.id)).map(a=>({...a,cat:'artifact',_key:'a_'+a.id}));
  const traits=()=>TRAITS.filter(t=>(b.traits[t.id]||0)<t.max&&!used.has('t_'+t.id)).map(t=>({...t,cat:'trait',_key:'t_'+t.id}));
  const pools=()=>({hero:eligible(),artifact:art(),trait:traits()});
  function pickCat(cat,rarity=null){const p=pools()[cat]||[];const q=rarity?p.filter(x=>x.rarity===rarity):p;return v105WeightedPick(q,rarity?{[rarity]:100}:weights);}
  // Preserve milestone rarity guarantees, but select from eligible deployed heroes first when possible.
  let guarantee=null;
  if(info.legendary||info.minute===35)guarantee='legendary';
  else if(info.time&&info.minute>=15)guarantee='epic';
  else if(info.time&&info.minute>=5)guarantee='rare';
  if(guarantee){
    let forced=pickCat('hero',guarantee)||pickCat('artifact',guarantee)||pickCat('trait',guarantee);
    if(forced){cards.push(forced);used.add(forced._key);}
  }
  // Hero cards are deliberately favored (55% of category rolls) while other card types remain present.
  let guard=0;
  while(cards.length<3&&guard++<100){
    const p=pools();
    const available={hero:p.hero.length>0,artifact:p.artifact.length>0,trait:p.trait.length>0};
    let cat;
    if(available.hero&&Math.random()<.55)cat='hero';
    else{
      const ordinary=[];if(available.artifact)ordinary.push('artifact');if(available.trait)ordinary.push('trait');
      if(ordinary.length)cat=ordinary[Math.floor(Math.random()*ordinary.length)];
      else if(available.hero)cat='hero';else break;
    }
    const picked=pickCat(cat);
    if(picked&&!used.has(picked._key)){cards.push(picked);used.add(picked._key);}
  }
  // Ensure at least one deployed-hero card whenever one is available in the current draft.
  if(eligible().length && !cards.some(c=>c.cat==='hero')){
    const hc=v105WeightedPick(eligible(),weights);
    if(hc){if(cards.length>=3)cards[2]=hc;else cards.push(hc);}
  }
  // If the roster has completed all hero cards, fill only with standard cards.
  while(cards.length<3){const p=pools();const fallback=[...p.artifact,...p.trait];if(!fallback.length)break;const c=v105WeightedPick(fallback,weights);if(!c)break;cards.push(c);used.add(c._key);}
  return cards;
}

function v105ApplyHeroCard(h,c){
  if(!h||!c||c.heroId!==h.id)return;
  h.cardStacks=h.cardStacks||{};if(h.cardStacks[c.id])return;
  h.cardStacks[c.id]=1;h.cardMods=h.cardMods||{effects:[]};h.cardMods.effects=h.cardMods.effects||[];
  h.cardMods.effects.push(c.effectKey);
  // A few effects also have clear continuous values; the rest are triggered by their own mechanic handlers.
  const m=h.cardMods;
  if(c.effectKey==='cooldown')h.buffs.cd=(h.buffs.cd||1)*.90;
  if(c.effectKey==='manaCost')h.buffs.mana=(h.buffs.mana||1)*.86;
  if(c.effectKey==='range'){h.attackRange=(h.attackRange||520)*1.16;h.skillRange=(h.skillRange||680)*1.16;}
  if(c.effectKey==='summonDamage')h.buffs.summon=(h.buffs.summon||1)*1.18;
  if(c.effectKey==='summonSpeed')h.buffs.summonSpeed=(h.buffs.summonSpeed||1)*1.16;
  if(c.effectKey==='summonGuard')h.buffs.summonGuard=(h.buffs.summonGuard||1)*1.16;
  if(c.effectKey==='boss')h.buffs.bossDmg=(h.buffs.bossDmg||1)*1.16;
  if(c.effectKey==='splash')h.buffs.range=(h.buffs.range||1)*1.30;
  if(c.effectKey==='homing')h.buffs.projSpd=(h.buffs.projSpd||1)*1.18;
  h.cardsCollected=(h.cardsCollected||0)+1;

    h.evolutionStartedAt=G.battle.time;

  }
}

const v105BaseSelectCard=selectCard;

// Probability-based card effects become guaranteed after evolution, with internal proc cooldowns.
function v105TryProc(h,key,chance,internalCd=.8){
  if(!h||!G.battle)return false;h.v105ProcTimes=h.v105ProcTimes||{};const now=G.battle.time||0;
  if((h.v105ProcTimes[key]||0)>now)return false;
  if(h.evolved||Math.random()<chance){h.v105ProcTimes[key]=now+internalCd;return true;}return false;
}
// Card mechanics are attached to the corresponding deployed hero only.
const v105BaseApplyHeroDamage=applyHeroDamage;
applyHeroDamage=function applyHeroDamage(h,e,amount,isSkill){
  if(!h||!e)return v105BaseApplyHeroDamage(h,e,amount,isSkill);
  const effects=h.cardMods?.effects||[];let dmg=amount;
  if(effects.includes('execute')&&e.hp/e.maxHp<=.30)dmg*=1.24;
  if(effects.includes('crit')&&v105TryProc(h,'crit',.09,1.0))dmg*=1.55;
  if(effects.includes('battleStance')&&G.battle.castleHP/G.battle.castleMax<=.35)dmg*=1.18;
  const dealt=v105BaseApplyHeroDamage(h,e,dmg,isSkill);
  if(e.dead){
    if(effects.includes('manaReturn')&&v105TryProc(h,'manaReturn',.12,.8))G.battle.mana=Math.min(G.battle.manaMax,G.battle.mana+18);
    if(effects.includes('siphon'))G.battle.castleHP=Math.min(G.battle.castleMax,G.battle.castleHP+G.battle.castleMax*.0012);
    if(effects.includes('killBurst')||effects.includes('corpseBloom')){
      const radius=effects.includes('corpseBloom')?74:52;
      G.battle.effects.push({type:'ultimateV105',mode:'killBloom',x:e.x,y:e.y,life:.65,maxLife:.65,accent:elementInk(h.hero.el)});
      for(const other of G.battle.enemies){if(other!==e&&!other.dead&&Math.hypot(other.x-e.x,other.y-e.y)<radius)v105BaseApplyHeroDamage(h,other,heroBaseDmg(h.level)*.30,true);}
    }
  }else{
    if(effects.includes('burn')&&v105TryProc(h,'burn',.28,.9)){e.dot=e.dot||[];e.dot.push({dps:heroBaseDmg(h.level)*.16,dur:3,heroId:h.id});}
    if(effects.includes('frost')&&v105TryProc(h,'frost',.24,1.0)&&!e.isBoss)e.slow=Math.max(e.slow||0,1);
    if(effects.includes('mark')&&isSkill){e.marked=true;e.markTimer=Math.max(e.markTimer||0,3);}
    if(effects.includes('push')&&v105TryProc(h,'push',.18,.9)&&!e.isBoss)e.x=Math.min(1170,e.x+42);
    if(effects.includes('root')&&isSkill&&!e.isBoss)e.stun=Math.max(e.stun||0,.8);
    if(effects.includes('time')&&v105TryProc(h,'time',.2,1.1))e.slow=Math.max(e.slow||0,1.2);
    if(effects.includes('chain')&&v105TryProc(h,'chain',.22,1.1)){
      let n=0;for(const other of G.battle.enemies){if(other!==e&&!other.dead&&Math.hypot(other.x-e.x,other.y-e.y)<110){v105BaseApplyHeroDamage(h,other,amount*.35,false);if(++n>=2)break;}}
    }
    if(effects.includes('ricochet')&&v105TryProc(h,'ricochet',.22,1.0)){const other=G.battle.enemies.find(x=>x!==e&&!x.dead&&Math.abs(x.x-e.x)<180);if(other)v105BaseApplyHeroDamage(h,other,amount*.32,false);}
    if(effects.includes('manaReturn')&&v105TryProc(h,'manaReturn',.12,.8))G.battle.mana=Math.min(G.battle.manaMax,G.battle.mana+18);
  }
  return dealt;
};

const v105BaseUseSkill=useSkill;
useSkill=function useSkill(h){
  const b=G.battle;if(!b||!h)return v105BaseUseSkill(h);
  const before=b.enemies.filter(e=>!e.dead).length;
  v105BaseUseSkill(h);
  const effects=h.cardMods?.effects||[];
  if(effects.includes('ward'))b.castleHP=Math.min(b.castleMax,b.castleHP+b.castleMax*.0035);
  if(effects.includes('skillEcho')||effects.includes('multiHit')||effects.includes('delayed')||effects.includes('elementField')||effects.includes('field')){
    const target=findTargetForHero(h);
    const mode=effects.includes('elementField')?'elementField':effects.includes('delayed')?'delayed':effects.includes('multiHit')?'multiHit':effects.includes('field')?'field':'skillEcho';
    b.effects.push({type:'ultimateV105',mode,x:target?.x||600,y:target?.y||520,life:2.4,maxLife:2.4,accent:elementInk(h.hero.el),heroId:h.id});
    const base=heroBaseDmg(h.level)*Math.pow(1.05,h.promo);
    const nearby=b.enemies.filter(e=>!e.dead&&Math.hypot(e.x-(target?.x||600),e.y-(target?.y||520))<95);
    if(mode==='skillEcho'&&v105TryProc(h,'skillEcho',.32,4.0))nearby.forEach(e=>applyHeroDamage(h,e,base*.32,true));
    if(mode==='multiHit')nearby.forEach(e=>applyHeroDamage(h,e,base*.25,true));
    if(mode==='delayed')nearby.forEach(e=>{e.dot=e.dot||[];e.dot.push({dps:base*.2,dur:1.5,heroId:h.id});});
    if(mode==='elementField')nearby.forEach(e=>{if(!e.isBoss)e.slow=Math.max(e.slow||0,1.1);});
    if(mode==='field')b.effects.push({type:'pool',x:target?.x||600,y:target?.y||520,r:88,life:2.2,maxLife:2.2,dps:base*.18,hero:h});
  }
  if(effects.includes('skillRefund')&&v105TryProc(h,'skillRefund',.12,4.0))h.skillCd=Math.max(0,h.skillCd-h.hero.cd*.22);
};

// Echo and split mechanics alter real projectile creation without replacing the base combat loop.
const v105BaseUpdateHero=updateHero;
updateHero=function updateHero(h,dt){
  if(!h)return;
  const b=G.battle,pre=b?.projectiles?.length||0;
  v105BaseUpdateHero(h,dt);
  if(!b)return;
  const added=b.projectiles.slice(pre).filter(p=>p.type==='heroBolt'&&p.hero?.id===h.id);
  const effects=h.cardMods?.effects||[];
  if(added.length&&effects.includes('echoShot')&&v105TryProc(h,'echoShot',.24,1.0)){const p=added[0];b.projectiles.push({...p,x:p.x-5,y:p.y-6,dmg:p.dmg*.55,life:p.life+.12});}
  if(added.length&&effects.includes('splitShot')&&v105TryProc(h,'splitShot',.18,1.15)){const p=added[0];b.projectiles.push({...p,x:p.x+6,y:p.y+6,dmg:p.dmg*.5,splash:p.splash*.65});}
  if(added.length&&effects.includes('piercing')){added[0].splash=(added[0].splash||44)+22;}
  if(added.length&&effects.includes('homing'))added.forEach(p=>p.speed*=1.18);
  if(h.ultimateUnlocked){h.ultimateCd=Math.max(0,(h.ultimateCd||0)-dt);if(b.autoSkills&&h.ultimateCd<=0)castHeroUltimate(h,true);}
};

function v105TargetList(b,count=8){return b.enemies.filter(e=>!e.dead&&e.hp>0).sort((a,b)=>a.x-b.x).slice(0,count);}
function v105BestCluster(b){
  const list=b.enemies.filter(e=>!e.dead&&e.hp>0);if(!list.length)return {x:730,y:520};
  let best=list[0],score=-1;
  for(const e of list){const n=list.filter(o=>Math.hypot(o.x-e.x,o.y-e.y)<150).length;if(n>score){score=n;best=e;}}

}
function v105Hit(h,e,mul){if(!e||e.dead)return;const base=heroBaseDmg(h.level)*Math.pow(1.05,h.promo);applyHeroDamage(h,e,base*mul,true);}
function v105Area(h,x,y,r,mul,filter=null){const b=G.battle;for(const e of b.enemies){if(e.dead||Math.hypot(e.x-x,e.y-y)>r)continue;if(filter&&!filter(e))continue;v105Hit(h,e,mul);}}
function v105Line(h,x1,y1,x2,y2,width,mul){const b=G.battle;const dx=x2-x1,dy=y2-y1,len=dx*dx+dy*dy||1;for(const e of b.enemies){if(e.dead)continue;const t=clamp(((e.x-x1)*dx+(e.y-y1)*dy)/len,0,1),px=x1+t*dx,py=y1+t*dy;if(Math.hypot(e.x-px,e.y-py)<=width)v105Hit(h,e,mul);}}
function v105ResolveUltimate(h,step=0){
  const b=G.battle,def=V105_ULTIMATES[h.id-1];if(!b||!def)return;
  const all=b.enemies.filter(e=>!e.dead&&e.hp>0),cluster=v105BestCluster(b),base=heroBaseDmg(h.level)*Math.pow(1.05,h.promo);
