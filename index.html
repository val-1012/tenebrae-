    case 'magma': {const x=[430,650,870][step%3];v105Area(h,x,530,115,1.65);for(const e of all){if(Math.abs(e.x-x)<110&&!e.isBoss)e.slow=Math.max(e.slow||0,1.6);}break;}
    case 'meteor': {const c=step%3===0?cluster:v105BestCluster(b);v105Area(h,c.x+(step-1)*42,c.y,150,step===2?3.4:2.1);break;}
    case 'phoenix': {const e=near(6).sort((a,b)=>b.hp-a.hp)[0];if(e){v105Hit(h,e,2.25);b.effects.push({type:'ultimateV105',mode:'phoenixHit',x:e.x,y:e.y,life:.8,maxLife:.8,accent:'#b86b42'});}break;}
    case 'prism': {v105Line(h,410,380+step*48,1040,580+step*10,45,2.15);break;}
    case 'basalt': {b.castleHP=Math.min(b.castleMax,b.castleHP+b.castleMax*.09);v105Area(h,330,535,180,2.0);break;}
    case 'circuit': {let list=near(4);list.forEach((e,i)=>{v105Hit(h,e,1.75);b.effects.push({type:'ultimateV105',mode:'chain',x:e.x,y:e.y,life:.55,maxLife:.55,accent:'#a9b4a0'});});break;}
    case 'assassin': {const e=all.slice().sort((a,b)=>a.hp-b.hp)[Math.min(step,all.length-1)];if(e)v105Hit(h,e,2.55);break;}
    case 'magnetic': {for(const e of all){const dx=cluster.x-e.x,dy=cluster.y-e.y,d=Math.hypot(dx,dy)||1;if(d<320){if(!e.isBoss){e.x+=dx/d*Math.min(75,d*.35);e.y+=dy/d*Math.min(45,d*.25);}else e.slow=Math.max(e.slow||0,1.4);}}v105Area(h,cluster.x,cluster.y,155,1.8);break;}
    case 'gale': {for(const e of all){if(e.isBoss)e.slow=Math.max(e.slow||0,2.8);else e.x=Math.min(1160,e.x+130);}v105Area(h,730,520,340,1.35);break;}
    case 'blackout': {for(const e of all){if(!e.isBoss)e.stun=Math.max(e.stun||0,1.25);}v105Area(h,690,520,400,1.65);break;}
    case 'thunder': {const e=all[Math.floor(Math.random()*Math.max(1,all.length))];if(e)v105Area(h,e.x,e.y,95,1.55);break;}
    case 'iceSanctuary': {v105Area(h,360,540,230,1.8);for(const e of all){if(e.isBoss)e.slow=Math.max(e.slow||0,2.3);else e.stun=Math.max(e.stun||0,1.1);}break;}
    case 'glacier': {v105Line(h,420,650,1030,365,60,2.4);for(const e of all){if(!e.isBoss&&e.x>420&&e.x<1030)e.slow=Math.max(e.slow||0,2);}break;}
    case 'abyss': {v105Line(h,390,385,1040,650,105,2.0);break;}
    case 'blizzard': {for(const e of near(8)){e.dot=e.dot||[];e.dot.push({dps:base*.35,dur:4.5,heroId:h.id});e.slow=Math.max(e.slow||0,2.2);}break;}
    case 'tornado': {const x=[470,680,890][step%3];v105Area(h,x,520,120,1.8);for(const e of all){if(Math.abs(e.x-x)<125&&!e.isBoss)e.stun=Math.max(e.stun||0,.55);}break;}
    case 'fog': {for(const e of all)e.slow=Math.max(e.slow||0,e.isBoss?3.2:4.5);v105Area(h,700,520,420,1.1);break;}
    case 'alastor': {v105Area(h,520,520,420,2.65);for(const e of near(5)){if(e.isBoss)e.slow=Math.max(e.slow||0,1.2);}b.effects.push({type:'ultimateV105',mode:'alastorDemon',x:195,y:570,life:5,maxLife:5,accent:'#9d3934'});break;}
    case 'gravity': {for(const e of all){if(!e.isBoss){e.x+=(cluster.x-e.x)*.28;e.y+=(cluster.y-e.y)*.25;}else e.slow=Math.max(e.slow||0,1.6);}v105Area(h,cluster.x,cluster.y,190,2.35);break;}
    case 'orbit': {for(const e of near(4))v105Hit(h,e,1.9);b.effects.push({type:'ultimateV105',mode:'orbit',x:570,y:520,life:2.6,maxLife:2.6,accent:'#aa9ac2'});break;}

    case 'hound': {const e=all.find(x=>x.isBoss)||all.slice().sort((a,b)=>b.hp-a.hp)[0];if(e)v105Hit(h,e,2.7);break;}
    case 'moth': {for(const e of near(7)){e.dot=e.dot||[];e.dot.push({dps:base*.28,dur:4,heroId:h.id});e.slow=Math.max(e.slow||0,1.8);}break;}
    case 'bell': {for(const e of all){if(Math.abs(e.x-700)<360)v105Hit(h,e,.9);}for(const s of b.summons){s.dmg*=1.16;s.attackCd=Math.min(s.attackCd,.2);}break;}
    case 'mirrorKingdom': {v105Area(h,700,520,400,1.5);b.v105TeamDamageTimer=Math.max(b.v105TeamDamageTimer||0,6);b.effects.push({type:'ultimateV105',mode:'mirrorRing',x:580,y:520,life:5,maxLife:5,accent:'#9daeb5'});break;}
    case 'plague': {for(const e of near(5)){e.dot=e.dot||[];e.dot.push({dps:base*.52,dur:5,heroId:h.id});e.marked=true;e.markTimer=5;}break;}
    case 'thorn': {for(const e of near(6)){if(!e.isBoss)e.stun=Math.max(e.stun||0,1.1);else e.slow=Math.max(e.slow||0,2);v105Hit(h,e,1.5);}break;}
    case 'bloodPact': {const list=near(3);list.forEach(e=>{e.marked=true;e.markTimer=4;v105Hit(h,e,2.0);});break;}

function castHeroUltimate(h,quiet=false){
  const b=G.battle;if(!b||!h||!h.ultimateUnlocked)return false;
  if((h.ultimateCd||0)>.05){if(!quiet)toast(`${h.hero.name} 궁극기 대기 ${Math.ceil(h.ultimateCd)}초`);return false;}
  const def=V105_ULTIMATES[h.id-1];if(!def)return false;
  h.ultimateCd=def.cd*(h.cardMods?.effects?.includes('ultimateCharge')?.88:1);h.ultimateMaxCd=def.cd;h.ultimateAnim=def.mode;
  const steps=({meteor:[.8,2.0,3.1],phoenix:[.65,1.55,2.45,3.35],prism:[.9,1.65,2.4],magma:[.8,1.7,2.6],thunder:[.45,.9,1.35,1.8,2.25,2.7,3.15,3.6],tornado:[.85,1.8,2.75],assassin:[.65,1.45,2.25],orbit:[.75,1.75,2.75],bell:[.7,1.8,2.9]})[def.mode]||[1.05];
  b.v105UltTasks=b.v105UltTasks||[];
  steps.forEach((delay,i)=>b.v105UltTasks.push({heroId:h.id,mode:def.mode,delay,step:i}));
  b.effects.push({type:'ultimateV105',mode:def.mode,x: def.mode==='alastor'?195:Math.max(280,Math.min(940,h.x+340)),y:520,life:def.mode==='alastor'?5:4.6,maxLife:def.mode==='alastor'?5:4.6,accent:elementInk(h.hero.el),heroId:h.id});
  h.skillAnim=.8;
  if(!quiet)toast(`${h.hero.name} · 궁극기 ${def.name}`);
  renderHudSlots();updateBattleHUD();if(typeof saveBattleCheckpoint==='function')saveBattleCheckpoint(true);return true;
}
function updateV105UltimateTasks(dt){
  const b=G.battle;if(!b)return;
  if(b.v105TeamDamageTimer>0)b.v105TeamDamageTimer=Math.max(0,b.v105TeamDamageTimer-dt);
  b.v105UltTasks=b.v105UltTasks||[];
  for(const task of b.v105UltTasks)task.delay-=dt;
  const ready=b.v105UltTasks.filter(t=>t.delay<=0);b.v105UltTasks=b.v105UltTasks.filter(t=>t.delay>0);
  for(const task of ready){const h=b.heroes.find(x=>x.id===task.heroId);if(h)v105ResolveUltimate(h,task.step);}
}

// Subtle elemental halo: never replace or obscure the base hero sprite.

document.head.appendChild(v105HudSlotStyles);
renderHudSlots=function renderHudSlots(){
  const b=G.battle;if(!b)return;const hud=$('#hudBottom');hud.innerHTML='';
  for(const h of b.heroes){
    const manaCost=h.manaCost*(b.traits.mana_eff?Math.pow(.92,b.traits.mana_eff):1)*(h.buffs.mana||1);

let V106_SAVE_CHAIN = Promise.resolve();
let V106_LAST_SAVE_OK = false;
let V106_LAST_SAVE_TIME = 0;
let V106_AUTOSAVE_TIMER = null;
let V106_ABANDON_BUSY = false;

function v106SetSaveStatus(message, ok){
  const el=document.getElementById('v106SaveStatus');
  if(!el)return;
  el.textContent=message;
  el.classList.toggle('ok',!!ok);
  el.classList.toggle('warn',!ok);
}

function v106WriteLocalAccount(data, envelope){
  let ok=false;
  try{
    const old=localStorage.getItem(SAVE_KEY);
    if(old && v104ParseAccountRecord(old)) localStorage.setItem(V104_SAVE_BACKUP_KEY,old);
    const raw=JSON.stringify(data);
    localStorage.setItem(SAVE_KEY,raw);
    localStorage.setItem(V104_SAVE_META_KEY,JSON.stringify({revision:envelope.revision,updatedAt:envelope.updatedAt}));
    const verify=v104ParseAccountRecord(localStorage.getItem(SAVE_KEY));
    if(!verify)throw new Error('저장 데이터를 다시 읽는 검증에 실패했습니다.');
    ok=true;
  }catch(e){V104_SAVE_ERROR=e?.message||'localStorage 저장에 실패했습니다.';}
  return ok;
}

/* Replace the previous optimistic write (which reported success before IndexedDB committed). */
writeSave=function writeSave(){
  if(!G.save || V104_SAVE_BLOCKED){
    V106_LAST_SAVE_OK=false;
    v106SetSaveStatus('저장 차단됨 · 백업 복구 필요',false);
    return false;
  }
  let data;
  try{data=v104NormalizeAccount(G.save);}catch(e){
    V104_SAVE_ERROR='저장 데이터 검증 실패: '+(e?.message||e);
    V106_LAST_SAVE_OK=false;v106SetSaveStatus('저장 오류',false);return false;
  }
  G.save=data;
  const now=Date.now();
  let meta={revision:0,updatedAt:0};
  try{meta=Object.assign(meta,JSON.parse(v104SafeLocalGet(V104_SAVE_META_KEY)||'{}'));}catch(e){}
  const envelope={__tenebraeEnvelope:1,revision:(Number(meta.revision)||0)+1,updatedAt:now,data};
  const localOK=v106WriteLocalAccount(data,envelope);
  V106_LAST_SAVE_OK=localOK;
  if(localOK){V106_LAST_SAVE_TIME=now;v106SetSaveStatus('로컬 저장 완료',true);}
  else v106SetSaveStatus(V104_DB?'보조 저장 확인 중':'저장 실패 · 백업 필요',false);

  V106_SAVE_CHAIN=V106_SAVE_CHAIN.catch(()=>false).then(async()=>{
    let idbOK=false;
    if(V104_DB){
      try{
        const previous=await v104IdbGet('account-primary');
        if(previous)await v104IdbPut('account-backup',previous);
        await v104IdbPut('account-primary',envelope);
        const verify=await v104IdbGet('account-primary');
        idbOK=!!verify && Number(verify.revision)===envelope.revision && !!v104ParseAccountRecord(verify);
        if(!idbOK)throw new Error('IndexedDB 저장 검증에 실패했습니다.');
      }catch(e){V104_SAVE_ERROR=e?.message||'IndexedDB 저장 실패';}
    }
    V106_LAST_SAVE_OK=localOK||idbOK;
    if(V106_LAST_SAVE_OK){
      V106_LAST_SAVE_TIME=now;
      v106SetSaveStatus(localOK&&idbOK?'이중 저장 완료':localOK?'로컬 저장 완료':'IndexedDB 저장 완료',true);
      V104_SAVE_ERROR='';
      return true;
    }
    V104_SAVE_ERROR=V104_SAVE_ERROR||'브라우저에서 사용할 수 있는 저장 공간이 없습니다. JSON 백업 파일을 내려받아 보관해 주세요.';
    v106SetSaveStatus('저장 실패 · 백업 파일 필요',false);
    return false;
  });
  V104_WRITE_CHAIN=V106_SAVE_CHAIN;
  return localOK || !!V104_DB;
};

async function v106FlushSave(){
  try{await V106_SAVE_CHAIN;await V104_WRITE_CHAIN;return !!V106_LAST_SAVE_OK;}
  catch(e){V104_SAVE_ERROR=e?.message||'저장 작업을 완료하지 못했습니다.';v106SetSaveStatus('저장 실패 · 백업 파일 필요',false);return false;}

/* Checkpoint saves are written synchronously to localStorage and verified in IndexedDB. */

  const now=Date.now();
  if(!force && now-V104_LAST_CHECKPOINT_AT<4000)return true;
  let snap;
  try{snap=v104BattleSnapshot(b);}catch(e){V104_SAVE_ERROR='전투 임시 저장 생성 실패: '+(e?.message||e);return false;}
  if(!snap)return false;
  const rec={schema:1,updatedAt:now,stage:b.stage,time:b.time,battle:snap};
  const raw=JSON.stringify(rec);
  let localOK=v104SafeLocalSet(V104_BATTLE_KEY,raw);
  if(localOK){
    try{const verify=JSON.parse(v104SafeLocalGet(V104_BATTLE_KEY)||'null');localOK=!!verify&&verify.updatedAt===now&&!!verify.battle;}
    catch(e){localOK=false;}
  }
  V104_LAST_CHECKPOINT=rec;V104_LAST_CHECKPOINT_AT=now;
  V106_SAVE_CHAIN=V106_SAVE_CHAIN.catch(()=>false).then(async()=>{
    let idbOK=false;
    if(V104_DB){try{await v104IdbPut('battle-checkpoint',rec);const v=await v104IdbGet('battle-checkpoint');idbOK=!!v&&v.updatedAt===now;}catch(e){V104_SAVE_ERROR='전투 이어하기 IndexedDB 저장 실패: '+(e?.message||e);}}
    if(!localOK&&!idbOK){V104_SAVE_ERROR=V104_SAVE_ERROR||'전투 이어하기 저장에 실패했습니다.';v106SetSaveStatus('전투 저장 실패 · 백업 필요',false);}
    return localOK||idbOK;
  });
  V104_WRITE_CHAIN=V106_SAVE_CHAIN;
  return localOK || !!V104_DB;
};

  modal=document.createElement('div');modal.id='v106AbandonConfirm';
  modal.innerHTML=`<div class="v106ConfirmPanel" role="dialog" aria-modal="true" aria-labelledby="v106AbandonTitle">
    <h3 id="v106AbandonTitle">이번 전투를 포기할까요?</h3>
    <p>현재 스테이지 전투가 종료됩니다.<br>이번 전투에서 얻은 임시 코인과 임시 강화는 사라집니다.<br>영구 보유 코인과 영웅 육성은 유지됩니다.</p>
    <div class="v106ConfirmActions"><button class="btn" id="v106CancelAbandon">계속 전투하기</button><button class="btn" id="v106ConfirmAbandon">포기하고 허브로</button></div>
  </div>`;
  $('#pauseMenu').appendChild(modal);
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});
  modal.querySelector('#v106CancelAbandon').onclick=()=>modal.classList.remove('open');
  modal.querySelector('#v106ConfirmAbandon').onclick=()=>v106AbandonBattleNow();
  return modal;
}
function v106AskAbandon(){
  if(!G.battle||G.battle.gameOver)return;
  v106EnsureAbandonDialog().classList.add('open');
}
async function v106AbandonBattleNow(){
  if(V106_ABANDON_BUSY||!G.battle)return;
  V106_ABANDON_BUSY=true;
  const button=document.getElementById('v106ConfirmAbandon');if(button){button.disabled=true;button.textContent='전투 종료 중…';}
  try{
    const oldBattle=G.battle;
    oldBattle.gameOver=true;oldBattle.abandoned=true;oldBattle.paused=true;
    // Abandonment never pays temporary coins or advances the stage.
    clearBattleCheckpoint();
    $('#v106AbandonConfirm')?.classList.remove('open');
    $('#pauseMenu').classList.remove('open');$('#pauseMenu').setAttribute('aria-hidden','true');
    $('#resultModal').classList.remove('open','win','lose');
    $('#cardModal').classList.remove('open');
    G.battle=null;G.paused=false;G.screen='hub';
    if(typeof battleRAF!=='undefined'&&battleRAF){cancelAnimationFrame(battleRAF);battleRAF=null;}
    if(typeof battleAccum!=='undefined')battleAccum=0;
    if(typeof battleLastTs!=='undefined')battleLastTs=0;
    $('#screen-battle').classList.remove('active');$('#screen-hub').classList.add('active');
    writeSave();
    await v106FlushSave();
    await V106_SAVE_CHAIN.catch(()=>false);
    renderHub();
    v104UpdateResumeButton();
    toast('전투를 포기하고 허브로 돌아왔습니다. 영구 진행도는 유지됩니다.');
  }catch(e){
    console.error('Abandon failed',e);
    toast('전투 종료 처리에 실패했습니다: '+(e?.message||e));
  }finally{
    V106_ABANDON_BUSY=false;
    if(button){button.disabled=false;button.textContent='포기하고 허브로';}
  }
}

const v106BaseBindUI=bindUI;
bindUI=function bindUI(){
  v106BaseBindUI();
  const abandon=document.getElementById('btnAbandon');if(abandon)abandon.onclick=v106AskAbandon;
  document.querySelectorAll('[data-pause-page]').forEach(btn=>{
    btn.onclick=()=>{const page=btn.dataset.pausePage;if(page==='damage')showHeroDamagePage();else if(page==='codex')showEnemyCodex();else if(page==='currentArtifacts')showCurrentArtifacts();else if(page==='allArtifacts')showAllArtifacts();};
  });
  const saveNow=document.getElementById('btnSaveNow');if(saveNow)saveNow.onclick=async()=>{
    const ok=writeSave();
    if(G.battle&&!G.battle.gameOver)saveBattleCheckpoint(true);
    const done=await v106FlushSave();
    toast(done?'저장 완료':'저장 실패 — 저장 백업을 내려받아 주세요.');
  };
};

/* Frequent background flush reduces loss on a sudden close. Each write is verified. */
const v106BaseInit=init;
init=function init(){
  v106BaseInit();
  if(V106_AUTOSAVE_TIMER)clearInterval(V106_AUTOSAVE_TIMER);
  V106_AUTOSAVE_TIMER=setInterval(async()=>{
    if(!G.save||V104_SAVE_BLOCKED)return;
    writeSave();
    if(G.battle&&!G.battle.gameOver)saveBattleCheckpoint(true);
    await v106FlushSave();
  },5000);
};

window.TENEBRAE_V1051={
  flushSave:v106FlushSave,
  abandon:v106AbandonBattleNow,
  getSaveStatus:()=>({ok:V106_LAST_SAVE_OK,error:V104_SAVE_ERROR,updatedAt:V106_LAST_SAVE_TIME,dbAvailable:!!V104_DB})
};


init();

// 디버그용 글로벌
window.TENEBRAE = Object.assign(window.TENEBRAE || {}, { G, HEROES, startBattle, writeSave });
</script>
