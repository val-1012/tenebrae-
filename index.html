<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENEBRAE (테네브래) — v1.0.5.1 안정화 핫픽스</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0c; font-family:'Georgia','Times New Roman',serif; color:#d8d4cc; user-select:none; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
#stage { position:relative; width:1280px; height:720px; transform-origin:top left; background:#1a1815; overflow:hidden; }
canvas { display:block; position:absolute; inset:0; }

/* ===== 공용 UI ===== */
.panel { background:rgba(20,18,16,0.92); border:1px solid #4a463f; box-shadow:0 0 20px #000 inset; }
.btn { background:linear-gradient(#3a3630,#252220); border:1px solid #6a6358; color:#e8e2d8; padding:8px 14px; cursor:pointer; font-family:inherit; font-size:14px; letter-spacing:0.5px; transition:all .12s; }
.btn:hover { background:linear-gradient(#4d4840,#332f2b); border-color:#a89a80; }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn.primary { border-color:#8a7a55; background:linear-gradient(#4a4230,#2c271e); }
.btn.primary:hover { border-color:#d0b070; }
.num { font-family:'Courier New',monospace; font-weight:bold; }

/* 화면 전환 */
.screen { position:absolute; inset:0; display:none; flex-direction:column; }
.screen.active { display:flex; }

/* ===== 허브 화면 ===== */
#hubTop { display:flex; justify-content:space-between; align-items:center; padding:10px 18px; border-bottom:1px solid #3a352e; background:rgba(10,9,8,0.85); z-index:5; }
#hubTop .stat { display:flex; gap:16px; align-items:center; font-size:13px; }
#hubTop .stat span b { color:#e8d8a8; font-size:15px; }
#hubScene { flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:radial-gradient(ellipse at center, #2a2620 0%, #0e0c0a 80%); }
#hubCastleWrap { position:relative; z-index:2; text-align:center; }
#hubCastleWrap canvas { position:relative; }
#hubFormation { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; max-width:900px; }
.slot { width:64px; height:64px; border:2px solid #5a5448; background:rgba(30,28,24,0.9); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:all .15s; }
.slot:hover { border-color:#b0a070; }
.slot.empty { border-style:dashed; opacity:.6; }
.slot .slotIcon { font-size:24px; pointer-events:none; }
.slot .slotName { position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-size:9px; white-space:nowrap; color:#a89880; }
#hubBottom { display:flex; gap:12px; justify-content:center; padding:14px; background:rgba(10,9,8,0.9); border-top:1px solid #3a352e; z-index:5; }
#hubBottom .btn { min-width:150px; padding:12px 16px; font-size:15px; }

/* ===== 모달 ===== */
.modal { position:absolute; inset:0; background:rgba(0,0,0,0.85); display:none; flex-direction:column; z-index:50; }
.modal.open { display:flex; }
.modalHeader { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid #4a463f; background:rgba(15,13,11,0.95); }
.modalHeader h2 { font-size:20px; color:#e8d8a8; font-weight:normal; letter-spacing:2px; }
.modalBody { flex:1; overflow-y:auto; padding:16px; }

/* 영웅 관리 */
#heroList { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; }
.heroCard { background:rgba(30,28,24,0.9); border:1px solid #4a463f; padding:8px; cursor:pointer; transition:all .12s; position:relative; }
.heroCard:hover { border-color:#a89a80; background:rgba(45,42,36,0.9); }
.heroCard.selected { border-color:#d0b070; box-shadow:0 0 8px rgba(208,176,112,0.4); }
.heroCard.owned { border-left:3px solid #8a7a55; }
.heroCard .hIcon { font-size:26px; text-align:center; margin-bottom:4px; }
.heroCard .hName { font-size:12px; text-align:center; color:#e8e2d8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.heroCard .hSub { font-size:10px; text-align:center; color:#8a7f6a; margin-top:2px; }
.heroCard .hPrice { font-size:10px; text-align:center; color:#d0b070; margin-top:2px; }
.heroCard .hBadge { position:absolute; top:4px; right:4px; font-size:9px; background:#5a4a2a; color:#e8d8a8; padding:1px 4px; border-radius:2px; }
#heroDetail { margin-top:12px; background:rgba(20,18,16,0.95); border:1px solid #4a463f; padding:14px; min-height:160px; }
#heroDetail .ddTitle { font-size:16px; color:#e8d8a8; margin-bottom:8px; }
#heroDetail .ddRow { display:flex; gap:20px; flex-wrap:wrap; font-size:12px; margin-bottom:8px; }
#heroDetail .ddRow span b { color:#d0b070; }
#heroDetail .ddSkill { font-size:12px; color:#b8ae9a; margin:8px 0; line-height:1.5; }
#heroDetail .ddActions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

/* 성 강화 */
#castleUpgradeBody { padding:30px; text-align:center; }
.cuStats { display:flex; justify-content:center; gap:40px; margin:20px 0; flex-wrap:wrap; }
.cuStat { background:rgba(30,28,24,0.9); border:1px solid #4a463f; padding:16px 24px; min-width:140px; }
.cuStat .lbl { font-size:11px; color:#8a7f6a; letter-spacing:1px; }
.cuStat .val { font-size:22px; color:#e8d8a8; margin-top:4px; font-family:'Courier New',monospace; }

/* ===== 전투 화면 ===== */
#battle { background:#0e0d0b; }
#battleCanvas { position:absolute; inset:0; }
#battleHUD { position:absolute; inset:0; pointer-events:none; z-index:10; }
#battleHUD .hudBox { pointer-events:auto; }
#battleHUD #hudRight, #battleHUD #hudRight *, #battleHUD #hudBottom, #battleHUD #hudBottom * { pointer-events:auto; }
#hudTop { position:absolute; top:0; left:0; right:0; height:64px; display:flex; align-items:center; padding:0 14px; gap:14px; background:linear-gradient(rgba(10,9,8,0.9), transparent); }
#hudTop .hudItem { font-size:12px; color:#c8c0b0; }
#hudTop .hudItem b { color:#e8d8a8; font-size:15px; font-family:'Courier New',monospace; }
#hudCastle { position:absolute; top:8px; left:50%; transform:translateX(-50%); width:360px; text-align:center; }
#hudCastle .castleBarOuter { height:16px; background:#1a1612; border:1px solid #5a5448; position:relative; overflow:hidden; }
#hudCastle .castleBarFill { height:100%; background:linear-gradient(#c05040,#802020); transition:width .2s; }
#hudCastle .castleTxt { font-size:11px; color:#e8d8a8; margin-top:2px; font-family:'Courier New',monospace; }
#hudRight { position:absolute; top:8px; right:14px; text-align:right; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
#hudRight .ctrl { display:flex; gap:6px; }
#hudRight .ctrl .btn { padding:5px 10px; font-size:12px; }
#manaOuter { width:180px; height:12px; background:#1a1612; border:1px solid #4a463f; overflow:hidden; }
#manaFill { height:100%; background:linear-gradient(#4a6acc,#2a3a80); transition:width .1s; }
#hudBottom { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px 10px; background:rgba(10,9,8,0.8); border:1px solid #3a352e; border-radius:6px; }
.hudSlot { width:44px; height:44px; border:1px solid #5a5448; background:#1e1c18; position:relative; display:flex; align-items:center; justify-content:center; font-size:18px; border-radius:4px; }
.hudSlot .cdOverlay { position:absolute; inset:0; background:rgba(0,0,0,0.6); pointer-events:none; }

/* 카드 선택 */
#cardModal { position:absolute; inset:0; background:rgba(0,0,0,0.88); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:60; }
#cardModal.open { display:flex; }
#cardModal h3 { color:#e8d8a8; font-weight:normal; letter-spacing:2px; margin-bottom:4px; font-size:18px; }
#cardModal .cardSub { color:#8a7f6a; font-size:12px; margin-bottom:20px; }
#cardRow { display:flex; gap:18px; }
.card { width:180px; height:260px; background:linear-gradient(160deg,#2a2620,#141210); border:2px solid #5a5448; cursor:pointer; display:flex; flex-direction:column; align-items:center; padding:12px; transition:all .15s; position:relative; }
.card:hover { transform:translateY(-6px); border-color:#d0b070; box-shadow:0 8px 24px rgba(208,176,112,0.3); }
.card .cardArt { font-size:44px; margin:14px 0; }
.card .cardCat { font-size:10px; color:#8a7f6a; letter-spacing:1px; text-transform:uppercase; }
.card .cardName { font-size:15px; color:#e8d8a8; text-align:center; margin:6px 0; }
.card .cardDesc { font-size:11px; color:#b8ae9a; text-align:center; line-height:1.4; flex:1; overflow:hidden; }
.card .cardRarity { font-size:10px; margin-top:6px; padding:2px 8px; border-radius:2px; }
/* 등급별 테두리/장식 */
.rarity-common { border-color:#6a6358; }
.rarity-uncommon { border-color:#7a8a5a; }
.rarity-rare { border-color:#5a7aaa; }
.rarity-epic { border-color:#9a6aba; }
.rarity-legendary { border-color:#d0a040; box-shadow:0 0 16px rgba(208,160,64,0.4); }
.rarity-common .cardRarity { background:#3a352e; color:#a89a80; }
.rarity-uncommon .cardRarity { background:#3a4a2a; color:#a8c080; }
.rarity-rare .cardRarity { background:#2a3a5a; color:#80a8d0; }
.rarity-epic .cardRarity { background:#3a2a4a; color:#c090e0; }
.rarity-legendary .cardRarity { background:#4a3a1a; color:#e8c060; }

/* 결과 화면 */
#resultModal { position:absolute; inset:0; background:rgba(0,0,0,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:70; }
#resultModal.open { display:flex; }
#resultModal h1 { font-size:44px; font-weight:normal; letter-spacing:6px; margin-bottom:6px; }
#resultModal.win h1 { color:#e8d8a8; text-shadow:0 0 20px rgba(208,176,112,0.5); }
#resultModal.lose h1 { color:#c05040; text-shadow:0 0 20px rgba(192,80,64,0.5); }
#resultModal .resSub { color:#8a7f6a; margin-bottom:24px; letter-spacing:2px; }
#resultStats { display:flex; gap:30px; margin-bottom:28px; flex-wrap:wrap; justify-content:center; }
#resultStats .rs { text-align:center; }
#resultStats .rs .lbl { font-size:11px; color:#8a7f6a; letter-spacing:1px; }
#resultStats .rs .val { font-size:24px; color:#e8d8a8; font-family:'Courier New',monospace; margin-top:4px; }

/* 일일 보상 */
#dailyBody { padding:24px; }
#dailyGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:20px; }
.dailyCell { background:rgba(30,28,24,0.9); border:1px solid #4a463f; padding:14px 8px; text-align:center; }
.dailyCell.today { border-color:#d0b070; box-shadow:0 0 12px rgba(208,176,112,0.3); }
.dailyCell.claimed { opacity:.5; }
.dailyCell .dDay { font-size:11px; color:#8a7f6a; }
.dailyCell .dCoin { font-size:18px; color:#e8d8a8; margin-top:6px; font-family:'Courier New',monospace; }
.dailyCell .dState { font-size:10px; color:#8a7f6a; margin-top:6px; }

/* 토스트 */
#toast { position:absolute; top:80px; left:50%; transform:translateX(-50%); background:rgba(20,18,16,0.95); border:1px solid #6a6358; padding:10px 20px; color:#e8d8a8; font-size:13px; z-index:100; opacity:0; transition:opacity .3s; pointer-events:none; }
#toast.show { opacity:1; }

/* 스크롤바 */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:#141210; }
::-webkit-scrollbar-thumb { background:#4a463f; }
::-webkit-scrollbar-thumb:hover { background:#6a6358; }

/* ===== TENEBRAE v1.0.1 visual pass ===== */
html, body { background:#18251b; color:#262922; }

.btn { border-color:#8b9672; background:linear-gradient(#e9e3cc,#c7c5a8); color:#293229; border-radius:7px; font-weight:600; box-shadow:0 2px 3px rgba(0,0,0,.15); }
.btn:hover { background:linear-gradient(#f3efd9,#d9d4b7); border-color:#536c46; }

#battleHUD { color:#f8f3de; }
#hudTop { background:linear-gradient(rgba(35,48,33,.92),rgba(35,48,33,.12)); }

/* ===== v1.0.2 readability, castle formation and touch fixes ===== */
#hudRight, #hudRight *, #hudBottom, #hudBottom *, #hudTop, #hudTop * { pointer-events:auto; }
#hudRight { z-index:35; pointer-events:auto; }
#hudRight .ctrl { position:relative; z-index:36; pointer-events:auto; }
#hudRight .ctrl .btn { position:relative; z-index:37; pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:rgba(220,190,120,.25); }
#battleHUD { pointer-events:none; }
#battleHUD > * { pointer-events:none; }
#battleHUD #hudRight, #battleHUD #hudRight *, #battleHUD #hudBottom, #battleHUD #hudBottom * { pointer-events:auto; }
#hubCastleWrap { width:900px; height:320px; }

#hubFormation .slot:hover { border:0; filter:drop-shadow(0 0 5px rgba(255,238,190,.95)); }

#hubFormation .slot .slotName { position:absolute; bottom:-12px; left:50%; transform:translateX(-50%); font:9px Georgia,serif; color:#fff8dc; text-shadow:0 1px 3px #172016,1px 0 2px #172016; white-space:nowrap; }
.heroCard .hIcon img { width:72px; height:82px; object-fit:contain; display:block; margin:0 auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.55)); }
.heroCard { min-height:126px; }
.heroCard .hIcon { min-height:82px; }
.hudSlot { overflow:hidden; }

/* ---------- 저장 ---------- */
const SAVE_KEY = 'tenebrae_save_v1';
const SAVE_VERSION = 4;

function defaultSave() {
  return {
    saveVersion: SAVE_VERSION,
    coins: 5000,
    stage: 1,
    maxStage: 1,
    castle: { level: 1, maxHP: 15000 },
    heroes: {}, // id -> {owned, level, promo}
    formation: [], // array of hero ids, length = slots
    dailyReward: { lastClaimDate: '', nextIndex: 0 },
  };
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') throw new Error('invalid save');
    const oldVersion = Number(s.saveVersion || 1);
    const d = defaultSave();
    const merged = Object.assign(d, s, {
      castle: Object.assign(d.castle, s.castle || {}),
      dailyReward: Object.assign(d.dailyReward, s.dailyReward || {}),
      heroes: Object.assign({}, s.heroes || {}),
      formation: Array.isArray(s.formation) ? s.formation.slice() : [],
    });
    // v1 fresh accounts commonly started with 2,000 coins. Top up once without erasing progress.
    if (oldVersion < 2 && Number(merged.stage || 1) === 1 &&
        Object.values(merged.heroes).filter(h => h && h.owned).length === 0 &&
        Number(merged.coins || 0) < 5000) merged.coins = 5000;
    merged.saveVersion = SAVE_VERSION;
    return merged;
  } catch(e) {
    console.warn('Save load failed, using new game', e);
    return defaultSave();
  }
}

function writeSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(G.save));
  } catch(e) {
    console.error('Save write failed', e);
  }
}

function heroSave(id) {
  if (!G.save.heroes[id]) G.save.heroes[id] = {owned:false, level:1, promo:0};
  return G.save.heroes[id];
}

function castleData() { return CASTLE_LEVELS[G.save.castle.level-1]; }
function castleSlots() { return Math.min(6, castleData().slots); }
function castleMaxHP() { return castleData().maxHP; }

function drawHubCastle(){
  const cvs=$('#hubCastleCanvas'); const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,900,320);
  // 배경 안개
  const grd=ctx.createRadialGradient(450,260,20,450,260,400);
  grd.addColorStop(0,'rgba(60,55,45,0.5)'); grd.addColorStop(1,'rgba(20,18,15,0)');
  ctx.fillStyle=grd; ctx.fillRect(0,0,900,320);
  // 성
  const cx=450, baseY=270;
  const lv=G.save.castle.level;
  const scaleW = 1 + (lv-1)*0.08;
  drawCastleShape(ctx, cx, baseY, scaleW, lv, 1.0);
}

function drawCastleShape(ctx, cx, baseY, scaleW, lv, dmg){
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(scaleW,1);
  // 성 본체
  ctx.fillStyle='#2a2620';
  ctx.strokeStyle='#5a5448'; ctx.lineWidth=2;
  // 중앙 탑
  ctx.beginPath();
  ctx.moveTo(-60,0); ctx.lineTo(-60,-140); ctx.lineTo(-70,-140); ctx.lineTo(-50,-160);
  ctx.lineTo(-30,-140); ctx.lineTo(-20,-140); ctx.lineTo(0,-200); ctx.lineTo(20,-140);
  ctx.lineTo(30,-140); ctx.lineTo(50,-160); ctx.lineTo(70,-140); ctx.lineTo(60,-140);
  ctx.lineTo(60,0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 좌우 탑
  ctx.fillRect(-140,-110,50,110); ctx.strokeRect(-140,-110,50,110);
  ctx.fillRect(90,-110,50,110); ctx.strokeRect(90,-110,50,110);
  // 성문
  ctx.fillStyle='#1a1612';
  ctx.beginPath();
  ctx.moveTo(-28,0); ctx.lineTo(-28,-45); ctx.arc(0,-45,28,Math.PI,0,true); ctx.lineTo(28,0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 창문들
  ctx.fillStyle='#e8c060';
  for(let i=0;i<3;i++){
    ctx.fillRect(-10+ (i-1)*0, -150+i*20, 4, 8);
  }
  ctx.fillRect(-130,-90,4,8); ctx.fillRect(-115,-90,4,8);
  ctx.fillRect(105,-90,4,8); ctx.fillRect(120,-90,4,8);
  // 피해 균열 (dmg < 1일 때)
  if(dmg<0.66){
    ctx.strokeStyle='#0a0808'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-40,-100); ctx.lineTo(-30,-80); ctx.lineTo(-45,-60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40,-120); ctx.lineTo(30,-90); ctx.lineTo(50,-70); ctx.stroke();
  }
  if(dmg<0.33){
    ctx.beginPath(); ctx.moveTo(10,-160); ctx.lineTo(20,-130); ctx.lineTo(5,-100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20,-30); ctx.lineTo(-5,-10); ctx.lineTo(-25,5); ctx.stroke();
  }
  ctx.restore();
}

function heroBaseDmg(level){ return 28*(1+0.025*(level-1)); }
function heroLevelCost(level){ return Math.ceil(9*Math.pow(1.08, level-1)); }

function renderHeroDetail(id){
  const h=HEROES.find(x=>x.id===id);
  const hs=heroSave(id);
  const dmg=heroBaseDmg(hs.level)*(Math.pow(1.05, hs.promo));
  const fmt=n=>Math.round(n*10)/10;

  let html=`<div class="ddTitle">${h.icon} ${h.name} <span style="font-size:12px;color:#8a7f6a;">[${ELEMENTS[h.el]}]</span></div>`;
  html+=`<div class="ddRow">
    <span>레벨 <b>${hs.level}</b></span>
    <span>승급 <b>${hs.promo}</b>/4</span>
    <span>평타 피해 <b>${fmt(dmg)}</b></span>
    <span>공격 간격 <b>1.8s</b></span>
  </div>`;
  html+=`<div class="ddSkill">🎯 <b>${h.skill}</b> — ${h.desc}<br>마나 소모 ${h.mana} · 쿨다운 ${h.cd}초</div>`;

  html+=`<div class="ddActions">`;
  if(!hs.owned){
    const canBuy=G.save.coins>=h.price;
    html+=`<button class="btn primary" data-act="buy" ${canBuy?'':'disabled'}>영입 🪙${h.price}</button>`;
  } else {
    // 레벨업
    if(hs.level<50){
      const c=heroLevelCost(hs.level);
      html+=`<button class="btn" data-act="lvlup" ${G.save.coins>=c?'':'disabled'}>레벨업 🪙${c}</button>`;
    } else {
      html+=`<button class="btn" disabled>최대 레벨</button>`;
    }
    // 승급
    const promoReqs=[0,10,20,30,40];
    const promoCosts=[0,250,450,810,1458];
    if(hs.promo<4){
      const req=promoReqs[hs.promo+1];
      const cost=promoCosts[hs.promo+1];
      const can=hs.level>=req && G.save.coins>=cost;
      html+=`<button class="btn" data-act="promo" ${can?'':'disabled'}>승급 ${hs.promo+1}단계 🪙${cost} (Lv${req})</button>`;
    } else {
      html+=`<button class="btn" disabled>승급 완료</button>`;
    }
    // 편성
    const inForm=G.save.formation.includes(id);
    if(inForm){
      html+=`<button class="btn" data-act="remove">편성 해제</button>`;
    } else {
      const hasEmpty=G.save.formation.filter(x=>x).length<castleSlots();
      html+=`<button class="btn" data-act="deploy" ${hasEmpty?'':'disabled'}>${hasEmpty?'편성 배치':'슬롯 가득참'}</button>`;
    }
  }
  html+=`</div>`;
  $('#heroDetail').innerHTML=html;

  // 이벤트
  $$('#heroDetail button[data-act]').forEach(btn=>{
    btn.onclick=()=>{
      const act=btn.dataset.act;
      if(act==='buy'){ doBuyHero(h); }
      else if(act==='lvlup'){ doLevelUp(h); }
      else if(act==='promo'){ doPromo(h); }
      else if(act==='deploy'){ doDeploy(h); }
      else if(act==='remove'){ doRemove(h); }
    };
  });
}

function doBuyHero(h){
  const hs=heroSave(h.id);
  if(hs.owned) return;
  if(G.save.coins<h.price){ toast('코인 부족'); return; }
  G.save.coins-=h.price;
  hs.owned=true; hs.level=1; hs.promo=0;
  writeSave(); renderHeroList(); renderHeroDetail(h.id); renderHub();
  toast(`${h.name} 영입 완료`);
}
function doLevelUp(h){
  const hs=heroSave(h.id);
  if(!hs.owned||hs.level>=50) return;
  const c=heroLevelCost(hs.level);
  if(G.save.coins<c){ toast('코인 부족'); return; }
  G.save.coins-=c; hs.level++;
  writeSave(); renderHeroList(); renderHeroDetail(h.id); renderHub();
}
function doPromo(h){
  const hs=heroSave(h.id);
  if(hs.promo>=4) return;
  const reqs=[0,10,20,30,40], costs=[0,250,450,810,1458];
  const req=reqs[hs.promo+1], cost=costs[hs.promo+1];
  if(hs.level<req){ toast('레벨 부족'); return; }
  if(G.save.coins<cost){ toast('코인 부족'); return; }
  G.save.coins-=cost; hs.promo++;
  writeSave(); renderHeroList(); renderHeroDetail(h.id); renderHub();
  toast(`승급 ${hs.promo}단계 달성`);
}
function doDeploy(h){
  if(G.save.formation.includes(h.id)) return;
  const slots=castleSlots();
  // ensure formation array length
  while(G.save.formation.length<slots) G.save.formation.push(null);
  const idx=G.save.formation.findIndex(x=>!x);
  if(idx===-1){ toast('빈 슬롯 없음'); return; }
  G.save.formation[idx]=h.id;
  writeSave(); renderHeroList(); renderHeroDetail(h.id); renderHub();
}
function doRemove(h){
  const idx=G.save.formation.indexOf(h.id);
  if(idx>=0){ G.save.formation[idx]=null; }
  writeSave(); renderHeroList(); renderHeroDetail(h.id); renderHub();
}

   일일 보상
   ========================================================= */
const DAILY_REWARDS=[200,250,300,400,500,600,800];
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
}
function openDaily(){
  const grid=$('#dailyGrid'); grid.innerHTML='';
  const today=todayStr();
  const dr=G.save.dailyReward;
  const canClaim = dr.lastClaimDate !== today;
  for(let i=0;i<7;i++){
    const cell=document.createElement('div');
    cell.className='dailyCell';
    const isToday = (i===dr.nextIndex && canClaim);
    if(isToday) cell.classList.add('today');
    if(i<dr.nextIndex || (i===dr.nextIndex && !canClaim && dr.lastClaimDate===today)) {
      // 이미 받은 날짜들 표시 (nextIndex 이전)
      if(i<dr.nextIndex) cell.classList.add('claimed');
    }
    cell.innerHTML=`
      <div class="dDay">${i+1}일차</div>
      <div class="dCoin">🪙${DAILY_REWARDS[i]}</div>
      <div class="dState">${i<dr.nextIndex?'수령 완료':(isToday?'오늘!':'대기')}</div>
    `;
    grid.appendChild(cell);
  }
  const btn=$('#btnClaimDaily');
  btn.disabled=!canClaim;
  btn.textContent=canClaim?'오늘 보상 받기':'오늘 수령 완료';
  btn.onclick=()=>{
    if(!canClaim) return;
    const amt=DAILY_REWARDS[G.save.dailyReward.nextIndex];
    G.save.coins+=amt;
    G.save.dailyReward.lastClaimDate=today;
    G.save.dailyReward.nextIndex=(G.save.dailyReward.nextIndex+1)%7;
    writeSave(); openDaily(); renderHub();
    toast(`일일 보상 🪙${amt} 획득`);
  };
  $('#modalDaily').classList.add('open');
}

/* =========================================================
   전투 시스템

let battleRAF=null;
let battleLastTs=0;
let battleAccum=0;

function startBattle(){

  while(G.save.formation.length<slots) G.save.formation.push(null);

  if(formation.some(x=>!x)){ toast('모든 슬롯을 채워주세요'); return; }

  // 전투 상태 초기화
  G.battle={
    time:0,
    stage:G.save.stage,
    stageMul:{
      hp:Math.pow(1.10,G.save.stage-1),
      atk:Math.pow(1.08,G.save.stage-1),
      spd:Math.min(Math.pow(1.01,G.save.stage-1),1.15),
      countMul:Math.pow(1.05,G.save.stage-1),
      reward:Math.pow(1.10,G.save.stage-1),
      bossHp:Math.pow(1.155,G.save.stage-1),
      bossAtk:Math.pow(1.10,G.save.stage-1),
    },
    castleHP:G.save.castle.maxHP,
    castleMax:G.save.castle.maxHP,
    mana:1200, manaMax:1200, manaRegen:30,
    xp:0, level:1, levelXpNext:70+18*0,
    tempCoins:0,
    heroes:[], // {hero, slotX, cdRemain, ...}
    enemies:[], // {type, x, hp, maxHp, ...}
    projectiles:[],
    effects:[],
    summons:[],
    nextSummonGroupId:1,
    bossSpawned:{},
    spawnQueue:[], // 대기열
    aliveCount:0,
    totalKills:0, bossKills:0,
    cardQueue:[], // 대기 카드 선택
    waveCleared:false,
    gameOver:false,
    timeRewards:{300:false,600:false,900:false,1200:false,1500:false,1800:false,2100:false},
    artifacts:{}, // id -> true
    traits:{}, // id -> stacks
    heroBuffs:{}, // heroId -> {dmgMul, skillMul, cdMul, manaMul, ...}
    slotOrder:[],
    elapsedReal:0,
    paused:false,
    speed:1,
    autoSkills:true,

  };

  // 영웅 초기화
  formation.forEach((hid,i)=>{
    const hero=HEROES.find(h=>h.id===hid);

    const levelDmg=heroBaseDmg(hs.level)*(Math.pow(1.05,hs.promo));
    // 슬롯 위치: 성 앞, 6~12개
    const total=slots;
    const col=i%3, row=Math.floor(i/3);
    const slotX=[98,188,278][col];
    const slotY=395 + row*60 + col*2;
    G.battle.heroes.push({
      hero, id:hid, level:hs.level, promo:hs.promo,
      baseDmg:levelDmg,
      x:slotX, y:slotY,
      atkCd:0, skillCd:hero.cd, skillReady:true,
      manaCost:hero.mana,
      activeSummonGroupId:null, animTime:0, attackAnim:0, skillAnim:0,
      attackRange:520,
      skillRange:680,
      buffs:{dmg:1,skill:1,cd:1,mana:1,range:1,explode:1,projSpd:1},
    });
    G.battle.log.heroDmg[hid]=0;
  });

  // 적 스폰 큐 구축
  buildSpawnQueue();

  // UI 초기화
  $('#bStage').textContent=G.save.stage;
  $('#bLevel').textContent=1;
  $('#bCoins').textContent=0;
  $('#bTime').textContent='0:00';
  $('#castleMax').textContent=castleMaxHP();
  $('#castleHP').textContent=G.save.castle.maxHP;
  $('#castleFill').style.width='100%';
  $('#btnSpeed').textContent='1×';
  $('#btnPause').textContent='⏸';
  renderHudSlots();

  // 화면 전환
  $('#screen-hub').classList.remove('active');
  $('#screen-battle').classList.add('active');
  G.screen='battle';

  battleLastTs=performance.now();
  battleAccum=0;
  if(battleRAF) cancelAnimationFrame(battleRAF);
  battleRAF=requestAnimationFrame(battleLoop);
}

function buildSpawnQueue(){
  const b=G.battle;
  b.spawnQueue=[];
  const mul=b.stageMul.countMul;
  for(const seg of SPAWN_TABLE){
    const segStart=seg.t;
    const segEnd=segStart+300;
    // 각 종류별 개수 계산
    const entries=[];
    let total=0;
    for(const [key,cnt] of Object.entries(seg)){
      if(key==='t') continue;
      const n=Math.ceil(cnt*mul);
      entries.push({key,n});
      total+=n;
    }
    if(total===0) continue;
    // 300초 동안 균등 배분 + ±20% 편차
    const interval=300/total;
    let t=segStart;
    for(const e of entries){
      for(let i=0;i<e.n;i++){
        const jitter=(Math.random()*0.4-0.2)*interval;
        b.spawnQueue.push({t:clamp(t+jitter,segStart,segEnd), key:e.key});
        t+=interval;
      }
    }
  }
  // 보스 추가
  for(const boss of BOSSES){
    b.spawnQueue.push({t:boss.t, key:'BOSS:'+boss.name, boss});
  }
  b.spawnQueue.sort((a,b)=>a.t-b.t);
}

function spawnEnemy(key){
  const b=G.battle;
  if(key.startsWith('BOSS:')){
    const boss=BOSSES.find(x=>x.name===key.slice(5));
    const hp=boss.hp*b.stageMul.bossHp;
    b.enemies.push({
      isBoss:true, name:boss.name,
      x:1050, y:480, hp, maxHp:hp,
      spd:boss.spd*b.stageMul.spd,
      atk:boss.atk*b.stageMul.bossAtk,
      atkInt:boss.atkInt, atkCd:boss.atkInt,
      coin:Math.round(boss.coin*b.stageMul.reward),
      xp:Math.round(boss.xp*b.stageMul.reward),
      size:boss.size, color:boss.color,
      slow:0, stun:0, dot:[], age:0,
      specCd:8, // 특수공격
      phase2:false,
    });
    toast(`⚠ ${boss.name} 등장!`);
  } else {
    const m=MONSTERS[key];
    const hp=Math.round(m.hp*b.stageMul.hp);
    b.enemies.push({
      isBoss:false, type:key, name:m.name,
      x:1010, y:500, hp, maxHp:hp,
      spd:m.spd*b.stageMul.spd,
      atk:Math.round(m.atk*b.stageMul.atk),
      atkInt:m.atkInt, atkCd:m.atkInt,
      coin:Math.round(m.coin*b.stageMul.reward),
      xp:Math.round(m.xp*b.stageMul.reward),
      size:m.size, color:m.color, shape:m.shape,
      ranged:!!m.ranged, stopX:m.stopX||0,
      slow:0, stun:0, dot:[], age:0, moving:true,
    });
  }
}

function battleLoop(ts){
  if(G.screen!=='battle') return;
  const rawDt=Math.min(0.1,(ts-battleLastTs)/1000);
  battleLastTs=ts;
  const b=G.battle;
  if(!b){ battleRAF=requestAnimationFrame(battleLoop); return; }

  if(!b.paused && !b.gameOver && !G.paused && !document.querySelector('#cardModal.open')){
    battleAccum+=rawDt*b.speed;
    // 고정 스텝
    let steps=0;
    while(battleAccum>=FIXED_DT && steps<60){
      simulate(FIXED_DT);
      battleAccum-=FIXED_DT;
      steps++;
      if(b.gameOver || b.paused) break;
    }
  }
  renderBattle();
  updateBattleHUD();
  battleRAF=requestAnimationFrame(battleLoop);
}

/* ---------- 시뮬레이션 ---------- */
function simulate(dt){
  const b=G.battle;
  if(b.gameOver) return;
  b.time+=dt;
  if(b.time>WAVE_DURATION && !b.waveCleared) {
    // 35분 후 최종보스 처치까지 대기 (최종보스가 이미 처치됐으면 클리어)
    if(b.bossSpawned['쌍월룡'] && b.bossKills>=4) { winBattle(); return; }
  }

  // 마나 회복
  b.mana=Math.min(b.manaMax, b.mana+b.manaRegen*dt);

  // 스폰 처리
  while(b.spawnQueue.length>0 && b.spawnQueue[0].t<=b.time){
    const s=b.spawnQueue.shift();
    if(b.enemies.length<MAX_ACTIVE_ENEMIES){ spawnEnemy(s.key, s); if(s.boss) b.bossSpawned[s.boss.name]=true; }
    else { b.spawnQueue.unshift(s); break; } // 동시 개체 상한에 도달하면 다음 프레임으로 이월
    if(b.enemies.length>=MAX_ACTIVE_ENEMIES) break;
  }

  // 시간 보상 체크
  for(const t of [300,600,900,1200,1500,1800,2100]){
    if(b.time>=t && !b.timeRewards[t]){
      b.timeRewards[t]=true;
      if(t===2100){
        // 35분: 전설 보장
        b.cardQueue.push({time:true, minute:35, legendary:true});
      } else {
        b.cardQueue.push({time:true, minute:t/60});
      }
    }
  }

  // 카드 큐 처리
  if(b.cardQueue.length>0 && !document.querySelector('#cardModal.open')){
    const cq=b.cardQueue.shift();
    showCardSelection(cq);
    b.paused=true;
    return;
  }

  // 영웅 업데이트
  for(const h of b.heroes){
    updateHero(h, dt);
  }

  // 적 업데이트
  updateEnemies(dt);

  // 투사체
  updateProjectiles(dt);

  // 소환수
  updateSummons(dt);

  // 이펙트 수명
  b.effects=b.effects.filter(e=>{e.life-=dt; return e.life>0;});

  // 성 피해 체크
  if(b.castleHP<=0 && !b.gameOver){
    loseBattle();
  }
}

function heroStatMul(h, key){
  // 카드 버프 + 아티팩트 + 특성
  let m=h.buffs[key]||1;
  const b=G.battle;
  // 아티팩트
  if(b.artifacts['black_wax'] && key==='skill') m*=1.08;
  if(b.artifacts['dead_star'] && key==='skill') m*=1.18;
  if(b.artifacts['nameless_crown']) m*=1.25;
  // 특성
  if(b.traits['condensed_mana'] && key==='skill') m*=Math.pow(1.07,b.traits['condensed_mana']);
  if(b.traits['strong_bullet'] && key==='dmg') m*=Math.pow(1.07,b.traits['strong_bullet']);
  if(b.traits['overwhelm']) m*=Math.pow(1.12,b.traits['overwhelm']);
  return m;
}

function applyHeroDamage(h, enemy, amount, isSkill){
  let mul=heroStatMul(h, isSkill?'skill':'dmg');
  let dmg=amount*mul;
  // 보스 피해 증가 아티팩트/특성
  if(enemy.isBoss){
    if(G.battle.artifacts['hunter_lens']) dmg*=1.15;
    if(G.battle.traits['boss_hunt']) dmg*=Math.pow(1.10,G.battle.traits['boss_hunt']);
  }
  dealDamageToEnemy(enemy, dmg, h.id);
  return dmg;
}

function dealDamageToEnemy(enemy, dmg, heroId){
  const b=G.battle;
  if(enemy.hp<=0) return;
  // 낙인 피해 증폭
  if(enemy.marked) dmg*=1.15;
  if(enemy.slowDebuff && G.battle.artifacts['seal_key']) dmg*=1.0; // placeholder
  enemy.hp-=dmg;
  if(heroId && b.log.heroDmg[heroId]!==undefined) b.log.heroDmg[heroId]+=dmg;
  // 피격 이펙트
  b.effects.push({type:'hit', x:enemy.x, y:enemy.y, life:0.15, maxLife:0.15});
  if(enemy.hp<=0){
    killEnemy(enemy);
  }
}

function killEnemy(enemy){
  const b=G.battle;
  if(enemy.dead) return;
  enemy.dead=true;
  b.totalKills++;
  if(enemy.isBoss) b.bossKills++;
  b.tempCoins+=enemy.coin;
  const xpMul = b.artifacts['bone_dice']?1.08:1;
  const traitXp = b.traits['rich_exp']?Math.pow(1.08,b.traits['rich_exp']):1;
  const gainXp = enemy.xp*xpMul*traitXp;
  b.xp+=gainXp;
  // 성 회복 아티팩트
  if(b.artifacts['empty_grail'] && !enemy.isBoss) b.castleHP=Math.min(b.castleMax, b.castleHP+b.castleMax*0.0003*(b.traits.fast_recovery?1.15:1));
  if(b.artifacts['empty_grail'] && enemy.isBoss) b.castleHP=Math.min(b.castleMax, b.castleHP+b.castleMax*0.002*(b.traits.fast_recovery?1.15:1));
  if(b.artifacts['black_grail'] && !enemy.isBoss) b.castleHP=Math.min(b.castleMax, b.castleHP+b.castleMax*0.0008*(b.traits.fast_recovery?1.15:1));
  if(b.artifacts['black_grail'] && enemy.isBoss) b.castleHP=Math.min(b.castleMax, b.castleHP+b.castleMax*0.02*(b.traits.fast_recovery?1.15:1));
  // 레벨업 체크
  while(b.xp>=b.levelXpNext && b.level<30){
    b.xp-=b.levelXpNext;
    b.level++;
    b.levelXpNext=70+18*(b.level-1);
    b.cardQueue.push({levelup:true});
  }
  if(b.level>=30) b.xp=Math.min(b.xp,b.levelXpNext);
  // 사망 이펙트
  b.effects.push({type:'death', x:enemy.x, y:enemy.y, life:0.4, maxLife:0.4, isBoss:enemy.isBoss});
  // 최종보스 처치 확인
  if(enemy.isBoss && enemy.name==='쌍월룡') {
    setTimeout(()=>{},0);
    winBattle();
  }
}

function updateEnemies(dt){
  const b=G.battle;
  if(b.artifacts.last_candle&&!b.lastCandleUsed&&b.castleHP>0&&b.castleHP/b.castleMax<=.15){b.lastCandleUsed=true;b.castleHP=Math.min(b.castleMax,b.castleHP+b.castleMax*.32);b.effects.push({type:'shield',x:245,y:515,life:1,maxLife:1});toast('마지막 촛불이 성을 되살렸습니다.');}
  if(b.artifacts.rift_heart){b.riftHeartTimer=(b.riftHeartTimer||0)+dt;if(b.riftHeartTimer>=10){b.riftHeartTimer-=10;const owner=b.heroes[0];if(owner){const pulse=heroBaseDmg(owner.level)*5;for(const e of b.enemies){if(!e.dead)applyHeroDamage(owner,e,pulse,true);}}}}
  b.enemies=b.enemies.filter(e=>!e.dead);
  for(const e of b.enemies){
    e.age+=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    // DoT
    if(e.dot.length){
      for(const d of e.dot){
        e.hp-=d.dps*dt;
        d.dur-=dt;
      }
      e.dot=e.dot.filter(d=>d.dur>0);
      if(e.hp<=0){ killEnemy(e); continue; }
    }
    // 감속
    let slowMul=1;
    if(e.slow>0){ e.slow-=dt; slowMul=0.7; if(e.slowDebuff40) slowMul=0.6; }
    if(e.freezeSlow) slowMul=Math.min(slowMul,0.6);
    // 이동
    const targetX = e.ranged? e.stopX : 250;
    if(e.x>targetX){
      e.x-=e.spd*slowMul*dt;
    } else {
      // 성 공격
      e.atkCd-=dt;
      if(e.atkCd<=0){
        e.atkCd=e.atkInt;
        b.castleHP-=e.atk;
        b.log.castleDamage+=e.atk;
        b.effects.push({type:'castleHit', x:250, y:500, life:0.3, maxLife:0.3});
      }
    }
    // 보스 특수공격
    if(e.isBoss){
      e.specCd-=dt;
      if(e.specCd<=0){
        e.specCd=8;
        if(e.name==='흑설탕 거석'){
          b.castleHP-=250;
          b.effects.push({type:'bossSpecial', x:250, y:500, life:0.5, maxLife:0.5});
        } else if(e.name==='심해 기계수'){
          b.castleHP-=300;
          b.effects.push({type:'bossSpecial', x:250, y:500, life:0.5, maxLife:0.5});
        } else if(e.name==='쌍월룡'){
          b.castleHP-=400;
          // 영웅 공속 감소
          for(const h of b.heroes) h.atkCd=Math.min(h.atkCd+1, 3);
          b.effects.push({type:'bossSpecial', x:250, y:500, life:0.6, maxLife:0.6});
        }
      }
      // 50% 페이즈 (층을 삼킨 망령)
      if(e.name==='층을 삼킨 망령' && !e.phase2 && e.hp<e.maxHp*0.5){
        e.phase2=true;
        e.slow=5; // 이동 정지
      }
      if(e.name==='쌍월룡' && !e.phase2 && e.hp<e.maxHp*0.5){
        e.phase2=true;
        e.spd*=1.2;
      }
    }
  }
}

function findTargetForHero(){
  const b=G.battle;
  if(b.enemies.length===0) return null;
  const live=b.enemies.filter(e=>!e.dead && e.hp>0);
  if(!live.length) return null;
  // 가장 성에 가까운 (x작은) 적
  live.sort((a,b)=>(a.x-b.x) || (a.hp-b.hp));
  return live[0];
}

function findBossOrHighHp(){
  const b=G.battle;
  const live=b.enemies.filter(e=>!e.dead && e.hp>0);
  if(!live.length) return null;
  const boss=live.find(e=>e.isBoss);
  if(boss) return boss;
  live.sort((a,b)=>b.hp-a.hp);
  return live[0];
}

function updateHero(h, dt){
  const b=G.battle;
  if(!h) return;
  // 평타
  h.atkCd-=dt;
  if(h.atkCd<=0){
    const spdMul=b.artifacts['quick_cast']?1.05:1;
    const traitSpd=b.traits['fast_cast']?Math.pow(1.05,b.traits['fast_cast']):1;
    h.atkCd=1.8/(spdMul*traitSpd);
    const target=findTargetForHero(h);
    if(target){
      const baseDmg=heroBaseDmg(h.level)*(Math.pow(1.05,h.promo));
      const dmg=applyHeroDamage(h, target, baseDmg, false);
      // 폭발 범위
      let explodeR=44*(b.artifacts['broken_bell']?1.12:1)*(b.traits['wide_blast']?Math.pow(1.08,b.traits['wide_blast']):1);
      if(h.buffs.range) explodeR*=h.buffs.range;
      // 주변 적 50% 피해
      for(const e of b.enemies){
        if(e===target||e.dead) continue;
        const d=Math.hypot(e.x-target.x, e.y-target.y);
        if(d<explodeR){
          applyHeroDamage(h, e, baseDmg*0.5, false);
        }
      }
      // 투사체 이펙트
      b.projectiles.push({
        type:'heroBolt', x:h.x, y:h.y, tx:target.x, ty:target.y,
        speed:800*(b.artifacts['ash_compass']?1.12:1), life:1, color:'#d8c090'
      });
    }
  }
  // 스킬
  const cdMul=(b.artifacts['old_hourglass']?0.92:1)*
              (b.traits['focus']?Math.pow(0.94,b.traits['focus']):1)*
              h.buffs.cd;
  h.skillCd-=dt/cdMul;
  if(h.skillCd<=0){
    const manaCost=h.manaCost*(b.traits['mana_eff']?Math.pow(0.92,b.traits['mana_eff']):1)*h.buffs.mana;
    if(b.mana>=manaCost){
      b.mana-=manaCost;
      b.log.manaUsed+=manaCost;
      b.log.skillUses++;
      h.skillCd=h.hero.cd;
      useSkill(h);
    }
  }
}

function useSkillLegacy(h){
  const b=G.battle;
  const skillRange=h.skillRange||680;
  const targets=b.enemies.filter(e=>!e.dead && e.hp>0 && Math.hypot(e.x-h.x,e.y-h.y)<=skillRange);
  if(!targets.length) return;
  const baseDmg=heroBaseDmg(h.level)*(Math.pow(1.05,h.promo));

  // 스킬별 처리
  const id=h.hero.id;
  const badd = (enemy, dmg)=>{
    applyHeroDamage(h, enemy, dmg, true);
  };
  const findDense=(count)=>{
    // 적이 가장 많은 위치
    if(!targets.length) return null;
    const t=targets[Math.floor(Math.random()*targets.length)];
    return t;
  };

  switch(id){
    case 1: { // 잿불 폭발
      const t=findDense();
      const cx=t.x, cy=t.y;
      b.effects.push({type:'burst', x:cx, y:cy, r:90, life:0.4, maxLife:0.4});
      for(const e of targets){
        if(Math.hypot(e.x-cx,e.y-cy)<90){
          badd(e, baseDmg*8);
          e.dot.push({dps:baseDmg*0.5, dur:4, heroId:h.id});
        }
      }
      break;
    }
    case 2: { // 용융 웅덩이
      for(let i=0;i<3;i++){
        const px=380+i*120;
        b.effects.push({type:'pool', x:px, y:520, r:50, life:4, maxLife:4, dps:baseDmg*0.5, hero:h});
      }
      break;
    }
    case 3: { // 적월 낙하
      const t=findDense();
      b.effects.push({type:'meteor', x:t.x, y:t.y, r:110, life:0.5, maxLife:0.5});
      for(const e of targets){
        if(Math.hypot(e.x-t.x,e.y-t.y)<110) badd(e, baseDmg*14);
      }
      break;
    }
    case 4: { // 사냥 불꽃
      for(let i=0;i<5;i++){
        const t=targets[Math.floor(Math.random()*targets.length)];
        b.projectiles.push({type:'homing', x:h.x, y:h.y, target:t, speed:400, life:2, dmg:baseDmg*2, hero:h});
      }
      break;
    }
    case 5: { // 유리 절단
      const sorted=targets.slice().sort((a,b)=>a.x-b.x).slice(0,4);
      for(const e of sorted) badd(e, baseDmg*8);
      b.effects.push({type:'laser', x1:h.x, y1:h.y, x2:1000, y2:h.y, life:0.3, maxLife:0.3});
      break;
    }
    case 6: { // 지맥 분화
      for(let i=0;i<3;i++){
        const px=400+i*180;
        b.effects.push({type:'eruption', x:px, y:520, r:60, life:0.5, maxLife:0.5});
        for(const e of targets){
          if(Math.abs(e.x-px)<60){ badd(e, baseDmg*3); e.x+=20; }
        }
      }
      break;
    }
    case 7: { // 연쇄 낙뢰
      const sorted=targets.slice().sort((a,b)=>a.x-b.x).slice(0,5);
      for(const e of sorted){ badd(e, baseDmg*3.5); b.effects.push({type:'lightning', x:e.x, y:e.y, life:0.3, maxLife:0.3}); }
      break;
    }
    case 8: { // 고압 창
      const t=findTargetForHero();
      badd(t, baseDmg*10);
      const near=targets.filter(e=>e!==t).slice(0,2);
      for(const e of near) badd(e, baseDmg*5);
      b.effects.push({type:'lance', x1:h.x, y1:h.y, x2:t.x, y2:t.y, life:0.3, maxLife:0.3});

    }
    case 9: { // 자기 위성

      break;
    }
    case 10: { // 폭풍 고리
      const t=findDense();
      b.effects.push({type:'storm', x:t.x, y:t.y, r:100, life:6, maxLife:6, dps:baseDmg*0.5, hero:h, pull:true});

    }
    case 11: { // 전하 파동

      b.effects.push({type:'wave', x:400, y:520, r:600, life:0.6, maxLife:0.6});

    case 16: { // 백야 폭설
      const t=findDense();

    case 17: { // 허리케인

    case 20: { // 사건의 지평

    case 23: { // 겹친 균열
      for(let i=0;i<3;i++){

      if(strongest && strongest!==h){
        b.summons.push({type:'clone', x:strongest.x-30, y:strongest.y, life:8, hero:strongest, atkCd:0, dmg:heroBaseDmg(strongest.level)*0.5});
      }
      break;
    }
    case 31: { // 역병 병
      const sorted=targets.slice(0,5);
      for(const e of sorted){
        e.dot.push({dps:baseDmg*0.5, dur:8, plague:true, heroId:h.id});
        b.effects.push({type:'plague', x:e.x, y:e.y, life:0.4, maxLife:0.4});
      }
      break;
    }
    case 32: { // 가시 포박
      const sorted=targets.slice(0,6);
      for(const e of sorted){
        badd(e, baseDmg*3);
        if(!e.isBoss) e.stun=Math.max(e.stun,3*(b.artifacts.silence_mask?1.2:1)*Math.pow(1.15,b.traits.long_curse||0));
        b.effects.push({type:'vines', x:e.x, y:e.y, life:0.5, maxLife:0.5});
      }
      break;
    }
    case 33: { // 붉은 서약
      const t=findBossOrHighHp();
      if(t){ t.marked=true; t.markTimer=Math.max(t.markTimer||0,8); }
      b.effects.push({type:'mark', x:t.x, y:t.y, life:0.5, maxLife:0.5});
      break;
    }
    case 34: { // 수면 장막
      for(const e of targets){
        if(e.isBoss){ e.slow=Math.max(e.slow,2*(b.artifacts.silence_mask?1.2:1)*Math.pow(1.15,b.traits.long_curse||0)); }
        else { e.stun=Math.max(e.stun,4*(b.artifacts.silence_mask?1.2:1)*Math.pow(1.15,b.traits.long_curse||0)); }
        badd(e, baseDmg*2);
      }
      b.effects.push({type:'sleep', x:600, y:520, r:500, life:0.6, maxLife:0.6});
      break;
    }
    case 35: { // 검은 봉문
      const boss=targets.find(e=>e.isBoss);
      if(boss){ boss.stun=Math.max(boss.stun,2*(b.artifacts.silence_mask?1.2:1)*Math.pow(1.15,b.traits.long_curse||0)); badd(boss, baseDmg*5); }
      for(const e of targets){ if(!e.isBoss){ e.stun=Math.max(e.stun,2*(b.artifacts.silence_mask?1.2:1)*Math.pow(1.15,b.traits.long_curse||0)); } }
      b.effects.push({type:'seal', x:600, y:520, r:400, life:0.6, maxLife:0.6});
      break;
    }
    case 36: { // 무너진 성역
      const shield=castleMaxHP()*0.08*(h.buffs.shield||1);
      b.castleHP=Math.min(b.castleMax, b.castleHP+shield);
      b.effects.push({type:'shield', x:250, y:500, life:0.8, maxLife:0.8});
      break;
    }
  }
}

function updateProjectiles(dt){
  const b=G.battle;
  b.projectiles=b.projectiles.filter(p=>{
    if(p.type==='heroBolt' || p.type==='iceLance'){
      // 타겟 방향 이동 (단순)
      p.life-=dt;
      return p.life>0;
    }
    if(p.type==='homing'){
      p.life-=dt;
      if(p.target.dead || !p.target.hp){ p.life=0; return false; }
      const dx=p.target.x-p.x, dy=p.target.y-p.y;
      const d=Math.hypot(dx,dy);
      if(d<20){
        applyHeroDamage(p.hero, p.target, p.dmg, true);
        return false;
      }
      p.x+=dx/d*p.speed*dt;
      p.y+=dy/d*p.speed*dt;
      return p.life>0;
    }
    return false;
  });

  // 이펙트 지속 피해 처리 (pool, storm, blizzard, fog 등)
  for(const fx of b.effects){
    if(fx.life<=0) continue;
    if(fx.type==='pool' && fx.dps){
      for(const e of b.enemies){
        if(e.dead) continue;
        if(Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r){
          applyHeroDamage(fx.hero, e, fx.dps*dt, true);
        }
      }
    }
    if((fx.type==='storm'||fx.type==='blizzard'||fx.type==='moth') && fx.dps){
      for(const e of b.enemies){
        if(e.dead) continue;
        if(Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r){
          applyHeroDamage(fx.hero, e, fx.dps*dt, true);
          if(fx.slow) e.slow=Math.max(e.slow,0.2);
          if(fx.pull){ e.x+=(fx.x-e.x)*0.5*dt; }
        }
      }
    }
    if(fx.type==='orbit' && fx.dps){
      for(const e of b.enemies){
        if(e.dead) continue;
        const d=Math.hypot(e.x-fx.x,e.y-fx.y);
        if(Math.abs(d-fx.r)<25 && !fx.hitSet.has(e)){
          fx.hitSet.add(e);
          setTimeout(()=>fx.hitSet.delete(e),500);
          applyHeroDamage(fx.hero, e, fx.dps, true);
        }
      }
    }
    if(fx.type==='tentacle' && fx.dmg){
      fx.hitTimer=(fx.hitTimer||0)+dt;
      if(fx.hitTimer>0.2 && fx.hits>0){
        fx.hits--;
        fx.hitTimer=0;
        for(const e of b.enemies){
          if(e.dead) continue;
          if(Math.hypot(e.x-fx.x,e.y-fx.y)<70){
            applyHeroDamage(fx.hero, e, fx.dmg, true);
          }
        }
      }
    }
    if(fx.type==='gravity' && fx.dmg){
      for(const e of b.enemies){
        if(e.dead) continue;
        if(Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r){
          e.x+=(fx.x-e.x)*1.5*dt;
        }
      }
      if(fx.life<0.1 && !fx.exploded){
        fx.exploded=true;
        for(const e of b.enemies){
          if(e.dead) continue;
          if(Math.hypot(e.x-fx.x,e.y-fx.y)<fx.r) applyHeroDamage(fx.hero, e, fx.dmg, true);
        }
      }
    }
  }
}

function updateSummons(dt){
  const b=G.battle;
  b.summons=b.summons.filter(s=>{
    s.life-=dt;
    if(s.life<=0) return false;
    if(s.type==='golem'){
      s.atkCd-=dt;
      if(s.atkCd<=0){
        s.atkCd=2;
        for(const e of b.enemies){
          if(e.dead) continue;
          if(Math.abs(e.x-s.x)<120) applyHeroDamage(s.hero, e, s.dmg*(s.hero.buffs.summon||1), true);
        }
      }
    } else if(s.type==='dog' || s.type==='skeleton'){
      s.atkCd-=dt;
      if(s.atkCd<=0){
        s.atkCd=0.5;
        const t=findTargetForHero();
        if(t) applyHeroDamage(s.hero, t, s.dmg, true);
      }
    } else if(s.type==='clone'){
      s.atkCd-=dt;
      if(s.atkCd<=0){
        s.atkCd=1.8;
        const t=findTargetForHero();
        if(t) applyHeroDamage(s.hero, t, s.dmg, false);
      }
    }
    return true;
  });
}

/* =========================================================
   전투 렌더링
   ========================================================= */
function renderBattle(){
  const cvs=$('#battleCanvas'); const ctx=cvs.getContext('2d');
  const b=G.battle;
  if(!b) return;

  // 배경
  ctx.fillStyle='#0e0d0b';
  ctx.fillRect(0,0,1280,720);
  // 원경
  ctx.fillStyle='#1a1815';
  ctx.fillRect(0,200,1280,400);
  // 달
  ctx.fillStyle='#3a3630';
  ctx.beginPath(); ctx.arc(1000,120,50,0,Math.PI*2); ctx.fill();
  // 지면
  ctx.fillStyle='#141210';
  ctx.fillRect(0,540,1280,180);
  // 지면 라인
  ctx.strokeStyle='#2a2620'; ctx.lineWidth=1;
  for(let x=0;x<1280;x+=80){
    ctx.beginPath(); ctx.moveTo(x,540); ctx.lineTo(x-40,720); ctx.stroke();
  }

  // 성
  drawCastleShape(ctx, 210, 560, 1.0, G.save.castle.level, b.castleHP/b.castleMax);

  // 영웅
  for(const h of b.heroes){
    drawHeroSprite(ctx, h);
  }

  // 소환수
  for(const s of b.summons){
    drawSummon(ctx, s);
  }

  // 적
  for(const e of b.enemies){
    if(e.dead) continue;
    drawEnemy(ctx, e);
  }

  // 이펙트
  for(const fx of b.effects){
    drawEffect(ctx, fx, b);
  }

  // 투사체
  for(const p of b.projectiles){
    if(p.type==='heroBolt'){
      ctx.fillStyle='#d8c090';
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    } else if(p.type==='homing'){
      ctx.fillStyle='#e8a040';
      ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill();
    } else if(p.type==='iceLance'){
      ctx.strokeStyle='#a0c0e0'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+30,p.y); ctx.stroke();
    }
  }

  // 보스 체력바 (상단)
  const bosses=b.enemies.filter(e=>e.isBoss && !e.dead);
  if(bosses.length){
    const boss=bosses[0];
    const w=500, x=390, y=80;
    ctx.fillStyle='rgba(10,9,8,0.8)';
    ctx.fillRect(x,y,w,24);
    ctx.strokeStyle='#6a5040'; ctx.strokeRect(x,y,w,24);
    ctx.fillStyle='#a03030';
    ctx.fillRect(x+2,y+2,w*(boss.hp/boss.maxHp),20);
    ctx.fillStyle='#e8d8a8';
    ctx.font='12px Georgia';
    ctx.textAlign='center';
    ctx.fillText(`${boss.name}  ${Math.max(0,Math.ceil(boss.hp))} / ${boss.maxHp}`, x+w/2, y+16);
  }
}

function drawHeroSprite(ctx, h){
  const x=h.x, y=h.y;
  ctx.save();
  // 그림자
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(x,y+8,14,5,0,0,Math.PI*2); ctx.fill();
  // 몸체
  ctx.fillStyle='#3a3630';
  ctx.strokeStyle='#8a7f6a'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x,y-20,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // 이모지 아이콘
  ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(h.hero.icon, x, y-20);
  // 쿨다운 표시
  if(h.skillCd>0.1){
    ctx.strokeStyle='rgba(100,150,200,0.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y-20,14,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-h.skillCd/h.hero.cd)); ctx.stroke();
  }
  // 이름
  ctx.font='9px Georgia'; ctx.fillStyle='#a89880';
  ctx.fillText(h.hero.name, x, y+22);
  ctx.restore();
}

function drawSummon(ctx, s){
  ctx.save();
  if(s.type==='golem'){
    ctx.fillStyle='#4a4438';
    ctx.beginPath(); ctx.arc(s.x,s.y-15,18,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#8a7f6a'; ctx.stroke();
  } else if(s.type==='dog'){
    ctx.fillStyle='#2a2820';
    ctx.beginPath(); ctx.ellipse(s.x,s.y-8,12,6,0,0,Math.PI*2); ctx.fill();
  } else if(s.type==='skeleton'){
    ctx.fillStyle='#6a6050';
    ctx.beginPath(); ctx.arc(s.x,s.y-12,8,0,Math.PI*2); ctx.fill();
  } else if(s.type==='clone'){
    ctx.globalAlpha=0.5;
    ctx.fillStyle='#8a8a9a';
    ctx.beginPath(); ctx.arc(s.x,s.y-20,10,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(ctx, e){
  const x=e.x, y=e.y;
  ctx.save();
  // 그림자
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(x,y+e.size*0.6,e.size*0.8,e.size*0.3,0,0,Math.PI*2); ctx.fill();

  // 감속/스턴 표시
  let alpha=1;
  if(e.stun>0) alpha=0.6;
  ctx.globalAlpha=alpha;

  // 색상
  ctx.fillStyle=e.color || '#5a5050';
  ctx.strokeStyle='#8a7f6a'; ctx.lineWidth=1.2;

  // 형태별
  if(e.isBoss){
    ctx.beginPath(); ctx.arc(x,y-e.size*0.6,e.size,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#a03030';
    ctx.beginPath(); ctx.arc(x-10,y-e.size*0.7,5,0,Math.PI*2); ctx.arc(x+10,y-e.size*0.7,5,0,Math.PI*2); ctx.fill();
  } else if(e.shape==='ghost'){
    ctx.beginPath(); ctx.arc(x,y-e.size,e.size,Math.PI,0); ctx.lineTo(x+e.size,y); ctx.lineTo(x-e.size,y); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(e.shape==='beast'){
    ctx.beginPath(); ctx.ellipse(x,y-e.size*0.5,e.size*1.2,e.size*0.7,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  } else if(e.shape==='swarm'){
    for(let i=0;i<5;i++){
      const ang=i*1.2; const r=e.size*0.6;
      ctx.beginPath(); ctx.arc(x+Math.cos(ang)*r,y-e.size+Math.sin(ang)*r,4,0,Math.PI*2); ctx.fill();
    }
  } else if(e.shape==='crab'){
    ctx.beginPath(); ctx.ellipse(x,y-e.size*0.4,e.size*1.3,e.size*0.6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // 다리
    ctx.beginPath();
    for(let i=0;i<4;i++){ ctx.moveTo(x-e.size*1.2,y-e.size*0.3+i*4); ctx.lineTo(x-e.size*1.6,y-e.size*0.1+i*5); ctx.stroke(); }
  } else if(e.shape==='priest'){
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-e.size*0.7,y-e.size*2.5); ctx.lineTo(x+e.size*0.7,y-e.size*2.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(e.shape==='leap'){
    ctx.beginPath(); ctx.ellipse(x,y-e.size*0.8,e.size*0.5,e.size*0.9,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  } else if(e.shape==='seal'){
    ctx.fillRect(x-e.size,y-e.size*2,e.size*2,e.size*2); ctx.strokeRect(x-e.size,y-e.size*2,e.size*2,e.size*2);
    ctx.fillStyle='#3a3020'; ctx.fillRect(x-e.size*0.3,y-e.size*1.5,e.size*0.6,e.size*1.2);
  } else if(e.shape==='blob'){
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const ang=i/8*Math.PI*2;
      const r=e.size*(1+0.3*Math.sin(i*2+e.age*3));
      ctx.lineTo(x+Math.cos(ang)*r,y-e.size+Math.sin(ang)*r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x,y-e.size,e.size,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  // 체력바
  const barW=e.isBoss?80:28;
  const barX=x-barW/2, barY=e.isBoss?y-e.size*2-20:y-e.size*2.2;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(barX,barY,barW,4);
  ctx.fillStyle=e.isBoss?'#a03030':'#802020';
  ctx.fillRect(barX,barY,barW*(e.hp/e.maxHp),4);
  ctx.restore();
}

function drawEffectLegacy(ctx, fx, b){
  const t=fx.life/fx.maxLife;
  ctx.save();
  ctx.globalAlpha=t;
  switch(fx.type){
    case 'hit':
      ctx.strokeStyle='#e8e0d0'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,8*(1-t),0,Math.PI*2); ctx.stroke();
      break;
    case 'death':
      ctx.fillStyle=fx.isBoss?'#a03030':'#3a3530';
      for(let i=0;i<(fx.isBoss?8:4);i++){
        const ang=Math.random()*Math.PI*2;
        const r=Math.random()*30*(1-t);
        ctx.beginPath(); ctx.arc(fx.x+Math.cos(ang)*r,fx.y+Math.sin(ang)*r,3,0,Math.PI*2); ctx.fill();
      }
      break;
    case 'burst':
      ctx.fillStyle='#e8a040';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*(1-t),0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      break;
    case 'pool':
      ctx.fillStyle='rgba(60,40,20,0.7)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#e8a040'; ctx.lineWidth=1; ctx.stroke();
      break;
    case 'meteor':
      ctx.fillStyle='#e8c060';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*(1-t),0,Math.PI*2); ctx.fill();
      break;
    case 'laser':
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(fx.x1,fx.y1); ctx.lineTo(fx.x2,fx.y2); ctx.stroke();
      break;
    case 'eruption':
      ctx.fillStyle='#8a5a20';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*(1-t),0,Math.PI*2); ctx.fill();
      break;
    case 'lightning':
      ctx.strokeStyle='#a0c0e8'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(fx.x,fx.y-60); ctx.lineTo(fx.x+10,fx.y-30); ctx.lineTo(fx.x-5,fx.y-10); ctx.lineTo(fx.x,fx.y); ctx.stroke();
      break;
    case 'lance':
      ctx.strokeStyle='#a0c0e8'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(fx.x1,fx.y1); ctx.lineTo(fx.x2,fx.y2); ctx.stroke();
      break;
    case 'orbit':
      ctx.strokeStyle='rgba(150,170,220,0.6)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,Math.PI*2); ctx.stroke();
      for(let i=0;i<4;i++){
        const ang=b.time*2+i*Math.PI/2;
        ctx.fillStyle='#a0c0e8';
        ctx.beginPath(); ctx.arc(fx.x+Math.cos(ang)*fx.r,fx.y+Math.sin(ang)*fx.r,5,0,Math.PI*2); ctx.fill();
      }
      break;
    case 'storm':
      ctx.strokeStyle='rgba(150,150,200,0.5)'; ctx.lineWidth=2;
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*(0.3+i*0.3)*t,0,Math.PI*2); ctx.stroke();
      }
      break;
    case 'wave':
      ctx.strokeStyle='rgba(150,180,220,0.7)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*(1-t),0,Math.PI*2); ctx.stroke();
      break;
    case 'frost':
      ctx.strokeStyle='rgba(180,220,240,0.8)'; ctx.lineWidth=2;
      for(let i=0;i<8;i++){
        const ang=i/8*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(fx.x,fx.y); ctx.lineTo(fx.x+Math.cos(ang)*fx.r*t,fx.y+Math.sin(ang)*fx.r*t); ctx.stroke();
      }
      break;
    case 'blizzard':
      ctx.fillStyle='rgba(200,220,240,0.25)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,Math.PI*2); ctx.fill();
      break;
    case 'fog':
      ctx.fillStyle='rgba(180,180,200,0.2)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,Math.PI*2); ctx.fill();
      break;
    case 'tentacle':
      ctx.strokeStyle='#1a1010'; ctx.lineWidth=8; ctx.lineCap='round';
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(fx.x,fx.y);
        ctx.quadraticCurveTo(fx.x+20+i*10,fx.y-40,fx.x+Math.sin(b.time*3+i)*20,fx.y-80);
        ctx.stroke();
      }
      break;
    case 'gravity':
      ctx.fillStyle='rgba(40,20,60,0.7)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*t,0,Math.PI*2); ctx.fill();
      break;
    case 'rift':
      ctx.strokeStyle='#c0a0e0'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(fx.x,fx.y-50); ctx.lineTo(fx.x+10,fx.y); ctx.lineTo(fx.x-5,fx.y+30); ctx.stroke();
      break;
    case 'time':
      ctx.strokeStyle='rgba(200,180,140,0.5)'; ctx.lineWidth=1;
      for(let i=0;i<5;i++){
        ctx.beginPath(); ctx.arc(fx.x,fx.y,50+i*60,0,Math.PI*2); ctx.stroke();
      }
      break;
    case 'summon':
      ctx.strokeStyle='#a0a0c0'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,30*t,0,Math.PI*2); ctx.stroke();
      break;
    case 'moth':
      ctx.fillStyle='rgba(60,50,70,0.4)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,Math.PI*2); ctx.fill();
      break;
    case 'bell':
      ctx.strokeStyle='rgba(200,180,120,0.8)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,50*(1-t),0,Math.PI*2); ctx.stroke();
      break;
    case 'plague':
      ctx.fillStyle='rgba(120,160,80,0.5)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,15*(1-t),0,Math.PI*2); ctx.fill();
      break;
    case 'vines':
      ctx.strokeStyle='#4a6a3a'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(fx.x,fx.y); ctx.lineTo(fx.x,fx.y-30*t); ctx.stroke();
      break;
    case 'mark':
      ctx.strokeStyle='#c08080'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,20,0,Math.PI*2); ctx.stroke();
      break;
    case 'sleep':
      ctx.fillStyle='rgba(80,60,100,0.2)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r,0,Math.PI*2); ctx.fill();
      break;
    case 'seal':
      ctx.strokeStyle='rgba(200,180,120,0.6)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,fx.r*(1-t),0,Math.PI*2); ctx.stroke();
      break;
    case 'shield':
      ctx.strokeStyle='rgba(200,220,255,0.7)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(fx.x,fx.y,120*t,0,Math.PI*2); ctx.stroke();
      break;
    case 'castleHit':
      ctx.fillStyle='rgba(200,80,60,0.5)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,30*t,0,Math.PI*2); ctx.fill();
      break;
    case 'bossSpecial':
      ctx.fillStyle='rgba(200,80,60,0.6)';
      ctx.beginPath(); ctx.arc(fx.x,fx.y,50*(1-t),0,Math.PI*2); ctx.fill();
      break;
  }
  ctx.restore();
}

function updateBattleHUD(){

  if(!b) return;
  $('#bStage').textContent=b.stage;
  $('#bTime').textContent=fmtTime(b.time);
  $('#bLevel').textContent=b.level;
  $('#bCoins').textContent=b.tempCoins;
  $('#castleHP').textContent=Math.max(0,Math.ceil(b.castleHP));
  $('#castleMax').textContent=b.castleMax;
  $('#castleFill').style.width=Math.max(0,b.castleHP/b.castleMax*100)+'%';
  $('#manaTxt').textContent=Math.floor(b.mana);
  $('#manaFill').style.width=(b.mana/b.manaMax*100)+'%';
}

function renderHudSlots(){
  const b=G.battle; if(!b) return;
  const hud=$('#hudBottom'); hud.innerHTML='';
  for(const h of b.heroes){
    const el=document.createElement('div');
    el.className='hudSlot';
    el.innerHTML=`${h.hero.icon}`;
    el.title=h.hero.name;
    hud.appendChild(el);
  }
}

function rarityToClass(r){ return 'rarity-'+r; }
function rarityKo(r){ return {common:'일반',uncommon:'고급',rare:'희귀',epic:'영웅',legendary:'전설'}[r]; }

// 등급 가중치 (시간 기반)
function getRarityWeights(timeMin){
  // 0-5,5-10,... 
  if(timeMin<5) return {common:60,uncommon:25,rare:12,epic:3,legendary:0};
  if(timeMin<10) return {common:55,uncommon:25,rare:15,epic:5,legendary:0};
  if(timeMin<15) return {common:48,uncommon:25,rare:18,epic:9,legendary:0};
  if(timeMin<20) return {common:42,uncommon:24,rare:21,epic:13,legendary:0};
  if(timeMin<25) return {common:36,uncommon:23,rare:24,epic:17,legendary:0};
  if(timeMin<30) return {common:30,uncommon:22,rare:26,epic:22,legendary:0};
  if(timeMin<35) return {common:25,uncommon:20,rare:28,epic:27,legendary:0};
  return {common:20,uncommon:18,rare:30,epic:32,legendary:0};
}

function rollRarity(weights){
  const total=Object.values(weights).reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(const [k,v] of Object.entries(weights)){
    r-=v;
    if(r<=0) return k;
  }
  return 'common';
}

function pickWeighted(arr, weights){
  // 등급 필터
  const pool=arr.filter(x=>weights[x.rarity]>0);
  if(!pool.length) return arr[0];
  const total=pool.reduce((s,x)=>s+weights[x.rarity],0);
  let r=Math.random()*total;
  for(const x of pool){
    r-=weights[x.rarity];
    if(r<=0) return x;
  }
  return pool[pool.length-1];
}

function showCardSelection(info){
  const b=G.battle;
  const timeMin=b.time/60;
  const isTimeReward=info.time;
  const isLegendaryGuarantee=info.legendary;
  const badd=G.battle;

  // 등급 가중치
  let weights=getRarityWeights(timeMin);
  if(isLegendaryGuarantee) weights.legendary=100;
  if(isTimeReward && info.minute===5){ /* 최소 1 희귀 */ }
  if(isTimeReward && info.minute===15){ /* 최소 1 영웅 */ }

  // 카테고리 확률
  const catWeights = isTimeReward ? {artifact:50,trait:35,hero:15} : {artifact:40,trait:45,hero:15};

  // 카드 3장 생성
  const cards=[];
  const usedIds=new Set();
  for(let i=0;i<3;i++){
    // 카테고리 선택
    let catR=Math.random()*100;
    let cat='artifact';
    if(catR<catWeights.artifact) cat='artifact';
    else if(catR<catWeights.artifact+catWeights.trait) cat='trait';
    else cat='hero';

    let picked=null;
    if(cat==='artifact'){
      const pool=ARTIFACTS.filter(a=>!badd.artifacts[a.id] && !usedIds.has('a_'+a.id));
      if(pool.length) picked={...pickWeighted(pool,weights), _key:'a_'+pickWeighted(pool,weights).id};
    }
    if(cat==='trait'){
      const pool=TRAITS.filter(t=>((badd.traits[t.id]||0)<t.max) && !usedIds.has('t_'+t.id));
      if(pool.length){ const p=pickWeighted(pool,weights); picked={...p, cat:'trait', _key:'t_'+p.id}; }
    }
    if(cat==='hero'){
      if(b.heroes.length){
        const hero=b.heroes[Math.floor(Math.random()*b.heroes.length)];
        const pool=HERO_UPGRADES.filter(u=>!usedIds.has('h_'+u.id+'_'+hero.id));
        if(pool.length){ const p=pickWeighted(pool,weights); picked={...p, cat:'hero', heroId:hero.id, heroName:hero.hero.name, _key:'h_'+p.id+'_'+hero.id}; }
      }
    }
    if(!picked){
      // fallback
      const pool=ARTIFACTS.filter(a=>!badd.artifacts[a.id]);
      if(pool.length) picked={...pool[0], cat:'artifact', _key:'a_'+pool[0].id};
    }
    if(picked && !usedIds.has(picked._key)){
      usedIds.add(picked._key);
      cards.push(picked);
    }
  }

  // 시간 보상 등급 보장
  if(isTimeReward && info.minute===5 && !cards.some(c=>['rare','epic','legendary'].includes(c.rarity))){
    cards[0]=forceRarityCard('rare');
  }
  if(isTimeReward && info.minute===15 && !cards.some(c=>['epic','legendary'].includes(c.rarity))){
    cards[0]=forceRarityCard('epic');
  }

  // UI
  const row=$('#cardRow'); row.innerHTML='';
  for(const c of cards){
    const el=document.createElement('div');
    el.className='card '+rarityToClass(c.rarity);
    const catKo=c.cat==='artifact'?'아티팩트':c.cat==='trait'?'특성':'영웅 강화';
    const desc = c.cat==='hero' ? `[${c.heroName}] ${c.desc}` : c.desc;
    el.innerHTML=`
      <div class="cardArt"><img src="${cardSigilUrl(c)}" alt="${c.name}"></div>
      <div class="cardCat">${catKo}</div>
      <div class="cardName">${c.name}</div>
      <div class="cardDesc">${desc}</div>
      <div class="cardRarity">${rarityKo(c.rarity)}</div>
    `;
    el.onclick=()=>selectCard(c);
    row.appendChild(el);
  }

  $('#cardSubTxt').textContent = isTimeReward ?
    `⏱ ${info.minute}분 시간 보상${isLegendaryGuarantee?' — 전설 카드 보장!':''}` :
    `레벨 ${b.level} 달성 — 카드를 선택하세요`;
  $('#cardModal').classList.add('open');
}

function forceRarityCard(rarity){
  const pool=ARTIFACTS.filter(a=>a.rarity===rarity && !G.battle.artifacts[a.id]);
  if(pool.length) return {...pool[0], cat:'artifact', _key:'a_'+pool[0].id};
  return {...ARTIFACTS.find(a=>a.rarity===rarity), cat:'artifact', _key:'a_'+ARTIFACTS.find(a=>a.rarity===rarity).id};
}

function selectCard(c){
  const b=G.battle;
  if(c.cat==='artifact'){
    b.artifacts[c.id]=true;
    // 즉시 적용
    if(c.id==='glass_heart'){ b.castleMax*=1.08; b.castleHP*=1.08; }
  } else if(c.cat==='trait'){
    b.traits[c.id]=(b.traits[c.id]||0)+1;
    if(c.id==='strong_wall'){ b.castleMax*=1.06; b.castleHP*=1.06; }
  } else if(c.cat==='hero'){
    const h=b.heroes.find(x=>x.id===c.heroId);
    if(h){
      if(c.id==='fine_atk') h.buffs.dmg=(h.buffs.dmg||1)*1.15;
      if(c.id==='power_skill') h.buffs.skill=(h.buffs.skill||1)*1.18;
      if(c.id==='quick_reuse') h.buffs.cd=(h.buffs.cd||1)*0.9;
      if(c.id==='efficient_cast') h.buffs.mana=(h.buffs.mana||1)*0.88;
      if(c.id==='expanded_range') h.buffs.range=(h.buffs.range||1)*1.15;
      if(c.id==='sharp_proj') h.buffs.dmg=(h.buffs.dmg||1)*1.15;
      if(c.id==='enhanced_summon') h.buffs.summon=(h.buffs.summon||1)*1.15;
      if(c.id==='hunt_instinct') h.buffs.bossDmg=(h.buffs.bossDmg||1)*1.12;
      if(c.id==='guardian_will') h.buffs.shield=(h.buffs.shield||1)*1.18;
      if(c.id==='focused_shot') h.buffs.dmg=(h.buffs.dmg||1)*1.10;
    }
  }
  $('#cardModal').classList.remove('open');
  b.paused=false;
  // 다음 카드 있으면 처리
  if(b.cardQueue.length){
    setTimeout(()=>{
      const cq=b.cardQueue.shift();
      showCardSelection(cq);
      b.paused=true;
    }, 100);
  }
}

   ========================================================= */
function winBattle(){
  const b=G.battle;
  if(b.gameOver) return;
  b.gameOver=true;
  b.waveCleared=true;
  // 코인 지급
  G.save.coins+=b.tempCoins;
  if(G.save.stage>=G.save.maxStage) G.save.maxStage=G.save.stage;
  G.save.stage=G.save.stage+1;
  G.save.castle.maxHP=castleMaxHP();
  writeSave();

  // 결과 화면
  $('#resTitle').textContent='승리';
  $('#resSub').textContent=`STAGE ${b.stage} CLEAR`;
  $('#resultModal').classList.remove('lose');
  $('#resultModal').classList.add('win','open');
  const totalKills=b.totalKills-b.bossKills;
  $('#resultStats').innerHTML=`
    <div class="rs"><div class="lbl">처치 몬스터</div><div class="val">${totalKills}</div></div>
    <div class="rs"><div class="lbl">보스 처치</div><div class="val">${b.bossKills}</div></div>
    <div class="rs"><div class="lbl">획득 코인</div><div class="val">🪙${b.tempCoins}</div></div>
    <div class="rs"><div class="lbl">전투 경험치</div><div class="val">${Math.round(b.xp)}</div></div>
  `;
  // 가장 많은 피해 영웅
  let topId=null, topDmg=0;
  for(const [id,d] of Object.entries(b.log.heroDmg)){
    if(d>topDmg){ topDmg=d; topId=+id; }
  }
  if(topId){
    const h=HEROES.find(x=>x.id===topId);
    if(h){
      $('#resultStats').innerHTML += `<div class="rs"><div class="lbl">MVP</div><div class="val" style="font-size:14px;">${h.icon} ${h.name}</div></div>`;
    }
  }
}

function loseBattle(){
  const b=G.battle;
  if(b.gameOver) return;
  b.gameOver=true;
  // 임시 코인/카드 폐기
  $('#resTitle').textContent='성 함락';
  $('#resSub').textContent='STAGE FAILED';
  $('#resultModal').classList.remove('win');
  $('#resultModal').classList.add('lose','open');
  $('#resultStats').innerHTML=`
    <div class="rs"><div class="lbl">생존 시간</div><div class="val">${fmtTime(b.time)}</div></div>
    <div class="rs"><div class="lbl">처치한 적</div><div class="val">${b.totalKills}</div></div>
    <div class="rs"><div class="lbl">잃은 임시 코인</div><div class="val">🪙${b.tempCoins}</div></div>
  `;
}

function confirmResult(){
  $('#resultModal').classList.remove('open','win','lose');
  G.battle=null;
  // 허브로
  $('#screen-battle').classList.remove('active');
  $('#screen-hub').classList.add('active');
  G.screen='hub';
  renderHub();
  if(battleRAF){ cancelAnimationFrame(battleRAF); battleRAF=null; }
}

   버튼 이벤트
   ========================================================= */
function bindUI(){
  // 허브
  $('#btnStartBattle').onclick=()=>{ startBattle(); };
  $('#btnHeroManage').onclick=()=>{ selHeroId=null; openHeroManage(); };
  $('#btnCastleUpgrade').onclick=()=>{ openCastleUpgrade(); };
  $('#btnDaily').onclick=()=>{ openDaily(); };
  $('#btnDailyTop').onclick=()=>{ openDaily(); };

  // 모달 닫기
  $$('[data-close]').forEach(b=>{
    b.onclick=()=>{ $('#'+b.dataset.close).classList.remove('open'); };
  });

  // 전투
  $('#btnPause').onclick=()=>{
    const b=G.battle; if(!b) return;
    b.paused=!b.paused;
    $('#btnPause').textContent=b.paused?'▶':'⏸';
  };
  $('#btnSpeed').onclick=()=>{
    const b=G.battle; if(!b) return;
    b.speed=b.speed===1?2:1;
    $('#btnSpeed').textContent=b.speed+'×';
  };
  $('#btnQuit').onclick=()=>{
    if(!confirm('전투에서 나가시겠습니까? 이번 시도는 패배로 처리됩니다.')) return;
    loseBattle();
  };

  // 결과 확인
  $('#btnResConfirm').onclick=()=>{ confirmResult(); };
}

   ========================================================= */
function init(){
  fitStage();
  G.save=loadSave();
  // formation 길이 보장
  const slots=castleSlots();
  while(G.save.formation.length<slots) G.save.formation.push(null);
  G.save.formation=G.save.formation.slice(0,slots);
  // 영웅 저장 구조 보장
  for(const h of HEROES) heroSave(h.id);
  writeSave();

  renderHub();
  bindUI();

  // 첫 화면
  $('#screen-hub').classList.add('active');
  $('#screen-battle').classList.remove('active');
}

function fitStage(){
  const stage=$('#stage');
  const w=window.innerWidth, h=window.innerHeight;
  const scale=Math.min(w/1280,h/720);
  stage.style.transform=`scale(${scale})`;
  stage.style.transformOrigin='top left';
  stage.style.left=((w-1280*scale)/2)+'px';
  stage.style.top=((h-720*scale)/2)+'px';
  stage.style.position='absolute';
}

function buildSpawnQueue(){
  const b=G.battle;b.spawnQueue=[];
  const countMul=b.stageMul.countMul;
  for(const seg of SPAWN_TABLE){
    const segStart=seg.t,segEnd=segStart+300;
    const bag=[];
    for(const [key,baseCount] of Object.entries(seg)){
      if(key==='t')continue;
      const factor=WEAK_MOB_KEYS.has(key)?12:1;
      const count=Math.ceil(baseCount*factor*countMul);
      for(let i=0;i<count;i++)bag.push(key);
    }
    // Shuffle enemy types so each wave is a mixed pack rather than a long block of one species.
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
    const groups=[];let index=0;
    while(index<bag.length){
      const remaining=bag.length-index;
      let size=remaining<=20?remaining:12+Math.floor(Math.random()*9); // 12–20 per pack
      if(remaining>20 && remaining-size<10)size=remaining-10; // avoid a tiny tail pack
      size=Math.min(size,remaining);
      groups.push(bag.slice(index,index+size));index+=size;
    }
    const interval=300/Math.max(1,groups.length);
    groups.forEach((group,gi)=>{
      const center=segStart+(gi+.5)*interval;
      const start=clamp(center+(Math.random()-.5)*interval*.26,segStart,segEnd-1);
      const lane=.08+Math.random()*.84;
      group.forEach((key,j)=>{
        b.spawnQueue.push({t:start+j*(.10+Math.random()*.045),key,lane:clamp(lane+(Math.random()-.5)*.18,.03,.97),pack:gi});
      });
    });
  }
  for(const boss of BOSSES)b.spawnQueue.push({t:boss.t,key:'BOSS:'+boss.name,boss,lane:.52,pack:'boss'});
  b.spawnQueue.sort((a,b)=>a.t-b.t);
}

      coin:boss.coin*b.stageMul.reward,xp:boss.xp*b.stageMul.reward,size:boss.size*depthScale,sizeBase:boss.size,color:boss.color,

      coin:m.coin*b.stageMul.reward,xp:m.xp*b.stageMul.reward,size:m.size*depthScale,sizeBase:m.size,color:m.color,shape:m.shape,
      ranged:!!m.ranged,stopX:targetX,slow:0,stun:0,dot:[],age:0,moving:true,markTimer:0});

function updateEnemies(dt){
  const b=G.battle;
  if(b.artifacts.last_candle&&!b.lastCandleUsed&&b.castleHP>0&&b.castleHP/b.castleMax<=.15){b.lastCandleUsed=true;b.castleHP=Math.min(b.castleMax,b.castleHP+b.castleMax*.32);b.effects.push({type:'shield',x:245,y:515,life:1,maxLife:1});toast('마지막 촛불이 성을 되살렸습니다.');}
  if(b.artifacts.rift_heart){b.riftHeartTimer=(b.riftHeartTimer||0)+dt;if(b.riftHeartTimer>=10){b.riftHeartTimer-=10;const owner=b.heroes[0];if(owner){const pulse=heroBaseDmg(owner.level)*5;for(const e of b.enemies){if(!e.dead)applyHeroDamage(owner,e,pulse,true);}}}}
  b.enemies=b.enemies.filter(e=>!e.dead);
  for(const e of b.enemies){
    e.age+=dt;
    if(e.markTimer>0){e.markTimer-=dt;if(e.markTimer<=0)e.marked=false;}
    let stunned=e.stun>0;if(stunned)e.stun=Math.max(0,e.stun-dt);
    if(e.slow>0)e.slow=Math.max(0,e.slow-dt);
    if(e.dot&&e.dot.length){
      for(const d of e.dot){e.hp-=d.dps*dt;d.dur-=dt;}
      e.dot=e.dot.filter(d=>d.dur>0);
      if(e.hp<=0){killEnemy(e);continue;}
    }
    if(stunned)continue;
    let slowMul=e.slow>0?(e.slowDebuff40?.6:.7):1;
    if(e.freezeSlow)slowMul=Math.min(slowMul,.6);
    if(e.x>e.targetX){
      e.x-=e.spd*slowMul*dt;
      e.progress=clamp((e.spawnX-e.x)/(e.spawnX-e.targetX),0,1);
      e.y=e.startY+(e.targetY-e.startY)*e.progress;
      e.renderScale=.70+clamp((e.y-320)/340,0,1)*.62;
      e.size=(e.isBoss?e.sizeBase||e.size:e.sizeBase||MONSTERS[e.type].size)*e.renderScale;
    }else{
      e.atkCd-=dt;
      if(e.atkCd<=0){
        e.atkCd=e.atkInt;
        let damage=e.atk;
        if(b.artifacts.abyss_shell)damage*=.9;
        if(b.traits.overwhelm)damage*=1.05;
        b.castleHP-=damage;b.log.castleDamage+=damage;
        b.effects.push({type:'castleHit',x:245,y:525+((e.lane||.5)-.5)*80,life:.38,maxLife:.38});
      }
    }
    // Boss abilities only strike after the boss has reached the inner field; no remote damage from spawn.
    if(e.isBoss && e.x<620){
      e.specCd-=dt;
      if(e.specCd<=0){
        e.specCd=13;
        const special=e.name==='흑설탕 거석'?150:e.name==='심해 기계수'?185:e.name==='쌍월룡'?240:120;
        if(e.name!=='층을 삼킨 망령'){
          let damage=special;if(b.artifacts.abyss_shell)damage*=.9;if(b.traits.overwhelm)damage*=1.05;
          b.castleHP-=damage;b.log.castleDamage+=damage;
          b.effects.push({type:'bossSpecial',x:245,y:520,life:.65,maxLife:.65});
        }
        if(e.name==='쌍월룡')for(const h of b.heroes)h.atkCd=Math.min(h.atkCd+.35,3);
      }
    }
    if(e.isBoss&&e.name==='층을 삼킨 망령'&&!e.phase2&&e.hp<e.maxHp*.5){e.phase2=true;e.slow=2.5;}
    if(e.isBoss&&e.name==='쌍월룡'&&!e.phase2&&e.hp<e.maxHp*.5){e.phase2=true;e.spd*=1.15;}
  }
}

function heroStatMul(h,key){
  let m=h.buffs[key]||1;const b=G.battle;
  if(b.artifacts.black_wax&&key==='skill')m*=1.08;
  if(b.artifacts.dead_star&&key==='skill')m*=1.18;
  if(b.artifacts.nameless_crown)m*=1.25;
  if(b.traits.condensed_mana&&key==='skill')m*=Math.pow(1.07,b.traits.condensed_mana);
  if(b.traits.strong_bullet&&key==='dmg')m*=Math.pow(1.07,b.traits.strong_bullet);
  if(b.traits.overwhelm)m*=Math.pow(1.12,b.traits.overwhelm);
  if(b.castleHP/b.castleMax<.3&&b.traits.last_defense&&key==='dmg')m*=1.2;
  return m;
}
function applyHeroDamage(h,enemy,amount,isSkill){
  if(!enemy||enemy.dead||enemy.hp<=0)return 0;
  let dmg=amount*heroStatMul(h,isSkill?'skill':'dmg');
  if(enemy.isBoss){if(G.battle.artifacts.hunter_lens)dmg*=1.15;if(G.battle.traits.boss_hunt)dmg*=Math.pow(1.10,G.battle.traits.boss_hunt);if(h.buffs.bossDmg)dmg*=h.buffs.bossDmg;}
  else if(G.battle.artifacts.rusty_fang)dmg*=1.10;
  if(enemy.marked&&G.battle.artifacts.mark_ring)dmg*=1.10;
  const critChance=Math.min(.45,.03*(G.battle.traits.precise_aim||0));
  if(!isSkill&&Math.random()<critChance){dmg*=1.75;G.battle.effects.push({type:'crit',x:enemy.x,y:enemy.y-22,life:.35,maxLife:.35});}
  dealDamageToEnemy(enemy,dmg,h.id);return dmg;
}

function findTargetForHero(hero=null){
  const b=G.battle;
  const live=b.enemies.filter(e=>!e.dead&&e.hp>0);
  if(!live.length)return null;
  if(!hero){live.sort((a,b)=>(a.x-b.x)||(a.hp-b.hp));return live[0];}
  const attackRange=hero.attackRange||520;
  const inRange=live.filter(e=>Math.hypot(e.x-hero.x,e.y-hero.y)<=attackRange);
  if(!inRange.length)return null;
  let best=null,bestScore=Infinity;
  for(const e of inRange){
    const incoming=b.projectiles.filter(p=>p.type==='heroBolt'&&p.target===e).length;
    const lanePenalty=Math.abs(e.y-hero.y)*.52;
    const bossPriority=hero.buffs&&hero.buffs.bossDmg&&e.isBoss?-260:0;
    const score=e.x+lanePenalty+incoming*230+bossPriority;
    if(score<bestScore){best=e;bestScore=score;}
  }
  return best;
}

function updateHero(h,dt){
  const b=G.battle;if(!h)return;
  h.atkCd-=dt;
  if(h.atkCd<=0){
